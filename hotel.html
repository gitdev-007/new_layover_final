<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StayMarket | Discovery Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#9d4300",
                        "primary": "#4648d4",
                        "primary-container": "#6063ee",
                        "on-background": "#0b1c30"
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
            font-size: 1.25rem;
        }
        .main-layout {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .main-layout.side-by-side {
            justify-content: flex-start;
        }
        .level1 { width: 600px; }
        .level2 { width: 600px; display: none; }
        .item-card {
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #e2e8f0;
        }
        .item-card:hover {
            background-color: rgba(70, 72, 212, 0.05);
            border-color: #4648d4;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(70, 72, 212, 0.1);
        }
        .nav-link { cursor: pointer; transition: all 0.2s; position: relative; }
        .nav-link.active {
            color: #4648d4;
            font-weight: 800;
        }
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #4648d4;
            border-radius: 99px;
        }
        .category-tab {
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }
        .category-tab.active {
            color: #4648d4;
            border-bottom-color: #4648d4;
            font-weight: 800;
        }
        .filter-field { cursor: pointer; outline: none; border: 1px solid #e2e8f0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: white; padding: 12px; border-radius: 20px;
            max-width: 90%; max-height: 90%; position: relative;
        }

        /* Accordion */
        .accordion-item { border-bottom: 1px solid #f1f5f9; }
        .accordion-header { cursor: pointer; padding: 14px 0; display: flex; justify-content: space-between; align-items: center; }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .accordion-item.active .accordion-content { max-height: 300px; }
        .accordion-item.active .chevron-icon { transform: rotate(180deg); color: #4648d4; }
        .chevron-icon { transition: transform 0.3s; }
    </style>
</head>
<body class="bg-[#f8fafc] text-on-background font-inter antialiased p-8">

<!-- REUSABLE MEDIA MODAL -->
<div id="media-modal" class="modal-overlay" onclick="closeMediaModal(event)">
    <div class="modal-content text-center shadow-2xl" onclick="event.stopPropagation()">
        <button class="absolute -top-12 right-0 text-white flex items-center gap-2 font-black tracking-widest hover:text-indigo-400 transition-colors" onclick="closeMediaModal()">
            <span class="material-symbols-outlined">close</span> CLOSE
        </button>
        <div class="relative w-[700px] h-[450px] bg-slate-900 rounded-xl flex items-center justify-center overflow-hidden">
            <button class="absolute left-4 bg-white/10 hover:bg-white/25 text-white p-4 rounded-full transition-all backdrop-blur-sm" onclick="changeImage(-1)">
                <span class="material-symbols-outlined">arrow_back_ios</span>
            </button>
            <div id="modal-image-container" class="w-full h-full flex flex-col items-center justify-center p-12">
                <span class="material-symbols-outlined text-slate-800 text-[120px]">photo_camera</span>
                <p id="modal-caption" class="mt-6 text-slate-500 text-xs font-black uppercase tracking-[0.3em]">Cinematic Preview 1.0X</p>
            </div>
            <button class="absolute right-4 bg-white/10 hover:bg-white/25 text-white p-4 rounded-full transition-all backdrop-blur-sm" onclick="changeImage(1)">
                <span class="material-symbols-outlined">arrow_forward_ios</span>
            </button>
        </div>
    </div>
</div>

<!-- HEADER -->
<header class="bg-white border-b border-slate-200 flex justify-between items-center w-full px-10 py-5 mb-12 shadow-sm sticky top-0 z-50">
    <div class="flex items-center gap-4">
        <h1 class="text-2xl font-black tracking-tighter text-slate-900">StayMarket</h1>
        <span class="text-[9px] bg-indigo-600 text-white px-3 py-1 font-black rounded-full uppercase tracking-widest">Discovery Engine</span>
    </div>
    <nav class="hidden md:flex gap-10 items-center">
        <a id="nav-browse" class="nav-link text-slate-500 hover:text-indigo-600 font-manrope text-sm font-black uppercase tracking-widest" onclick="setUIState('browse')">Browse</a>
        <a id="nav-deals" class="nav-link text-slate-500 hover:text-indigo-600 font-manrope text-sm font-black uppercase tracking-widest" onclick="setUIState('deals')">Deals</a>
        <a class="text-slate-400 hover:text-indigo-600 font-manrope text-sm font-black uppercase tracking-widest" href="#">Reservations</a>
    </nav>
    <div class="flex gap-6 items-center">
        <span class="material-symbols-outlined text-slate-400 hover:text-indigo-600 cursor-pointer">notifications</span>
        <div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center cursor-pointer hover:bg-indigo-200 transition-colors">
            <span class="material-symbols-outlined text-indigo-600">person</span>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto">
<div id="main-layout" class="main-layout">
    <!-- LEVEL 1: DISCOVERY -->
    <div id="level1" class="level1 space-y-8">
        <div class="bg-white border border-slate-200 p-8 rounded-3xl shadow-xl shadow-slate-200/50">
            <!-- Category Bar -->
            <div class="flex gap-8 border-b border-slate-100 mb-8 overflow-x-auto pb-4 no-scrollbar">
                <span class="category-tab active text-[10px] pb-4 px-1 uppercase tracking-[0.2em] font-black" onclick="setCategory('All Experiences')">All</span>
                <span class="category-tab text-[10px] pb-4 px-1 uppercase tracking-[0.2em] font-black" onclick="setCategory('Hotels')">Hotels</span>
                <span class="category-tab text-[10px] pb-4 px-1 uppercase tracking-[0.2em] font-black" onclick="setCategory('Dining')">Dining</span>
                <span class="category-tab text-[10px] pb-4 px-1 uppercase tracking-[0.2em] font-black" onclick="setCategory('Wellness')">Wellness</span>
                <span class="category-tab text-[10px] pb-4 px-1 uppercase tracking-[0.2em] font-black" onclick="setCategory('Gaming')">Gaming</span>
            </div>

            <div class="flex justify-between items-center mb-8">
                <h3 id="category-title" class="text-3xl font-black text-slate-900 tracking-tighter">All Experiences</h3>
                <div class="flex items-center gap-2 bg-green-50 text-green-700 px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest border border-green-100">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Terminal Hub
                </div>
            </div>

            <!-- Enhanced Filters -->
            <div class="bg-slate-50 border border-slate-200 p-6 rounded-2xl mb-8">
                <div class="grid grid-cols-2 gap-4 mb-5">
                    <select class="filter-field bg-white px-4 py-3 rounded-xl text-[11px] font-black uppercase tracking-widest shadow-sm" data-filter-field="duration" onchange="applyFilters()">
                        <option value="">Any Duration</option>
                        <option value="2">2 Hours</option>
                        <option value="4">4 Hours</option>
                        <option value="8">8 Hours</option>
                    </select>
                    <select class="filter-field bg-white px-4 py-3 rounded-xl text-[11px] font-black uppercase tracking-widest shadow-sm" data-filter-field="priceClass" onchange="applyFilters()">
                        <option value="">All Tiers</option>
                        <option value="Luxury">Luxury</option>
                        <option value="Premium">Premium</option>
                        <option value="Budget">Budget</option>
                    </select>
                </div>
                <div class="flex items-center justify-between gap-4">
                    <select class="filter-field flex-1 bg-white px-4 py-3 rounded-xl text-[11px] font-black uppercase tracking-widest shadow-sm" data-filter-field="distance" onchange="applyFilters()">
                        <option value="999">Within Global</option>
                        <option value="1">Within 1 km</option>
                        <option value="5">Within 5 km</option>
                        <option value="10">Within 10 km</option>
                    </select>
                    <label class="flex items-center gap-3 cursor-pointer bg-white border border-slate-200 px-5 py-3 rounded-xl shadow-sm hover:border-indigo-300 transition-all">
                        <input type="checkbox" id="sort-nearest" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300" onchange="applyFilters()">
                        <span class="text-[10px] font-black text-slate-700 uppercase tracking-widest">Nearest First</span>
                    </label>
                </div>
            </div>

            <!-- List Container -->
            <div id="inventory-container" class="space-y-10"></div>
        </div>
    </div>

    <!-- LEVEL 2: SELECTION -->
    <div id="level2" class="level2 space-y-8"></div>
</div>
</main>

<script>
    // --- DATA ENGINE ---
    const allData = {
        'Hotels': [
            { name: 'Taj Santacruz', category: 'Luxury', distance: 1.6, duration: '2', rating: '4.9', type: 'Luxury Hotel', price: '₹2200 - ₹8200', location: 'Santacruz', icon: 'hotel', options: [{label: 'King Suite', desc: 'Pool view with butler.'}, {label: 'Grand Club', desc: 'Lounge access included.'}] },
            { name: 'JW Marriott Sahar', category: 'Luxury', distance: 1.8, duration: '2', rating: '4.8', type: 'Resort Stay', price: '₹2100 - ₹7800', location: 'Andheri East', icon: 'hotel', options: [{label: 'Studio Room', desc: 'Integrated workspace.'}, {label: 'Executive', desc: 'Premium city view.'}] },
            { name: 'Hotel Sahara Star', category: 'Premium', distance: 1.1, duration: '2', rating: '4.7', type: 'Transit Hub', price: '₹1400 - ₹5200', location: 'Domestic Airport', icon: 'hotel', options: [{label: 'Mercury Room', desc: 'Modern styling.'}, {label: 'Earth Room', desc: 'Garden view.'}] },
            { name: 'The Orchid Hotel', category: 'Budget', distance: 0.9, duration: '2', rating: '4.8', type: 'Eco Stay', price: '₹1200 - ₹4500', location: 'Vile Parle', icon: 'hotel', options: [{label: 'Business Room', desc: 'Focused on efficiency.'}] }
        ],
        'Dining': [
            { name: "Thai Naam", category: "Luxury", distance: 1.8, duration: '2', rating: '4.8', type: 'Premium Thai', price: "₹3800 - ₹7500", location: 'Sahar', icon: 'restaurant', options: [{label: 'Chef Tasting', desc: '7-course signature menu.'}, {label: 'Set Lunch', desc: 'Quick premium bites.'}] },
            { name: "JW Cafe", category: "Premium", distance: 1.8, duration: '2', rating: '4.7', type: 'Global Buffet', price: "₹1800 - ₹3000", location: 'JW Marriott', icon: 'restaurant', options: [{label: 'Sunday Brunch', desc: 'Extensive food spread.'}] },
            { name: "Cafe Coffee Day", category: "Budget", distance: 0.4, duration: '2', rating: '4.2', type: 'Quick Bites', price: "₹150 - ₹550", location: 'T1 Terminal', icon: 'restaurant', options: [{label: 'Combo Deal', desc: 'Snack and coffee pack.'}] }
        ],
        'Wellness': [
            { name: "Jiva Spa", category: "Luxury", distance: 1.6, duration: '2', rating: '4.9', type: 'Ayurvedic', price: "₹3500 - ₹28000", location: 'Taj Santacruz', icon: 'spa', options: [{label: 'Vishudhi', desc: 'Full body detox.'}, {label: 'Sushupti', desc: 'Deep sleep therapy.'}] }
        ],
        'Gaming': [
            { name: "Zero Latency", category: "Premium", distance: 16.5, duration: '2', rating: '4.9', type: 'VR Arena', price: "₹1200 - ₹2000", location: 'Todi Mills', icon: 'sports_esports', options: [{label: 'Outbreak', desc: 'Zombie survival mode.'}, {label: 'Singularity', desc: 'Space exploration.'}] }
        ]
    };

    let uiState = {
        activeTab: "browse",
        selectedItem: null,
        currentCategory: 'All Experiences',
        currentImageIndex: 0
    };

    // --- REUSABLE COMPONENTS ---
    function openMediaModal() { uiState.currentImageIndex = 0; document.getElementById('media-modal').classList.add('active'); updateModalContent(); }
    function closeMediaModal() { document.getElementById('media-modal').classList.remove('active'); }
    function changeImage(dir) { uiState.currentImageIndex = (uiState.currentImageIndex + dir + 3) % 3; updateModalContent(); }
    function updateModalContent() { document.getElementById('modal-caption').textContent = `PERSPECTIVE ANGLE ${uiState.currentImageIndex + 1}.0X`; }
    function toggleAccordion(el) { el.closest('.accordion-item').classList.toggle('active'); }

    // --- RENDER LOGIC ---
    function renderInventory(dur = '', cat = '', maxDist = 999, sortNearest = false) {
        const container = document.getElementById('inventory-container');
        let items = [];
        if (uiState.currentCategory === 'All Experiences') {
            Object.values(allData).forEach(catItems => items = [...items, ...catItems]);
        } else {
            items = allData[uiState.currentCategory] || [];
        }

        // Logic Fix: item.distance <= selectedDistance
        let filtered = items.filter(item => {
            if (dur && item.duration !== dur) return false;
            if (cat && item.category !== cat) return false;
            if (item.distance > parseFloat(maxDist)) return false; 
            return true;
        });

        if (sortNearest) filtered.sort((a, b) => a.distance - b.distance);

        let html = '';
        ['Luxury', 'Premium', 'Budget'].forEach(tier => {
            const group = filtered.filter(i => i.category === tier);
            if (group.length === 0) return;
            html += `
                <div class="inventory-group">
                    <p class="text-[10px] font-black text-indigo-600 mb-5 uppercase tracking-[0.3em] flex items-center gap-4">
                        <span class="w-10 h-[1px] bg-indigo-100"></span> ${tier} Tier Discovery
                    </p>
                    <div class="grid grid-cols-2 gap-5">
                        ${group.map(item => `
                            <div class="item-card p-5 bg-white rounded-2xl shadow-sm" onclick="selectItem('${item.name}')">
                                <div class="flex flex-col gap-3">
                                    <div class="flex justify-between items-start">
                                        <span class="text-[13px] font-black text-slate-800 leading-tight">${item.name}</span>
                                        <span class="text-[9px] bg-slate-50 px-2 py-1 rounded-lg text-indigo-600 font-black border border-indigo-50">${item.distance} KM</span>
                                    </div>
                                    <div class="flex items-center gap-3 text-[9px] font-bold text-slate-400 uppercase tracking-widest">
                                        <span class="material-symbols-outlined text-[14px]">${item.icon}</span> ${item.type} • ${item.location}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html || '<div class="py-20 text-center text-slate-300 font-black uppercase text-xs tracking-widest">System Search: 0 Results</div>';
    }

    const renderLevel2 = (detail) => {
        const optionLabel = { 'Hotels': 'Room Options', 'Dining': 'Menu Selection', 'Wellness': 'Therapy List', 'Gaming': 'Mission Packs' }[uiState.currentCategory] || 'Discovery Options';

        return `
        <div class="flex items-center justify-between mb-4">
            <span class="bg-indigo-600 text-white text-[10px] px-3 py-1 font-black rounded-full uppercase tracking-widest">Active Analysis</span>
        </div>
        <div class="bg-white border-2 border-slate-900 p-8 rounded-[2rem] shadow-2xl">
            <div class="flex justify-between items-start mb-8">
                <div>
                    <h3 class="text-3xl font-black text-slate-900 tracking-tighter">${detail.name}</h3>
                    <p class="text-[10px] text-indigo-600 font-black uppercase mt-1 tracking-[0.2em]">${detail.type}</p>
                </div>
                <div class="bg-indigo-50 px-4 py-2 rounded-2xl text-center">
                    <p class="text-2xl font-black text-indigo-600">${detail.rating}</p>
                    <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Rating</p>
                </div>
            </div>
            
            <div class="space-y-8">
                <button class="w-full border-2 border-slate-100 p-6 rounded-2xl bg-slate-50 hover:bg-white transition-all group flex items-center justify-center gap-4" onclick="openMediaModal()">
                    <span class="material-symbols-outlined text-indigo-600 text-3xl group-hover:scale-125 transition-transform">photo_library</span>
                    <span class="text-[11px] font-black text-slate-900 uppercase tracking-[0.2em]">Open Perspective Gallery</span>
                </button>

                <div class="bg-slate-50/50 border border-slate-100 p-8 rounded-2xl">
                    <p class="text-[10px] font-black text-slate-400 mb-5 uppercase tracking-[0.3em]">${optionLabel}</p>
                    <div class="space-y-2">
                        ${detail.options.map((opt, i) => `
                            <div class="accordion-item ${i === 0 ? 'active' : ''} bg-white rounded-xl border border-slate-100 px-4">
                                <div class="accordion-header text-[12px] font-black text-slate-700" onclick="toggleAccordion(this)">
                                    ${opt.label}
                                    <span class="material-symbols-outlined text-indigo-600 chevron-icon">expand_circle_down</span>
                                </div>
                                <div class="accordion-content text-[11px] text-slate-500 leading-relaxed"><div class="pb-5 font-medium opacity-80">${opt.desc}</div></div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="bg-slate-900 p-8 rounded-[1.5rem] text-white shadow-2xl shadow-indigo-900/20">
                    <div class="flex justify-between items-center mb-6">
                        <p class="text-[10px] font-black uppercase tracking-[0.2em] opacity-50">Discovery Pricing</p>
                        <span class="text-lg font-black tracking-tighter">${detail.price}</span>
                    </div>
                    <button class="w-full bg-indigo-600 text-white font-black py-5 rounded-2xl text-[13px] tracking-[0.3em] hover:bg-indigo-500 active:scale-95 transition-all uppercase shadow-xl shadow-indigo-600/30" onclick="window.location.href='QR_Upload_State.html'">Initialize Booking</button>
                </div>
            </div>
        </div>`;
    };

    // --- UI FLOW ACTIONS ---
    function setCategory(cat) {
        uiState.currentCategory = cat;
        uiState.activeTab = "browse";
        document.querySelectorAll('.category-tab').forEach(tab => tab.classList.toggle('active', tab.textContent === cat || (cat === 'All Experiences' && tab.textContent === 'All')));
        document.getElementById('category-title').textContent = cat === 'All Experiences' ? 'All Experiences' : cat;
        applyFilters();
        updateUI();
    }

    function selectItem(name) {
        let item = null;
        Object.values(allData).forEach(catItems => { const found = catItems.find(i => i.name === name); if (found) item = found; });
        if (item) { uiState.selectedItem = item; uiState.activeTab = 'deals'; updateUI(); }
    }

    function setUIState(tab) {
        if (tab === 'browse') { uiState.activeTab = 'browse'; } 
        else if (tab === 'deals' && uiState.selectedItem) { uiState.activeTab = 'deals'; }
        else if (tab === 'deals') { alert("Please select an item first."); return; }
        updateUI();
    }

    function updateUI() {
        const layout = document.getElementById('main-layout');
        const level2 = document.getElementById('level2');
        document.getElementById('nav-browse').classList.toggle('active', uiState.activeTab === 'browse');
        document.getElementById('nav-deals').classList.toggle('active', uiState.activeTab === 'deals');

        if (uiState.activeTab === 'browse') {
            level2.style.display = 'none';
            layout.classList.remove('side-by-side');
        } else {
            level2.innerHTML = renderLevel2(uiState.selectedItem);
            level2.style.display = 'block';
            layout.classList.add('side-by-side');
        }
    }

    function applyFilters() {
        const dur = document.querySelector('[data-filter-field="duration"]').value;
        const cat = document.querySelector('[data-filter-field="priceClass"]').value;
        const dist = document.querySelector('[data-filter-field="distance"]').value;
        const sort = document.getElementById('sort-nearest').checked;
        renderInventory(dur, cat, dist, sort);
    }

    // --- INITIALIZE ---
    setCategory('All Experiences');
</script>
</body></html>
