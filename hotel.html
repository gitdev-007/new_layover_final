<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>LayoverX | Hotel Discovery</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#1d4ed8", /* blue */
                        "primary-container": "#bfdbfe",
                        secondary: "#ea580c", /* orange */
                        "secondary-container": "#fed7aa",
                        surface: "#ffffff",
                        "surface-container": "#f8fafc",
                        "surface-container-high": "#f1f5f9",
                        "outline-variant": "#cbd5e1",
                        "on-surface": "#0f172a",
                        "on-surface-variant": "#475569"
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        manrope: ["Manrope", "sans-serif"]
                    },
                    fontSize: {
                        "meta-label": ["10px", { letterSpacing: "0.1em", fontWeight: "700" }],
                        "node-title-lg": ["20px", { letterSpacing: "-0.02em", fontWeight: "800" }],
                        "node-title-md": ["16px", { letterSpacing: "-0.01em", fontWeight: "700" }],
                        "node-description": ["12px", { lineHeight: "1.5" }]
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f7f7fb; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .layout-transition { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .wireframe-box { border: 1px solid #cbd5e1; background-color: #ffffff; }
        /* Typography System */
        .text-meta-label { font-size: 10px; letter-spacing: 0.1em; font-weight: 700; text-transform: uppercase; }
        .text-node-title-md { font-size: 16px; letter-spacing: -0.01em; font-weight: 700; }
        .text-node-title-lg { font-size: 20px; letter-spacing: -0.02em; font-weight: 800; }
        .text-node-description { font-size: 12px; line-height: 1.5; }
    </style>
</head>
<body class="text-on-surface font-sans antialiased overflow-x-hidden min-h-screen flex flex-col">
    <!-- Navbar -->
    <header class="w-full bg-white border-b border-outline-variant sticky top-0 z-50">
        <div class="max-w-[1400px] mx-auto px-6 h-16 flex justify-between items-center text-sm font-semibold text-on-surface-variant">
            <div class="flex items-center gap-8">
                <a class="text-lg font-bold text-primary font-manrope uppercase tracking-tight" href="#">LayoverX</a>
                <nav class="hidden md:flex gap-6 items-center">
                    <a class="text-primary border-b-2 border-primary pb-1 uppercase text-[11px] tracking-widest" href="#">Browse</a>
                    <a class="hover:text-primary transition-colors uppercase text-[11px] tracking-widest" href="#">My Bookings</a>
                    <a class="hover:text-primary transition-colors uppercase text-[11px] tracking-widest" href="#">Support</a>
                </nav>
            </div>
            <div class="flex gap-4 items-center">
                <span class="material-symbols-outlined text-[20px]">notifications</span>
                <span class="material-symbols-outlined text-[20px]">account_circle</span>
            </div>
        </div>
    </header>

    <main class="flex-grow w-full max-w-4xl mx-auto p-4 flex flex-col items-center gap-6 relative pb-20 mt-4">
        <!-- LEVEL 1: LISTING -->
        <div id="level1" class="layout-transition w-full max-w-4xl mx-auto z-10 relative">
            <div class="flex items-center justify-between mb-4">
                <span class="bg-primary text-white text-meta-label px-3 py-1 uppercase tracking-widest">Level 1: Listing</span>
            </div>
            <div class="bg-white border-2 border-primary-container p-6 shadow-sm">
                <div class="flex justify-between items-start mb-6">
                    <h3 id="level1-heading" class="text-node-title-md text-primary uppercase cursor-pointer hover:underline" onclick="closeLevel2()">HOTELS LISTING PAGE</h3>
                </div>
                <div class="space-y-4">
                    <div class="border border-outline-variant p-3 bg-surface-container">
                        <p class="text-meta-label text-on-surface-variant mb-2 tracking-widest">SEARCH & FILTERS</p>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                            <select id="filter-duration" onchange="renderItems()" class="bg-white border border-slate-300 px-2 py-1.5 text-[11px] text-slate-600 font-medium outline-none rounded-none cursor-pointer">
                                <option value="any">Duration</option>
                                <option value="3 Hours">3 Hours</option>
                                <option value="4 Hours">4 Hours</option>
                                <option value="6 Hours">6 Hours</option>
                                <option value="8 Hours">8 Hours</option>
                                <option value="10 Hours">10 Hours</option>
                                <option value="12 Hours">12 Hours</option>
                                <option value="16 Hours">16 Hours</option>
                                <option value="20 Hours">20 Hours</option>
                                <option value="24 Hours">24 Hours</option>
                            </select>
                            <select id="filter-price" onchange="renderItems()" class="bg-white border border-slate-300 px-2 py-1.5 text-[11px] text-slate-600 font-medium outline-none rounded-none cursor-pointer">
                                <option value="any">Price Range</option>
                                <option value="0-2000">₹0 – ₹2000</option>
                                <option value="2000-4000">₹2000 – ₹4000</option>
                                <option value="4000-6000">₹4000 – ₹6000</option>
                                <option value="6000-8000">₹6000 – ₹8000</option>
                                <option value="8000-12000">₹8000 – ₹12000</option>
                                <option value="12000+">₹12000+</option>
                            </select>
                            <select id="filter-distance" onchange="renderItems()" class="bg-white border border-slate-300 px-2 py-1.5 text-[11px] text-slate-600 font-medium outline-none rounded-none cursor-pointer">
                                <option value="any">Distance</option>
                                <option value="1">Within 1 km</option>
                                <option value="3">Within 3 km</option>
                                <option value="5">Within 5 km</option>
                                <option value="10">Within 10 km</option>
                                <option value="any">Any Distance</option>
                            </select>
                            <select id="filter-amenity" onchange="renderItems()" class="bg-white border border-slate-300 px-2 py-1.5 text-[11px] text-slate-600 font-medium outline-none rounded-none cursor-pointer">
                                <option value="any">Amenities</option>
                                <option value="Free WiFi">Free WiFi</option>
                                <option value="Airport Shuttle">Airport Shuttle</option>
                                <option value="Swimming Pool">Swimming Pool</option>
                                <option value="Spa">Spa</option>
                                <option value="Gym">Gym</option>
                                <option value="Restaurant">Restaurant</option>
                                <option value="Free Breakfast">Free Breakfast</option>
                                <option value="Parking">Parking</option>
                                <option value="Business Center">Business Center</option>
                                <option value="Family Rooms">Family Rooms</option>
                            </select>
                        </div>
                    </div>
                    <div class="border-2 border-dashed border-outline-variant p-4">
                        <p id="inventory-count" class="text-meta-label text-on-surface-variant mb-3 uppercase tracking-widest">HOTEL INVENTORY (12 HOTELS FOUND)</p>
                        <div id="hotel-grid" class="grid grid-cols-2 md:grid-cols-4 gap-2"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- LEVEL 2: DETAIL -->
        <div id="level2" class="hidden w-full">
            <div class="flex items-center justify-between mb-4">
                <span class="bg-secondary text-white text-meta-label px-3 py-1 uppercase tracking-widest">Level 2: Details</span>
            </div>

            <div class="bg-white border-2 border-secondary p-6 shadow-sm flex flex-col">
                <div class="flex justify-between items-start mb-6 shrink-0">
                    <h3 class="text-node-title-md text-secondary uppercase">HOTEL DETAIL PAGE</h3>
                    <button onclick="closeLevel2()" class="text-on-surface-variant hover:text-primary"><span class="material-symbols-outlined text-[16px]">close</span></button>
                </div>
                
                <div class="space-y-4">
                    <div class="wireframe-box p-3 bg-secondary/5 border-outline-variant">
                        <p class="text-meta-label text-secondary mb-1 uppercase tracking-widest">Entity Header</p>
                        <h4 id="l2-name" class="text-[14px] font-bold"></h4>
                        <div class="flex items-center gap-2 mt-1">
                            <span id="l2-rating" class="bg-secondary-container text-secondary text-[10px] px-1 font-semibold"></span>
                            <span id="l2-distance" class="text-[10px] text-on-surface-variant"></span>
                        </div>
                    </div>
                    <div class="wireframe-box p-3 bg-surface-container">
                        <p class="text-meta-label text-on-surface-variant mb-2 uppercase tracking-widest">Key Differentiators</p>
                        <div id="l2-amenities" class="text-[11px] space-y-1"></div>
                    </div>
                    <div class="border-2 border-secondary p-3 bg-secondary/10 mt-4">
                        <select id="item-duration" class="w-full mb-3 bg-white border border-slate-300 px-3 py-2 text-[11px] text-slate-800 font-medium outline-none cursor-pointer focus:border-secondary transition-all">
                            <option value="">Select Stay Duration</option>
                            <option value="3 Hours">3 Hours</option>
                            <option value="4 Hours">4 Hours</option>
                            <option value="6 Hours">6 Hours</option>
                            <option value="8 Hours">8 Hours</option>
                            <option value="10 Hours">10 Hours</option>
                            <option value="12 Hours">12 Hours</option>
                            <option value="16 Hours">16 Hours</option>
                            <option value="20 Hours">20 Hours</option>
                            <option value="24 Hours">24 Hours</option>
                        </select>
                        <button id="add-list-btn" class="w-full bg-secondary text-white font-bold py-2 text-sm uppercase transition-colors hover:bg-orange-700">PLAN LAYOVER</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="lib/plannerRedirect.js"></script>
    <script>
        function handlePlanLayover(item, category) {
            const durSelect = document.getElementById('item-duration');
            localStorage.setItem('pending_experience', JSON.stringify({
                name: item.name,
                category: category,
                duration: durSelect ? durSelect.value : '3 Hours',
                distance: item.distance
            }));
            redirectToExplorePlanner(category);
        }

        const items = [
            { id: 1, name: "The Orchid Hotel", distance: 0.9, category: "Premium", rating: "4.8", price: 4500, durations: ["3 Hours", "4 Hours", "6 Hours", "8 Hours"], features: ["Airport Shuttle", "Swimming Pool", "Spa", "Free WiFi"] },
            { id: 2, name: "Hotel Sahara Star", distance: 1.1, category: "Premium", rating: "4.7", price: 5200, durations: ["4 Hours", "6 Hours", "8 Hours", "10 Hours"], features: ["Swimming Pool", "Airport Shuttle", "Restaurant", "Gym"] },
            { id: 3, name: "Taj Santacruz", distance: 1.6, category: "Premium", rating: "4.9", price: 8200, durations: ["6 Hours", "8 Hours", "10 Hours", "12 Hours", "Overnight Stay"], features: ["Airport Shuttle", "Spa", "Business Center", "Fine Dining", "Free WiFi"] },
            { id: 4, name: "JW Marriott Sahar", distance: 1.8, category: "Premium", rating: "4.8", price: 7800, durations: ["6 Hours", "8 Hours", "10 Hours", "12 Hours", "16 Hours"], features: ["Swimming Pool", "Spa", "Gym", "Restaurant", "Parking"] },
            { id: 5, name: "ITC Maratha", distance: 2.4, category: "Premium", rating: "4.8", price: 7600, durations: ["8 Hours", "10 Hours", "12 Hours", "16 Hours", "20 Hours"], features: ["Spa", "Restaurant", "Free Breakfast", "Business Center", "Free WiFi"] },
            { id: 6, name: "The Leela Mumbai", distance: 2.5, category: "Premium", rating: "4.7", price: 7200, durations: ["6 Hours", "8 Hours", "12 Hours", "24 Hours"], features: ["Swimming Pool", "Airport Shuttle", "Business Center", "Restaurant", "Gym"] },
            { id: 7, name: "Aurika Mumbai", distance: 2.8, category: "Premium", rating: "4.6", price: 6200, durations: ["4 Hours", "6 Hours", "8 Hours", "12 Hours"], features: ["Swimming Pool", "Gym", "Free WiFi", "Parking", "Free Breakfast"] },
            { id: 8, name: "Grand Hyatt", distance: 6.1, category: "Premium", rating: "4.7", price: 7000, durations: ["8 Hours", "12 Hours", "16 Hours", "24 Hours"], features: ["Swimming Pool", "Spa", "Business Center", "Family Rooms", "Gym"] },
            { id: 9, name: "Hotel Bawa Intl.", distance: 1.7, category: "Standard", rating: "4.2", price: 3300, durations: ["3 Hours", "4 Hours", "6 Hours", "8 Hours"], features: ["Free WiFi", "Restaurant", "Parking", "Family Rooms"] },
            { id: 10, name: "Hotel Midland", distance: 2.3, category: "Standard", rating: "4.0", price: 1900, durations: ["3 Hours", "4 Hours", "6 Hours"], features: ["Restaurant", "Free WiFi", "Family Rooms", "Parking"] },
            { id: 11, name: "Lemon Tree Premier", distance: 3.2, category: "Standard", rating: "4.4", price: 3900, durations: ["4 Hours", "6 Hours", "8 Hours", "12 Hours"], features: ["Airport Shuttle", "Swimming Pool", "Free Breakfast", "Gym"] },
            { id: 12, name: "Holiday Inn", distance: 4.2, category: "Standard", rating: "4.5", price: 4200, durations: ["6 Hours", "8 Hours", "10 Hours", "12 Hours"], features: ["Swimming Pool", "Gym", "Restaurant", "Free WiFi", "Business Center"] }
        ];

        // Active State Tracking
        let activeItemId = null;

        // Render Function with simultaneous multi-filtering
        function renderItems() {
            const grid = document.getElementById('hotel-grid');
            const inventoryCount = document.getElementById('inventory-count');
            
            // Get filter values
            const duration = document.getElementById('filter-duration').value;
            const priceRange = document.getElementById('filter-price').value;
            const distanceLimit = document.getElementById('filter-distance').value;
            const amenity = document.getElementById('filter-amenity').value;

            // Apply filters
            const filteredItems = items.filter(item => {
                // Duration filter
                if (duration !== 'any' && !item.durations.some(d => d.includes(duration.replace('h', '')))) return false;
                
                // Price Range filter
                if (priceRange !== 'any') {
                    if (priceRange === '12000+') {
                        if (item.price < 12000) return false;
                    } else {
                        const [min, max] = priceRange.split(' – ').map(p => parseInt(p.replace(/[^0-9]/g, '')));
                        if (item.price < min || item.price > max) return false;
                    }
                }

                // Distance filter
                if (distanceLimit !== 'any' && item.distance > parseFloat(distanceLimit)) return false;

                // Amenity filter
                if (amenity !== 'any' && !item.features.includes(amenity)) return false;

                return true;
            });

            // Update Total Inventory Count
            inventoryCount.textContent = `HOTEL INVENTORY (${filteredItems.length} HOTELS FOUND)`;

            grid.innerHTML = '';
            ['Premium', 'Standard'].forEach(cat => {
                const catItems = filteredItems.filter(i => i.category === cat);
                if (catItems.length > 0) {
                    grid.innerHTML += `<div class="col-span-full border-b border-outline-variant pb-1 mt-6 flex justify-between items-end"><h4 class="text-meta-label text-primary uppercase tracking-widest font-bold">${cat} HOTELS</h4><span class="text-[10px] font-bold text-on-surface-variant">(${catItems.length})</span></div>`;
                    catItems.forEach(h => {
                        const isActive = h.id === activeItemId;
                        grid.innerHTML += `<div onclick="openLevel2(${h.id})" class="p-3 border border-slate-200 cursor-pointer hover:border-blue-500 hover:shadow-sm transition-all flex flex-col gap-2 bg-white ${isActive ? 'bg-blue-50 border-blue-500 shadow-sm' : ''}">
                            <div class="flex justify-between items-start">
                                <span class="font-bold text-xs text-slate-900">${h.name}</span>
                                ${h.category === 'Premium' ? '<span class="material-symbols-outlined text-[14px] text-blue-600">workspace_premium</span>' : ''}
                            </div>
                            <div class="flex items-center justify-between text-[10px] text-slate-500 mt-auto">
                                <span>${h.distance} km from T2</span>
                                <span class="font-bold text-orange-600 bg-orange-50 px-1.5 py-0.5">${h.rating}★</span>
                            </div>
                        </div>`;
                    });
                }
            });
            
            // Handle empty results
            if (filteredItems.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-on-surface-variant font-medium text-xs uppercase tracking-widest">No hotels match your current filters.</div>`;
            }
        }

        function openLevel2(id) {
            activeItemId = id;
            renderItems();
            
            const item = items.find(h => h.id === id);
            document.getElementById('l2-name').textContent = item.name;
            document.getElementById('l2-rating').textContent = item.rating + ' ★';
            document.getElementById('l2-distance').textContent = item.distance + ' km from T2';
            document.getElementById('l2-amenities').innerHTML = item.features.map(a => `<div class="flex items-center gap-2"><span class="material-symbols-outlined text-[14px] text-green-600">check_circle</span> ${a}</div>`).join('');
            document.getElementById('add-list-btn').onclick = () => handlePlanLayover(item, 'Hotel');
            
            const level2 = document.getElementById('level2');
            level2.classList.remove('hidden');
            
            // Smooth scroll to Level 2
            level2.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function closeLevel2() {
            activeItemId = null;
            renderItems();
            document.getElementById('level2').classList.add('hidden');
        }
        
        renderItems();
    </script>
</body>
</html>
