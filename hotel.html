<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StayMarket | Hotels Listing</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    .hotel-item { transition: all 0.2s ease; }
    .hotel-item:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
</style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans p-4 md:p-8">

<main class="max-w-4xl mx-auto space-y-8">
    <div class="bg-white border border-slate-200 p-8 rounded-2xl shadow-sm">
        <h1 class="text-3xl font-bold text-slate-900 mb-2">Hotels Near Mumbai Airport</h1>
        <p class="text-slate-500 mb-8" id="subtitle">Explore options for your stay</p>

        <!-- Search & Filters -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200 mb-8">
            <select class="filter-field border border-slate-300 rounded-lg p-2" data-filter-field="duration" onchange="applyFilters()">
                <option value="">Duration (Any)</option>
                <option value="2">2 Hours</option>
                <option value="4">4 Hours</option>
                <option value="8">8 Hours</option>
            </select>
            <select class="filter-field border border-slate-300 rounded-lg p-2" data-filter-field="priceRange" onchange="applyFilters()">
                <option value="0-99999">Price Range (Any)</option>
                <option value="0-5000">₹0 – ₹5000</option>
                <option value="5000-10000">₹5000 – ₹10000</option>
                <option value="10001-99999">₹10000+</option>
            </select>
            <select class="filter-field border border-slate-300 rounded-lg p-2" data-filter-field="distance" onchange="applyFilters()">
                <option value="999">Distance (Any)</option>
                <option value="3">Within 3 km</option>
                <option value="5">Within 5 km</option>
                <option value="10">Within 10 km</option>
            </select>
            <select class="filter-field border border-slate-300 rounded-lg p-2" data-filter-field="amenities" onchange="applyFilters()">
                <option value="">Amenities (Any)</option>
                <option value="pool">Pool</option>
                <option value="spa">Spa</option>
            </select>
        </div>

        <p class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4" id="inventory-count">HOTEL INVENTORY</p>
        <div id="inventory-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Populated by JS -->
        </div>
    </div>
</main>

<script>
    const hotels = [
        { id: 1, name: "The Orchid Hotel", distance: 0.9, category: "Standard", price: 4500, amenities: ["Airport Shuttle"], duration: [2,4] },
        { id: 2, name: "Hotel Sahara Star", distance: 1.1, category: "Premium", price: 5000, amenities: ["Airport Shuttle", "Pool"], duration: [2,4,8] },
        { id: 3, name: "Taj Santacruz", distance: 1.6, category: "Premium", price: 6000, amenities: ["Airport Shuttle", "Spa"], duration: [4,8,12] },
        { id: 4, name: "Hotel Bawa International", distance: 1.7, category: "Standard", price: 2200, amenities: ["Airport Shuttle"], duration: [2,4] },
        { id: 5, name: "JW Marriott Mumbai Sahar", distance: 1.8, category: "Premium", price: 7000, amenities: ["Airport Shuttle", "Pool", "Spa"], duration: [4,8,12] },
        { id: 6, name: "Hotel Midland", distance: 2.3, category: "Standard", price: 1800, amenities: ["Airport Shuttle"], duration: [2,4] },
        { id: 7, name: "ITC Maratha", distance: 2.4, category: "Premium", price: 7500, amenities: ["Airport Shuttle", "Pool", "Spa"], duration: [4,8,12] },
        { id: 8, name: "The Leela Mumbai", distance: 2.5, category: "Premium", price: 6500, amenities: ["Airport Shuttle", "Pool", "Spa"], duration: [4,8,12] },
        { id: 9, name: "Aurika Mumbai Airport", distance: 2.8, category: "Premium", price: 4500, amenities: ["Airport Shuttle", "Pool"], duration: [4,8] },
        { id: 10, name: "Lemon Tree Premier", distance: 3.2, category: "Standard", price: 3200, amenities: ["Airport Shuttle", "Pool"], duration: [4,8] },
        { id: 11, name: "Holiday Inn Mumbai Airport", distance: 4.2, category: "Standard", price: 4500, amenities: ["Airport Shuttle", "Pool"], duration: [4,8,12] },
        { id: 12, name: "Grand Hyatt Mumbai", distance: 6.1, category: "Premium", price: 8000, amenities: ["Airport Shuttle", "Pool", "Spa"], duration: [8,12,24] }
    ];

    function applyFilters() {
        const dur = document.querySelector('[data-filter-field="duration"]').value;
        const price = document.querySelector('[data-filter-field="priceRange"]').value;
        const dist = parseFloat(document.querySelector('[data-filter-field="distance"]').value);
        const amen = document.querySelector('[data-filter-field="amenities"]').value.toLowerCase();

        let filtered = hotels.filter(h => {
            if (dur && !h.duration.includes(parseInt(dur))) return false;
            if (price) {
                const [min, max] = price.split('-').map(Number);
                if (h.price < min || h.price > max) return false;
            }
            if (dist && h.distance > dist) return false;
            if (amen && !h.amenities.map(a => a.toLowerCase()).includes(amen)) return false;
            return true;
        });

        filtered.sort((a, b) => a.distance - b.distance);
        render(filtered);
    }

    function render(data) {
        const container = document.getElementById('inventory-list');
        document.getElementById('inventory-count').textContent = `HOTEL INVENTORY (${data.length} FOUND)`;
        container.innerHTML = data.map(h => `
            <div class="hotel-item p-4 border border-slate-200 rounded-xl bg-white shadow-sm hover:shadow-md transition">
                <div class="flex justify-between items-start mb-2">
                    <h3 class="font-bold text-lg">${h.name}</h3>
                    <span class="text-[10px] font-bold px-2 py-1 rounded bg-slate-100 uppercase">${h.category}</span>
                </div>
                <p class="text-sm text-slate-500 mb-4">${h.distance} km from T2 Terminal</p>
                <div class="flex justify-between items-center text-sm font-bold text-slate-700 border-t pt-3">
                    <span>₹${h.price}</span>
                    <button class="bg-blue-900 text-white px-4 py-2 rounded-lg text-xs">Add to List</button>
                </div>
            </div>
        `).join('');
    }

    applyFilters();
</script>
</body>
</html>
