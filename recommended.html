<script>
(function() {
    const layoverDurationRaw = localStorage.getItem('layover_duration') || '8';
    const layoverDurationHours = parseInt(layoverDurationRaw, 10);
    const availableMins = (layoverDurationHours * 60) - 120; // total - buffer

    const cards = document.querySelectorAll('.rec-card');
    let visibleCount = 0;
    cards.forEach(card => {
        const dur = parseInt(card.dataset.duration || 0, 10);
        const dist = parseFloat(card.dataset.distance || 0);
        const estTravel = Math.round((dist * 3 * 2) + 30); // worst case overhead
        if (dur + estTravel > availableMins) {
            card.style.display = 'none';
        } else {
            visibleCount++;
        }
    });

    if (visibleCount === 0) {
        document.getElementById('rec-container').innerHTML = '<p class="text-xs text-secondary text-center py-4">No experiences fit your remaining layover time safely.</p>';
    }
})();
</script>
