<div class="level1 space-y-6 relative z-10 w-full mx-auto" style="width: 100%; max-width: 100%;">
<div class="bg-white border border-outline-variant p-5 rounded-xl shadow-sm">
<div class="flex justify-between items-start mb-6 border-b border-outline-variant pb-4">
<h3 class="text-lg font-bold text-primary">Recommended For You</h3>
<span class="bg-emerald-100 text-emerald-700 text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider">Smart Match</span>
</div>

<div class="space-y-4" id="rec-container">
    <!-- Rendered dynamically -->
</div>
</div>
</div>
<script>
(function() {
    const layoverDurationRaw = localStorage.getItem('layover_duration') || '8';
    const layoverDurationHours = parseInt(layoverDurationRaw, 10);
    const availableMins = (layoverDurationHours * 60) - 120; // total - buffer

    const container = document.getElementById('rec-container');
    let html = '';
    let visibleCount = 0;

    // Pick top items from inventory
    const topPicks = [];
    if (window.LAYOVER_INVENTORY) {
        if (window.LAYOVER_INVENTORY['Hotels'][0]) topPicks.push(window.LAYOVER_INVENTORY['Hotels'][0]);
        if (window.LAYOVER_INVENTORY['Restaurants'][0]) topPicks.push(window.LAYOVER_INVENTORY['Restaurants'][0]);
        if (window.LAYOVER_INVENTORY['Spa'][0]) topPicks.push(window.LAYOVER_INVENTORY['Spa'][0]);
    }

    topPicks.forEach(item => {
        const dist = parseFloat(item.distance || 0);
        let estTravel = 30; // base overhead
        if (window.calculateDynamicTravelMins) {
            estTravel += Math.round(window.calculateDynamicTravelMins(dist) * 2); // round trip overhead just for filtering
        }
        
        // Let's assume a default safe duration of 2h for recommended items if they don't have a filter set
        const defaultDurMins = 120;

        if (defaultDurMins + estTravel <= availableMins) {
            visibleCount++;
            html += `
            <div class="flex gap-4 bg-surface border border-outline-variant rounded-xl p-3 hover:shadow-md transition-shadow items-center">
                <div class="w-24 h-24 flex-shrink-0 rounded-lg overflow-hidden bg-slate-200">
                    ${item.image ? `<img class="w-full h-full object-cover" src="${item.image}"/>` : `<div class="w-full h-full flex items-center justify-center"><span class="material-symbols-outlined text-outline-variant text-[24px]">category</span></div>`}
                </div>
                <div class="flex-grow flex flex-col justify-between py-1">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[9px] font-bold text-outline uppercase tracking-wider">${item.category}</span>
                            <h3 class="font-bold text-sm text-on-surface leading-tight mt-0.5">${item.name}</h3>
                        </div>
                        <div class="flex items-center gap-[2px] bg-emerald-50 px-1.5 py-0.5 rounded">
                            <span class="font-bold text-[10px] text-emerald-700">${item.rating}</span>
                        </div>
                    </div>
                    <div class="flex gap-2 text-secondary mt-1 text-[10px]">
                        <span>Est ${Math.round(window.calculateDynamicTravelMins(item.distance))}m travel (one way)</span>
                    </div>
                    <div class="mt-3 flex flex-col gap-2 w-full">
                        <label class="block text-[9px] font-bold text-secondary uppercase">Select Stay Duration</label>
                        <select class="w-full bg-surface border border-outline-variant p-1.5 rounded text-[11px] focus:outline-none focus:border-primary" onchange="this.nextElementSibling.disabled = !this.value; this.nextElementSibling.dataset.duration = this.value;">
                            <option value="" disabled selected hidden>Select Duration</option>
                            ${item.category === 'Hotels' ? `
                                <option value="3 Hours">3 Hours</option>
                                <option value="4 Hours">4 Hours</option>
                                <option value="6 Hours">6 Hours</option>
                                <option value="8 Hours">8 Hours</option>
                                <option value="10 Hours">10 Hours</option>
                                <option value="12 Hours">12 Hours</option>
                                <option value="16 Hours">16 Hours</option>
                                <option value="20 Hours">20 Hours</option>
                                <option value="24 Hours">24 Hours</option>
                            ` : `
                                <option value="30m">30 mins</option>
                                <option value="1h">1 hour</option>
                                <option value="2h">2 hours</option>
                                <option value="3h">3 hours</option>
                                <option value="4h">4 hours</option>
                                <option value="6h">6 hours</option>
                            `}
                        </select>
                        <button disabled data-duration="" onclick="window.addToList && window.addToList(this, '${item.name}', '${item.category}', this.dataset.duration, ${item.distance}, '${item.image}')" class="w-full bg-primary text-white text-[10px] font-bold px-4 py-2 rounded-md hover:shadow-md active:scale-95 transition-all duration-200 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">Add to List</button>
                    </div>
                </div>
            </div>
            `;
        }
    });

    if (visibleCount === 0) {
        container.innerHTML = '<p class="text-xs text-secondary text-center py-4">No experiences fit your remaining layover time safely.</p>';
    } else {
        container.innerHTML = html;
    }

    if (window.syncButtonStates) {
        window.syncButtonStates();
    }
})();
</script>
