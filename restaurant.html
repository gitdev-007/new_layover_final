<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants | LayoverX</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <style>
        .main-layout { display: flex; justify-content: center; align-items: flex-start; gap: 20px; }
        .main-layout.active { justify-content: flex-start; }
        .level1 { width: 600px; }
        .level2 { width: 600px; display: none; }
        .listing-item { cursor: pointer; }
    </style>
</head>
<body class="bg-white p-8">
    <main class="max-w-7xl mx-auto main-layout">
        <div class="level1 space-y-6">
            <h1 class="text-xl font-bold">Restaurants</h1>
            <div class="border p-4">
                <select class="filter-field" data-filter-field="duration" onchange="applyFilters()">
                    <option value="">Duration</option>
                    <option value="1hr">1 hr</option>
                    <option value="2hr">2 hr</option>
                </select>
                <!-- Add other filters -->
            </div>
            <div id="listing-container">
                <div class="listing-item p-4 border" data-duration="1hr" data-price-range="500" data-distance="1">Cafe Coffee Day</div>
                <div class="listing-item p-4 border" data-duration="2hr" data-price-range="6000" data-distance="2">Thai Naam</div>
                <!-- ... rest of data -->
            </div>
        </div>
        <div class="level2 border-2 border-secondary p-4">
            <h2 class="text-lg font-bold" data-detail-field="name"></h2>
            <p data-detail-field="location"></p>
            <button class="w-full mt-3 bg-secondary text-white font-bold py-2 rounded-lg text-sm tracking-wide" onclick="window.location.href='QR_Upload_State.html'">PLAN LAYOVER</button>
            <!-- Details content -->
        </div>
    </main>
    <script src="shared-layout.js"></script>
    <script>
        const restaurantDetails = {
            'Cafe Coffee Day': { name: 'Cafe Coffee Day', location: '0.4 km' },
            'Thai Naam': { name: 'Thai Naam', location: '1.8 km' }
        };
        initItems(restaurantDetails);
    </script>
</body>
</html>
