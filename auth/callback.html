    <style>
        .glass { background: rgba(18, 18, 18, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

        html { scroll-behavior: smooth; }
        body { scroll-padding-top: 110px; }

<body class="bg-surface text-on-surface font-body-md overflow-x-hidden">
    <!-- Background -->
    <div class="fixed inset-0 z-0">
        <div class="absolute inset-0 bg-gradient-to-br from-surface via-surface-container to-surface"></div>
    </div>

    <!-- Main Content -->
    <main class="relative z-10 min-h-screen flex items-center justify-center px-8">
        <div class="w-full max-w-md">
            <!-- Loading State -->
            <div id="loadingState" class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-container mx-auto mb-4"></div>
                <h1 class="text-2xl font-bold text-white mb-2">Completing Authentication</h1>
                <p class="text-secondary/80">Please wait while we sign you in...</p>
            </div>

            <!-- Success State -->
            <div id="successState" class="hidden text-center">
                <div class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="material-symbols-outlined text-primary text-2xl">check</span>
                </div>
                <h1 class="text-2xl font-bold text-white mb-2">Authentication Successful</h1>
                <p class="text-secondary/80 mb-6">Welcome to LayoverX!</p>
                <div class="animate-pulse text-secondary/60 text-sm">
                    Redirecting to your dashboard...
                </div>
            </div>

            <!-- Error State -->
            <div id="errorState" class="hidden text-center">
                <div class="w-16 h-16 bg-error-container/10 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="material-symbols-outlined text-error text-2xl">error</span>
                </div>
                <h1 class="text-2xl font-bold text-white mb-2">Authentication Failed</h1>
                <p id="errorMessage" class="text-secondary/80 mb-6">There was an issue signing you in.</p>
                <button onclick="window.location.href='/auth.html'" class="bg-primary-container text-on-primary-container px-6 py-3 rounded-xl font-label-md hover:scale-[1.02] active:scale-[0.98] transition-all">
                    Try Again
                </button>
            </div>
        </div>
    </main>

    <!-- Supabase Client -->
    <script type="module">
        import { createClient } from '../lib/supabaseClient.js';

        const supabase = createClient(
            'https://piygbsxvvptcivffhnvu.supabase.co',
            'sb_publishable_FnyuR71dNb05x2TVPPr0_A_mizcZUbP'
        );

        // DOM Elements
        const loadingState = document.getElementById('loadingState');
        const successState = document.getElementById('successState');
        const errorState = document.getElementById('errorState');
        const errorMessage = document.getElementById('errorMessage');

        // Show state functions
        function showLoading() {
            loadingState.classList.remove('hidden');
            successState.classList.add('hidden');
            errorState.classList.add('hidden');
        }

        function showSuccess() {
            loadingState.classList.add('hidden');
            successState.classList.remove('hidden');
            errorState.classList.add('hidden');
        }

        function showError(message) {
            loadingState.classList.add('hidden');
            successState.classList.add('hidden');
            errorState.classList.remove('hidden');
            errorMessage.textContent = message;
        }

        // Handle OAuth callback
        async function handleAuthCallback() {
            try {
                showLoading();

                // Get session after OAuth redirect
                const { data, error } = await supabase.auth.getSession();

                if (error) {
                    throw error;
                }

                if (data.session) {
                    // Successfully authenticated
                    showSuccess();
                    
                    // Redirect to plan page after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/plan.html';
                    }, 2000);
                } else {
                    // No session found
                    showError('No authentication session found. Please try signing in again.');
                }

            } catch (error) {
                console.error('Auth callback error:', error);
                showError('Authentication failed. Please try again.');
            }
        }

        // Handle the callback on page load
        handleAuthCallback();
    </script>
</body>
</html>
