<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

            font-size: 1.25rem;
        }

            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
        }
        .main-layout.active {
            justify-content: flex-start;
        }
        .level1 {
            width: 600px;
        }
        .level2 {
            width: 600px;
            display: none;
        }

            cursor: pointer;
        }
        .filter-field {
            cursor: pointer;
            min-height: 32px;
            width: 100%;
            outline: none;

<body class="bg-white text-on-background font-node-description antialiased p-8">
<header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center w-full px-8 py-3 max-w-full mx-auto mb-12">
<div class="flex items-center gap-4">
<h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">StayMarket</h1>
<span class="text-xs bg-primary-container text-on-primary-container px-2 py-0.5 font-bold">LAYOVERX SYSTEM</span>
</div>
<nav class="hidden md:flex gap-6 items-center">
<a class="text-indigo-600 dark:text-indigo-400 border-b-2 border-indigo-600 pb-1 font-semibold font-manrope text-sm" href="#">Browse</a>
<a class="text-slate-500 dark:text-slate-400 hover:text-indigo-500 dark:hover:text-indigo-300 transition-colors font-manrope text-sm font-medium" href="#">Deals</a>
<a class="text-slate-500 dark:text-slate-400 hover:text-indigo-500 dark:hover:text-indigo-300 transition-colors font-manrope text-sm font-medium" href="#">My Bookings</a>
</nav>
<div class="flex gap-4 items-center">
<span class="material-symbols-outlined text-slate-500">notifications</span>
<span class="material-symbols-outlined text-slate-500">account_circle</span>
</div>
</header>
<main class="max-w-7xl mx-auto space-y-12">
<div class="main-layout">
<div class="level1 space-y-6 relative z-10">
<div class="flex items-center justify-between mb-4">
<span class="bg-primary text-white text-meta-label px-3 py-1 font-bold">LEVEL 1: LISTING</span>
</div>
<div class="bg-white border-2 border-primary-container p-node-padding rounded shadow-sm">
<div class="flex justify-between items-start mb-6">
<h3 class="text-node-title-md font-node-title-md text-primary">Entertainment Listing Page</h3>
</div>
<div class="space-y-4">
<div class="border border-outline-variant p-3">
<p class="text-meta-label text-outline mb-1">SEARCH &amp; FILTERS</p>
<div class="grid grid-cols-2 gap-2 text-node-description">
<select class="filter-field bg-surface-container-high px-2 py-1 rounded border-0 text-node-description" data-filter-field="duration" onchange="applyFilters()">
<option value="">Duration (All)</option>
<option value="1">1 hr</option>
<option value="2">2 hr</option>
<option value="4">4 hr</option>
</select>
<select class="filter-field bg-surface-container-high px-2 py-1 rounded border-0 text-node-description" data-filter-field="type" onchange="applyFilters()">
<option value="">Type (All)</option>
<option value="Kids Play Zone">Kids Play Zone</option>
<option value="Edutainment Park">Edutainment Park</option>
<option value="Escape Room">Escape Room</option>
<option value="Arcade">Arcade</option>
<option value="Bowling & VR">Bowling & VR</option>
<option value="VR Arena">VR Arena</option>
<option value="Sports Gaming">Sports Gaming</option>
<option value="Snow Park">Snow Park</option>
</select>
<select class="filter-field bg-surface-container-high px-2 py-1 rounded border-0 text-node-description" data-filter-field="distance" onchange="applyFilters()">
<option value="999">Distance (All)</option>
<option value="5">Within 5 km</option>
<option value="10">Within 10 km</option>
<option value="20">Within 20 km</option>
</select>
</div>
</div>
<div class="border-2 border-dashed border-outline-variant p-3">
<p class="text-meta-label text-outline mb-2">ENTERTAINMENT INVENTORY</p>
<div class="rounded-lg flex gap-3"><div class="space-y-4 w-full">
<div class="grid grid-cols-2 gap-2">
    <div class="item-item p-2 bg-primary/5 border border-primary/20 rounded text-[11px] font-medium text-on-surface" data-duration="1" data-type="Kids Play Zone" data-distance="3.9" data-price="₹500">JUMPP</div>
    <div class="item-item p-2 bg-primary/5 border border-primary/20 rounded text-[11px] font-medium text-on-surface" data-duration="4" data-type="Edutainment Park" data-distance="7.9" data-price="₹1500">KidZania</div>
    <div class="item-item p-2 bg-primary/5 border border-primary/20 rounded text-[11px] font-medium text-on-surface" data-duration="2" data-type="Escape Room" data-distance="8.3" data-price="₹1800">Clue Hunt</div>
    <div class="item-item p-2 bg-primary/5 border border-primary/20 rounded text-[11px] font-medium text-on-surface" data-duration="2" data-type="Arcade" data-distance="8.5" data-price="₹500">Timezone</div>
    <div class="item-item p-2 bg-primary/5 border border-primary/20 rounded text-[11px] font-medium text-on-surface" data-duration="2" data-type="Bowling & VR" data-distance="8.6" data-price="₹400">Shott Gaming</div>
    <div class="item-item p-2 bg-primary/5 border border-primary/20 rounded text-[11px] font-medium text-on-surface" data-duration="2" data-type="VR Arena" data-distance="16.5" data-price="₹1200">Zero Latency</div>
    <div class="item-item p-2 bg-primary/5 border border-primary/20 rounded text-[11px] font-medium text-on-surface" data-duration="4" data-type="Sports Gaming" data-distance="16.8" data-price="₹800">SMAAASH</div>
    <div class="item-item p-2 bg-primary/5 border border-primary/20 rounded text-[11px] font-medium text-on-surface" data-duration="2" data-type="Snow Park" data-distance="17.8" data-price="₹800">Snow Kingdom</div>
</div>
</div></div>
</div>
</div>
</div>
</div>
<div class="level2 space-y-6 relative z-10">
</div>
</div>
</main>
<script>
    const filterFields = document.querySelectorAll('[data-filter-field]');
    const items = document.querySelectorAll('.item-item');

    function applyFilters() {
        const durationVal = document.querySelector('[data-filter-field="duration"]').value;
        const typeVal = document.querySelector('[data-filter-field="type"]').value;
        const distanceVal = document.querySelector('[data-filter-field="distance"]').value;

        items.forEach((item) => {
            const iDur = item.dataset.duration;
            const iType = item.dataset.type;
            const iDist = parseFloat(item.dataset.distance);
            
            let isVisible = true;
            if (durationVal && iDur !== durationVal) isVisible = false;
            if (isVisible && typeVal && iType !== typeVal) isVisible = false;
            if (isVisible && distanceVal && iDist > parseFloat(distanceVal)) isVisible = false;
            
            item.style.display = isVisible ? 'block' : 'none';
        });
    }
</script>
</body></html>
