<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Authentication | LayoverX</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#5b403a",
                        "on-secondary": "#313030",
                        "error-container": "#93000a",
                        "primary-fixed": "#ffdad2",
                        "on-secondary-container": "#bab8b7",
                        "on-tertiary-fixed": "#1b1b1c",
                        "surface-dim": "#121414",
                        "secondary": "#c8c6c5",
                        "on-tertiary-container": "#2b2b2b",
                        "tertiary": "#c8c6c5",
                        "background": "#121414",
                        "primary-fixed-dim": "#ffb4a3",
                        "on-background": "#e2e2e2",
                        "on-secondary-fixed": "#1c1b1b",
                        "surface-container": "#1e2020",
                        "error": "#ffb4ab",
                        "secondary-fixed-dim": "#c8c6c5",
                        "tertiary-container": "#949292",
                        "inverse-surface": "#e2e2e2",
                        "outline": "#aa8981",
                        "tertiary-fixed": "#e5e2e1",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "on-error": "#690005",
                        "inverse-on-surface": "#2f3131",
                        "on-primary-fixed": "#3d0700",
                        "surface": "#121414",
                        "on-primary-container": "#590e00",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed": "#e5e2e1",
                        "on-tertiary-fixed-variant": "#474746",
                        "on-surface": "#e2e2e2",
                        "inverse-primary": "#b52700",
                        "surface-bright": "#38393a",
                        "on-primary": "#621000",
                        "surface-tint": "#ffb4a3",
                        "primary": "#ffb4a3",
                        "surface-container-highest": "#333535",
                        "surface-variant": "#333535",
                        "secondary-container": "#4a4949",
                        "on-primary-fixed-variant": "#8a1b00",
                        "primary-container": "#ff5a33",
                        "surface-container-high": "#282a2b",
                        "on-tertiary": "#303030",
                        "on-secondary-fixed-variant": "#474646",
                        "surface-container-lowest": "#0c0f0f",
                        "surface-container-low": "#1a1c1c",
                        "on-surface-variant": "#e3beb6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "margin-desktop": "64px",
                        "gutter": "24px",
                        "unit": "8px",
                        "container-max": "1280px"
                    },
                    "fontFamily": {
                        "body-md": ["Manrope"],
                        "label-md": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "headline-xl": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "headline-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
    <style>
        .glass { background: rgba(18, 18, 18, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        html { scroll-behavior: smooth; }
        body { scroll-padding-top: 110px; }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md overflow-x-hidden">
    <!-- Background -->
    <div class="fixed inset-0 z-0">
        <div class="absolute inset-0 bg-gradient-to-br from-surface via-surface-container to-surface"></div>
    </div>

    <!-- Main Content -->
    <main class="relative z-10 min-h-screen flex items-center justify-center px-8">
        <div class="w-full max-w-md">
            <!-- Logo and Title -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black tracking-tighter text-white mb-2">LayoverX</h1>
                <p class="text-secondary/80">Sign in to your account</p>
            </div>

            <!-- Auth Form -->
            <div class="glass rounded-[28px] border border-white/10 p-8">
                <!-- Toggle Buttons -->
                <div class="flex bg-surface-container/50 rounded-full p-1 mb-8">
                    <button id="loginTab" class="flex-1 py-2 px-4 rounded-full text-sm font-medium transition-all bg-primary-container text-on-primary-container">Login</button>
                    <button id="signupTab" class="flex-1 py-2 px-4 rounded-full text-sm font-medium transition-all text-secondary hover:text-white">Sign Up</button>
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="hidden mb-6 p-4 rounded-xl bg-error-container/10 border border-error-container/20 text-error text-sm"></div>

                <!-- Success Message -->
                <div id="successMessage" class="hidden mb-6 p-4 rounded-xl bg-primary/10 border border-primary/20 text-primary text-sm"></div>

                <!-- Google Sign In Button -->
                <button 
                    type="button"
                    id="googleSignInBtn"
                    class="w-full flex items-center justify-center gap-3 bg-white text-surface py-3 rounded-xl font-medium hover:bg-white/90 transition-all disabled:opacity-50 disabled:cursor-not-allowed mb-6"
                >
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue with Google
                </button>

                <!-- Divider -->
                <div class="flex items-center gap-4 mb-6">
                    <div class="flex-1 h-px bg-white/10"></div>
                    <span class="text-secondary/60 text-sm">or</span>
                    <div class="flex-1 h-px bg-white/10"></div>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="space-y-6">
                    <!-- Email Input -->
                    <div>
                        <label class="block text-sm font-medium text-secondary/80 mb-2" for="loginEmail">Email</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">email</span>
                            <input
                                id="loginEmail"
                                name="email"
                                type="email"
                                required
                                placeholder="you@example.com"
                                class="w-full pl-12 pr-4 py-3 bg-surface-container/50 border border-white/10 rounded-xl text-white placeholder-secondary/40 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all"
                            />
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div>
                        <label class="block text-sm font-medium text-secondary/80 mb-2" for="loginPassword">Password</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">lock</span>
                            <input
                                id="loginPassword"
                                name="password"
                                type="password"
                                required
                                placeholder="••••••••"
                                class="w-full pl-12 pr-4 py-3 bg-surface-container/50 border border-white/10 rounded-xl text-white placeholder-secondary/40 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all"
                            />
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button
                        type="submit"
                        id="loginSubmitBtn"
                        class="w-full bg-primary-container text-on-primary-container py-3 rounded-xl font-label-md hover:scale-[1.02] active:scale-[0.98] transition-all shadow-lg shadow-primary-container/20 disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        <span id="loginSubmitText">Sign In</span>
                        <span id="loginLoadingSpinner" class="hidden material-symbols-outlined animate-spin">refresh</span>
                    </button>
                </form>

                <!-- Signup Form -->
                <form id="signupForm" class="space-y-6 hidden">
                    <!-- Name Input -->
                    <div>
                        <label class="block text-sm font-medium text-secondary/80 mb-2" for="signupName">Name</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">person</span>
                            <input
                                id="signupName"
                                name="name"
                                type="text"
                                placeholder="John Doe"
                                class="w-full pl-12 pr-4 py-3 bg-surface-container/50 border border-white/10 rounded-xl text-white placeholder-secondary/40 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all"
                            />
                        </div>
                    </div>

                    <!-- Email Input -->
                    <div>
                        <label class="block text-sm font-medium text-secondary/80 mb-2" for="signupEmail">Email</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">email</span>
                            <input
                                id="signupEmail"
                                name="email"
                                type="email"
                                required
                                placeholder="you@example.com"
                                class="w-full pl-12 pr-4 py-3 bg-surface-container/50 border border-white/10 rounded-xl text-white placeholder-secondary/40 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all"
                            />
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div>
                        <label class="block text-sm font-medium text-secondary/80 mb-2" for="signupPassword">Password</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">lock</span>
                            <input
                                id="signupPassword"
                                name="password"
                                type="password"
                                required
                                placeholder="••••••••"
                                class="w-full pl-12 pr-4 py-3 bg-surface-container/50 border border-white/10 rounded-xl text-white placeholder-secondary/40 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all"
                            />
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button
                        type="submit"
                        id="signupSubmitBtn"
                        class="w-full bg-primary-container text-on-primary-container py-3 rounded-xl font-label-md hover:scale-[1.02] active:scale-[0.98] transition-all shadow-lg shadow-primary-container/20 disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        <span id="signupSubmitText">Sign Up</span>
                        <span id="signupLoadingSpinner" class="hidden material-symbols-outlined animate-spin">refresh</span>
                    </button>
                </form>

                <!-- Back to Home -->
                <div class="mt-8 text-center">
                    <a href="index.html" class="text-secondary/60 hover:text-secondary transition-colors text-sm">
                        ← Back to home
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Supabase Client -->
    <script>
        const supabase = window.supabase.createClient(
            'https://piygbsxvvptcivffhnvu.supabase.co',
            'sb_publishable_FnyuR71dNb05x2TVPPr0_A_mizcZUbP'
        );

        try {
            // DOM Elements
            const loginTab = document.getElementById('loginTab');
        const signupTab = document.getElementById('signupTab');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const signupName = document.getElementById('signupName');
        const signupEmail = document.getElementById('signupEmail');
        const signupPassword = document.getElementById('signupPassword');
        const loginSubmitBtn = document.getElementById('loginSubmitBtn');
        const signupSubmitBtn = document.getElementById('signupSubmitBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const googleSignInBtn = document.getElementById('googleSignInBtn');

        // Tab switching
        document.getElementById("signupTab").addEventListener("click", () => {
            document.getElementById("loginForm").classList.add("hidden");
            document.getElementById("signupForm").classList.remove("hidden");
            signupTab.classList.add('bg-primary-container', 'text-on-primary-container');
            signupTab.classList.remove('text-secondary');
            loginTab.classList.remove('bg-primary-container', 'text-on-primary-container');
            loginTab.classList.add('text-secondary');
            hideMessages();
        });

        document.getElementById("loginTab").addEventListener("click", () => {
            document.getElementById("signupForm").classList.add("hidden");
            document.getElementById("loginForm").classList.remove("hidden");
            loginTab.classList.add('bg-primary-container', 'text-on-primary-container');
            loginTab.classList.remove('text-secondary');
            signupTab.classList.remove('bg-primary-container', 'text-on-primary-container');
            signupTab.classList.add('text-secondary');
            hideMessages();
        });

        // Show/hide messages
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            successMessage.classList.add('hidden');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.remove('hidden');
            errorMessage.classList.add('hidden');
        }

        function hideMessages() {
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
        }

        // Set loading state for login
        function setLoginLoading(loading) {
            if (loading) {
                loginSubmitBtn.disabled = true;
                document.getElementById('loginSubmitText').classList.add('hidden');
                document.getElementById('loginLoadingSpinner').classList.remove('hidden');
            } else {
                loginSubmitBtn.disabled = false;
                document.getElementById('loginSubmitText').classList.remove('hidden');
                document.getElementById('loginLoadingSpinner').classList.add('hidden');
            }
        }

        // Set loading state for signup
        function setSignupLoading(loading) {
            if (loading) {
                signupSubmitBtn.disabled = true;
                document.getElementById('signupSubmitText').classList.add('hidden');
                document.getElementById('signupLoadingSpinner').classList.remove('hidden');
            } else {
                signupSubmitBtn.disabled = false;
                document.getElementById('signupSubmitText').classList.remove('hidden');
                document.getElementById('signupLoadingSpinner').classList.add('hidden');
            }
        }

        // Handle login form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            setLoginLoading(true);

            const email = loginEmail.value.trim();
            const password = loginPassword.value;

            // Validation
            if (!email || !password) {
                showError('Please fill in all required fields.');
                setLoginLoading(false);
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters long.');
                setLoginLoading(false);
                return;
            }

            try {
                const result = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (result.error) {
                    throw result.error;
                }

                // Login successful - redirect to plan page
                showSuccess('Login successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = '/plan.html';
                }, 1500);

            } catch (error) {
                console.error('Login error:', error);
                let errorMessage = 'An error occurred. Please try again.';
                
                if (error.message) {
                    if (error.message.includes('Invalid login credentials')) {
                        errorMessage = 'Invalid email or password.';
                    } else if (error.message.includes('Invalid email')) {
                        errorMessage = 'Please enter a valid email address.';
                    } else {
                        errorMessage = error.message;
                    }
                }
                
                showError(errorMessage);
            } finally {
                setLoginLoading(false);
            }
        });

        // Handle signup form submission
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            setSignupLoading(true);

            const email = signupEmail.value.trim();
            const password = signupPassword.value;
            const name = signupName.value.trim();

            // Validation
            if (!email || !password) {
                showError('Please fill in all required fields.');
                setSignupLoading(false);
                return;
            }

            if (!name.trim()) {
                showError('Please enter your name.');
                setSignupLoading(false);
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters long.');
                setSignupLoading(false);
                return;
            }

            try {
                const result = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            name: name.trim(),
                            full_name: name.trim()
                        }
                    }
                });

                if (result.error) {
                    throw result.error;
                }

                // Signup successful
                if (result.user && !result.session) {
                    // Email confirmation required
                    showSuccess('Account created! Please check your email to confirm your account.');
                    signupForm.reset();
                } else if (result.session) {
                    // Auto-login after signup
                    showSuccess('Account created! Redirecting...');
                    setTimeout(() => {
                        window.location.href = '/plan.html';
                    }, 1500);
                }

            } catch (error) {
                console.error('Signup error:', error);
                let errorMessage = 'An error occurred. Please try again.';
                
                if (error.message) {
                    if (error.message.includes('User already registered')) {
                        errorMessage = 'An account with this email already exists.';
                    } else if (error.message.includes('Password should be')) {
                        errorMessage = 'Password must be at least 6 characters long.';
                    } else if (error.message.includes('Invalid email')) {
                        errorMessage = 'Please enter a valid email address.';
                    } else {
                        errorMessage = error.message;
                    }
                }
                
                showError(errorMessage);
            } finally {
                setSignupLoading(false);
            }
        });

        // Google Sign In Function
        async function signInWithGoogle() {
            await supabase.auth.signInWithOAuth({
                provider: "google",
                options: {
                    redirectTo: "https://new-layover-final.vercel.app"
                }
            });
        }

        // Handle Google Sign In Button Click
        googleSignInBtn.addEventListener('click', async () => {
            hideMessages();
            setLoading(true);
            googleSignInBtn.disabled = true;

            try {
                await signInWithGoogle();
                // OAuth will redirect automatically
                showSuccess('Redirecting to Google...');
            } catch (error) {
                console.error('Google sign-in error:', error);
                showError('Google sign-in failed. Please try again.');
                setLoading(false);
                googleSignInBtn.disabled = false;
            }
        });

        // Listen for auth state changes
        supabase.auth.onAuthStateChange((event, session) => {
            console.log('Auth state changed:', event, session);
            
            if (event === 'SIGNED_IN') {
                // User signed in, redirect to plan page
                showSuccess('Login successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = '/plan.html';
                }, 1500);
            } else if (event === 'SIGNED_OUT') {
                // User signed out, stay on auth page
                hideMessages();
            }
        });

        // Check if user is already logged in
        async function checkAuth() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    // User is already logged in, redirect to plan page
                    window.location.href = '/plan.html';
                }
            } catch (error) {
                console.error('Auth check error:', error);
            }
        }

        // Check auth on page load
            checkAuth();
        } catch (err) {
            console.error("Auth error:", err);
        }
    </script>
</body>
</html>
