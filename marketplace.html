<script>
async function loadCategory(url, btn) {
    // 1. Update active tab UI
    document.querySelectorAll('.category-pill').forEach(p => {
        p.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
        p.classList.add('bg-white', 'border', 'text-on-surface');
    });
    if (btn) {
        btn.classList.remove('bg-white', 'border', 'text-on-surface');
        btn.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
    }

    const container = document.getElementById('marketplace-content');
    
    // Smooth fade out transition
    container.style.transition = 'opacity 0.2s ease-out';
    container.style.opacity = '0.3';

    try {
        const response = await fetch(url);
        const html = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // Extract body content but exclude redundant headers, footers, and scripts (we'll process scripts separately)
        let contentHTML = '';
        Array.from(doc.body.children).forEach(child => {
            const tag = child.tagName.toLowerCase();
            if (tag !== 'header' && tag !== 'footer' && tag !== 'script') {
                contentHTML += child.outerHTML;
            }
        });

        setTimeout(() => {
            container.innerHTML = contentHTML;

            // Extract and execute scripts inline
            const scripts = doc.querySelectorAll('script:not([id="tailwind-config"]):not([src])');
            scripts.forEach(script => {
                let code = script.textContent;
                
                // Safely convert top-level const/let to var to prevent redeclaration errors when swapping categories
                code = code.replace(/\bconst\s+/g, 'var ');
                code = code.replace(/\blet\s+/g, 'var ');
                
                // Automatically unwrap DOMContentLoaded events so they execute immediately upon injection
                code = code.replace(/document\.addEventListener\(['"]DOMContentLoaded['"][^\{]+\{([\s\S]+?)\}\);/g, '$1');
                
                const newScript = document.createElement('script');
                newScript.textContent = code;
                document.body.appendChild(newScript);
            });

            if (window.syncButtonStates) window.syncButtonStates();
            container.style.opacity = '1';
        }, 200);

    } catch (e) {
        console.error('Failed to load category:', e);
        container.innerHTML = '<div class="p-8 text-center text-error font-medium">Failed to load experiences. Please check your connection.</div>';
        container.style.opacity = '1';
    }
}

// Auto-load Recommended For You category on initial page visit
document.addEventListener('DOMContentLoaded', () => {
    const firstTab = document.querySelector('.category-pill');
    if (firstTab) loadCategory('recommended.html', firstTab);

    // Initial setup of header metrics from localStorage
    window.updateTimeCalculations();
});

window.saveLayoverList = function() {
    localStorage.setItem('layoverList', JSON.stringify(window.layoverList));
};

window.loadLayoverList = function() {
    try {
        const stored = localStorage.getItem('layoverList');
        window.layoverList = stored ? JSON.parse(stored) : [];
    } catch(e) {
        window.layoverList = [];
    }
};

window.loadLayoverList();

window.syncButtonStates = function() {
    document.querySelectorAll('button').forEach(btn => {
        const onclickStr = btn.getAttribute('onclick') || '';
        if (onclickStr.includes('window.addToList')) {
            window.layoverList.forEach(item => {
                if (onclickStr.includes(`'${item.name}'`)) {
                    if (!btn.dataset.originalClasses) {
                        btn.dataset.originalClasses = btn.className;
                        btn.dataset.originalHtml = btn.innerHTML;
                    }
                    btn.innerHTML = '<span class="material-symbols-outlined text-[14px]">check</span> Added';
                    btn.classList.remove('bg-primary', 'bg-secondary', 'text-white', 'hover:bg-indigo-700', 'bg-slate-900', 'hover:shadow-md');
                    btn.classList.add('bg-emerald-50', 'text-emerald-700', 'border', 'border-emerald-200', 'cursor-default');
                    btn.disabled = true;
                }
            });
        }
    });
};

window.addToList = function(btn, itemName, category, duration, distance, image) {
    if (!btn.dataset.originalClasses) {
        btn.dataset.originalClasses = btn.className;
        btn.dataset.originalHtml = btn.innerHTML;
    }

    const existing = window.layoverList.find(i => i.name === itemName);
    if (!existing) {
        window.layoverList.push({
            name: itemName,
            category: category || 'Experience',
            duration: duration || '',
            distance: parseFloat(distance) || 0,
            image: image || ''
        });
        window.saveLayoverList();
    }

    // Subtle visual feedback
    btn.innerHTML = '<span class="material-symbols-outlined text-[14px]">check</span> Added';
    // Remove background colors and add subtle green
    btn.classList.remove('bg-primary', 'bg-secondary', 'text-white', 'hover:bg-indigo-700', 'bg-slate-900', 'hover:shadow-md');
    btn.classList.add('bg-emerald-50', 'text-emerald-700', 'border', 'border-emerald-200', 'cursor-default');
    btn.disabled = true;

    updateListIndicator();
    updateTimeCalculations();
};

window.removeFromList = function(itemName) {
    window.layoverList = window.layoverList.filter(i => i.name !== itemName);
    window.saveLayoverList();
    
    // Restore original button state
    document.querySelectorAll('button').forEach(btn => {
        const onclickStr = btn.getAttribute('onclick') || '';
        if (onclickStr.includes(`'${itemName}'`) && btn.dataset.originalClasses) {
            btn.className = btn.dataset.originalClasses;
            btn.innerHTML = btn.dataset.originalHtml;
            btn.disabled = false;
        }
    });

    renderListDrawer();
    updateListIndicator();
    updateTimeCalculations();
};

window.calculateTiming = function() {
    let expMins = 0;
    window.layoverList.forEach(item => {
        let mins = 0;
        const durStr = item.duration.toLowerCase();
        if (durStr.includes('h')) {
            mins = parseFloat(durStr) * 60;
        } else if (durStr.includes('m')) {
            mins = parseFloat(durStr);
        }
        expMins += mins;
    });

    let worstTravelMins = 0;
    if (window.layoverList.length > 0) {
        const getPermutations = (arr) => {
            if (arr.length <= 1) return [arr];
            const result = [];
            for (let i = 0; i < arr.length; i++) {
                const current = arr[i];
                const remaining = arr.slice(0, i).concat(arr.slice(i + 1));
                const remainingPerms = getPermutations(remaining);
                for (let j = 0; j < remainingPerms.length; j++) {
                    result.push([current].concat(remainingPerms[j]));
                }
            }
            return result;
        };

        const permutations = getPermutations(window.layoverList);
        permutations.forEach(seq => {
            let seqTravelMins = 0;
            let currentDist = 0;
            seq.forEach(item => {
                let legDistance = (currentDist === 0) ? item.distance : (currentDist + item.distance);
                seqTravelMins += Math.round((legDistance * 3) + 15);
                currentDist = item.distance;
            });
            seqTravelMins += Math.round((currentDist * 3) + 15);
            if (seqTravelMins > worstTravelMins) {
                worstTravelMins = seqTravelMins;
            }
        });
    }

    return { expMins, worstTravelMins };
};

window.updateTimeCalculations = function() {
    const layoverDurationRaw = localStorage.getItem('layover_duration') || '8';
    const layoverDurationHours = parseInt(layoverDurationRaw, 10);
    
    let totalLayoverMins = layoverDurationHours * 60;
    let bufferMins = 2 * 60;
    
    let { expMins, worstTravelMins } = window.calculateTiming();
    
    let remainingMins = totalLayoverMins - bufferMins - worstTravelMins - expMins;
    
    // Format helpers
    const formatTime = (m) => m > 0 ? (m >= 60 ? Math.floor(m/60) + 'h ' + (m%60 > 0 ? (m%60)+'m' : '') : m + 'm') : '0m';
    
    // Update summary values
    document.getElementById('time-total').textContent = `${layoverDurationHours}h`;
    document.getElementById('time-travel').textContent = formatTime(worstTravelMins);
    document.getElementById('time-exp').textContent = formatTime(expMins);
    
    const flightDepartureRaw = localStorage.getItem('flight_departure') || '';
    let depTimeStr = '--:--';
    if (flightDepartureRaw) {
        try {
            const depDate = new Date(flightDepartureRaw);
            if (!isNaN(depDate.getTime())) {
                depTimeStr = depDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
            }
        } catch(e) {}
    }
    const timeDepartureEl = document.getElementById('time-departure');
    if (timeDepartureEl) timeDepartureEl.textContent = `Departure ${depTimeStr}`;
    
    let remEl = document.getElementById('time-remaining');
    let remContainer = document.getElementById('rem-container');
    let remLabel = document.getElementById('rem-label');
    
    if (remainingMins <= 0) {
        remEl.textContent = remainingMins === 0 ? '0m' : 'Risk';
        remContainer.className = 'bg-red-50 py-3 px-3 rounded-2xl border border-red-200 flex flex-col justify-center min-w-[80px] transition-colors';
        remEl.className = 'font-h3 text-[15px] text-red-700 font-bold tracking-tight mt-0.5';
        remLabel.className = 'font-label-caps text-[9px] text-red-800 leading-tight uppercase tracking-widest mb-1';
    } else {
        remEl.textContent = formatTime(remainingMins);
        if (remainingMins < 60) {
            remContainer.className = 'bg-amber-50 py-3 px-3 rounded-2xl border border-amber-200 flex flex-col justify-center min-w-[80px] transition-colors';
            remEl.className = 'font-h3 text-[15px] text-amber-700 font-bold tracking-tight mt-0.5';
            remLabel.className = 'font-label-caps text-[9px] text-amber-800 leading-tight uppercase tracking-widest mb-1';
        } else {
            remContainer.className = 'bg-emerald-50 py-3 px-3 rounded-2xl border border-emerald-100 flex flex-col justify-center min-w-[80px] transition-colors';
            remEl.className = 'font-h3 text-[15px] text-emerald-700 font-bold tracking-tight mt-0.5';
            remLabel.className = 'font-label-caps text-[9px] text-emerald-800 leading-tight uppercase tracking-widest mb-1';
        }
    }
};

window.toggleListDrawer = function() {
    let drawer = document.getElementById('list-drawer');
    if (!drawer) {
        drawer = document.createElement('div');
        drawer.id = 'list-drawer';
        drawer.className = 'fixed bottom-[140px] left-1/2 -translate-x-1/2 w-[90%] max-w-[400px] bg-white rounded-xl shadow-2xl border border-outline-variant z-[100] transition-all duration-300 transform scale-95 opacity-0 pointer-events-none flex flex-col max-h-[300px]';
        document.body.appendChild(drawer);
    }
    
    if (drawer.classList.contains('opacity-0')) {
        renderListDrawer();
        drawer.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
        drawer.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
    } else {
        drawer.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
        drawer.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
    }
};

window.renderListDrawer = function() {
    let drawer = document.getElementById('list-drawer');
    if (!drawer) return;
    
    let html = `
        <div class="px-4 py-3 border-b border-outline-variant flex justify-between items-center bg-surface-container-lowest rounded-t-xl">
            <h4 class="font-bold text-sm text-primary flex items-center gap-2"><span class="material-symbols-outlined text-[16px]">list_alt</span> Selected Experiences</h4>
            <button onclick="window.toggleListDrawer()" class="text-secondary hover:text-primary"><span class="material-symbols-outlined text-[18px]">close</span></button>
        </div>
        <div class="p-4 overflow-y-auto flex-1 space-y-3">
    `;
    
    if (window.layoverList.length === 0) {
        html += `<p class="text-xs text-secondary text-center py-4">No items added yet.</p>`;
    } else {
        let { expMins, worstTravelMins } = window.calculateTiming();
        const formatTime = (m) => m > 0 ? (m >= 60 ? Math.floor(m/60) + 'h ' + (m%60 > 0 ? (m%60)+'m' : '') : m + 'm') : '0m';

        window.layoverList.forEach(item => {
            let indTravel = Math.round((item.distance * 3 * 2) + 30);
            html += `
                <div class="flex gap-3 items-center bg-surface p-2 rounded-lg border border-outline-variant">
                    ${item.image ? `<img src="${item.image}" class="w-10 h-10 rounded object-cover">` : `<div class="w-10 h-10 rounded bg-secondary-container flex items-center justify-center"><span class="material-symbols-outlined text-on-secondary-container text-[16px]">image</span></div>`}
                    <div class="flex-1 min-w-0">
                        <p class="font-bold text-[11px] text-primary truncate">${item.name}</p>
                        <p class="text-[9px] text-secondary flex gap-1 items-center mt-0.5">
                            <span>${item.category}</span>
                            ${item.duration ? `&bull; <span>${item.duration} stay</span>` : ''}
                            &bull; <span>Est ${formatTime(indTravel)} overhead</span>
                        </p>
                    </div>
                    <button onclick="window.removeFromList('${item.name}')" class="p-1.5 text-secondary hover:text-error transition-colors rounded-md hover:bg-error-container">
                        <span class="material-symbols-outlined text-[16px]">delete</span>
                    </button>
                </div>
            `;
        });

        html += `
            <div class="mt-4 pt-3 border-t border-outline-variant flex flex-col gap-1 text-[10px] text-secondary font-medium">
                <div class="flex justify-between">
                    <span>Total Experience Time:</span>
                    <span class="font-bold text-primary">${formatTime(expMins)}</span>
                </div>
                <div class="flex justify-between">
                    <span>Est. Worst-Case Travel Overhead:</span>
                    <span class="font-bold text-primary">${formatTime(worstTravelMins)}</span>
                </div>
            </div>
        `;
    }
    
    html += `</div>`;
    drawer.innerHTML = html;
};

window.updateListIndicator = function() {
    let indicator = document.getElementById('global-list-indicator');
    if (!indicator) {
        indicator = document.createElement('div');
        indicator.id = 'global-list-indicator';
        indicator.className = 'fixed bottom-[75px] left-1/2 -translate-x-1/2 bg-white border border-outline-variant p-1.5 rounded-full shadow-lg z-[90] flex items-center gap-2 transition-all duration-300';
        document.body.appendChild(indicator);
    }

    if (window.layoverList.length > 0) {
        indicator.innerHTML = `
            <button onclick="window.toggleListDrawer()" class="flex items-center gap-2 bg-surface-container-low hover:bg-surface-container-highest text-primary px-4 py-2 rounded-full font-label-sm transition-colors border border-outline-variant/50">
                <span class="bg-primary text-white w-4 h-4 flex items-center justify-center rounded-full font-bold text-[9px]">${window.layoverList.length}</span>
                <span class="font-semibold tracking-wide text-xs">View List</span>
            </button>
            <button onclick="window.proceedToPlan(this)" class="flex items-center gap-1.5 bg-primary hover:bg-primary/90 text-white px-5 py-2 rounded-full font-label-sm transition-colors shadow-sm">
                <span class="font-semibold tracking-wide text-xs">Plan My List</span>
                <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
            </button>
        `;
        indicator.style.display = 'flex';
    } else {
        indicator.style.display = 'none';
        let drawer = document.getElementById('list-drawer');
        if (drawer) {
            drawer.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
            drawer.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
        }
    }
};

window.proceedToPlan = function(btn) {
    if (window.layoverList.length === 0) return;
    
    const originalHtml = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[14px]">refresh</span> <span class="font-semibold tracking-wide text-xs">Routing...</span>';
    btn.classList.add('opacity-90', 'cursor-wait');
    
    setTimeout(() => {
        window.location.href = 'yourplan.html';
    }, 400);
};
</script>
</body></html>
