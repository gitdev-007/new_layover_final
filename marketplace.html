// --- CORE FUNCTIONS ---

window.calculateDynamicTravelMins = function(distance) {
    const transportType = localStorage.getItem("transportType") || "Luxury";
    const speedMap = { walking: 5, cab: 28, metro: 40, bike: 18, Sedan: 40, SUV: 38, XL: 35, Luxury: 45, Shuttle: 30 };
    const speed = speedMap[transportType] || 28;
    let trafficMultiplier = 1.3;
    const flightDepartureRaw = localStorage.getItem('flight_departure');
    if (flightDepartureRaw) {
        try {
            const date = new Date(flightDepartureRaw);
            const hour = date.getHours();
            if ((hour >= 7 && hour < 10) || (hour >= 17 && hour < 21)) trafficMultiplier = 1.7;
        } catch(e) {}
    }
    return (distance / speed) * 60 * trafficMultiplier;
};

window.updateTimeCalculations = function() {
    const layoverDurationRaw = localStorage.getItem('layover_duration') || '8';
    const layoverDurationHours = parseInt(layoverDurationRaw, 10);
    const flightDepartureRaw = localStorage.getItem('flight_departure') || '';
    
    let totalMins = layoverDurationHours * 60;
    let bufferMins = 120;
    let expMins = 0;
    let worstTravelMins = 0;

    if (window.layoverList.length > 0) {
        let maxDist = 0;
        window.layoverList.forEach(item => {
            let m = 0;
            const dur = item.duration || '0m';
            if (dur.includes('h')) m = parseFloat(dur) * 60;
            else if (dur.includes('m')) m = parseFloat(dur);
            expMins += m;
            if (item.distance > maxDist) maxDist = item.distance;
        });
        worstTravelMins = Math.round(window.calculateDynamicTravelMins(maxDist) * 2 + 30);
    }

    let remainingMins = totalMins - bufferMins - worstTravelMins - expMins;
    const format = (m) => m > 0 ? (m >= 60 ? Math.floor(m/60) + 'h ' + (m%60 > 0 ? (m%60)+'m' : '') : m + 'm') : '0m';

    document.getElementById('time-total').textContent = layoverDurationHours + 'h';
    document.getElementById('time-travel').textContent = format(worstTravelMins);
    document.getElementById('time-exp').textContent = format(expMins);
    
    let depTimeStr = '--:--';
    if (flightDepartureRaw) {
        try {
            const depDate = new Date(flightDepartureRaw);
            if (!isNaN(depDate.getTime())) {
                depTimeStr = depDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
            }
        } catch(e) {}
    }
    const timeDepartureEl = document.getElementById('time-departure');
    if (timeDepartureEl) timeDepartureEl.textContent = `Departure ${depTimeStr}`;

    let remEl = document.getElementById('time-remaining');
    let remContainer = document.getElementById('rem-container');
    if (remainingMins < 0) {
        window.isRisk = true;
        remEl.textContent = 'Risk';
        remContainer.className = 'bg-red-50 border border-red-100 rounded-2xl p-4 text-center';
    } else {
        window.isRisk = false;
        remEl.textContent = format(remainingMins);
        remContainer.className = 'bg-emerald-50 border border-emerald-100 rounded-2xl p-4 text-center';
    }
};

                <select class="border border-blueprint-border p-2 rounded text-[11px] outline-none"><option>Amenities</option></select>
            </div>

                        ${premium.map(i => window.createDashboardCard(i)).join('')}
                    </div>
                </div>` : ''}

                ${standard.length ? `
                <div class="space-y-4">
                    <h4 class="text-[10px] font-bold text-brand-blue uppercase tracking-widest border-b border-blueprint-border pb-2">STANDARD OPTIONS</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

            <div class="w-full h-32 rounded-xl overflow-hidden bg-slate-200 relative">
                ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-outline-variant"><span class="material-symbols-outlined text-3xl">${catConfig.icon}</span></div>`}

                    <span class="text-white text-[8px] font-bold">${item.rating}</span>

            </div>
            <div>
                <h4 class="font-bold text-sm text-primary uppercase tracking-tight">${item.name}</h4>
                <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-1">${item.type} • ${travel}m away</p>
            </div>
        </div>
    `;
};

window.createDashboardCard = function(item) {
    const travel = Math.round(window.calculateDynamicTravelMins(item.distance));
    return `
        <div class="bg-white border border-blueprint-border p-3 hover:border-brand-blue transition-all cursor-pointer relative flex flex-col h-24" onclick="window.showDetail('${item.name}')">
            <span class="material-symbols-outlined text-slate-300 absolute top-2 right-2 text-xs">arrow_outward</span>
            <div class="mb-auto">
                <h4 class="font-bold text-[11px] text-primary uppercase tracking-tight line-clamp-1">${item.name}</h4>
                <p class="text-[9px] text-slate-400 font-medium mt-1">${item.distance} km from T2</p>
            </div>
            <div class="flex items-center justify-end">
                <span class="text-[10px] font-bold text-brand-orange">${item.rating.split(' ')[0]}</span>
            </div>
        </div>
    `;
};

window.showDetail = function(name) {
    let item;
    Object.values(window.LAYOVER_INVENTORY).forEach(cat => { const found = cat.find(i => i.name === name); if (found) item = found; });
    const l2 = document.getElementById('level2');
    const panel = document.getElementById('level2-panel');
    const content = document.getElementById('level2-content');
    const isAdded = window.layoverList.find(i => i.name === item.name);
    
    let config = CATEGORY_CONFIG[item.category === 'Hotel' ? 'hotel.html' : item.category === 'Restaurant' ? 'restaurant.html' : item.category === 'Spa' ? 'spa.html' : 'entertainment.html'] || CATEGORY_CONFIG['hotel.html'];
    const durs = config.durations || ['1h', '2h'];

    content.innerHTML = `
        <div class="h-full flex flex-col">
            <div class="p-8 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-1">Concierge View</p>
                    <h2 class="text-xl font-bold text-primary uppercase tracking-tight">EXPERIENCE DETAILS</h2>
                </div>
                <button onclick="window.hideDetail()" class="p-2 rounded-full hover:bg-white border border-transparent hover:border-slate-200 transition-all">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-10 space-y-12 no-scrollbar">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="bg-primary/5 text-primary px-2 py-0.5 rounded text-[9px] font-bold uppercase tracking-widest mb-4 inline-block border border-primary/10">${item.type}</span>
                        <h2 class="text-4xl font-bold text-primary tracking-tighter leading-none uppercase">${item.name}</h2>
                        <p class="text-sm text-slate-500 font-bold mt-4 flex items-center gap-2 uppercase tracking-wide"><span class="material-symbols-outlined text-emerald-600">location_on</span> ${item.distance} KM FROM T2 TERMINAL</p>
                    </div>
                    <div class="flex items-center gap-2 bg-emerald-500 text-white px-4 py-2 rounded-xl shadow-lg">
                        <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">star</span>
                        <span class="text-xl font-bold">${item.rating.split(' ')[0]}</span>
                    </div>
                </div>

                <div class="h-80 rounded-3xl overflow-hidden bg-slate-100 shadow-2xl relative">
                    ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-slate-300"><span class="material-symbols-outlined text-[80px]">${config.icon}</span></div>`}
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pb-32">
                    <div class="bg-slate-50 p-8 rounded-3xl border border-slate-200 space-y-6">
                        <p class="text-[10px] font-bold text-primary uppercase tracking-widest flex items-center gap-2 border-b border-slate-200 pb-4"><span class="material-symbols-outlined text-sm">verified_user</span> KEY DIFFERENTIATORS</p>
                        <ul class="text-sm font-bold text-slate-600 space-y-4">
                            ${item.details.map(d => `<li class="flex items-start gap-3"><span class="material-symbols-outlined text-emerald-600 text-[20px]">check_circle</span> <span>${d}</span></li>`).join('')}
                        </ul>
                    </div>
                    <div class="bg-primary border-[6px] border-black p-8 rounded-3xl space-y-8 flex flex-col justify-center shadow-2xl">
                        <div>
                            <label class="block text-[10px] font-bold text-white/50 uppercase tracking-widest mb-4 flex items-center gap-2"><span class="material-symbols-outlined text-sm">schedule</span> Selection Period <span class="text-red-500">*</span></label>
                            <select id="det-dur" class="w-full bg-white border-none p-5 rounded-2xl text-sm font-bold outline-none shadow-inner appearance-none cursor-pointer" onchange="document.getElementById('det-add').disabled = !this.value">
                                <option value="" disabled selected hidden>Select timing...</option>
                                ${durs.map(d => `<option value="${d}">${d.replace('h', ' Hours').replace('m', ' Mins').replace('1 Hours', '1 Hour')}</option>`).join('')}
                            </select>
                        </div>
                        <button id="det-add" ${isAdded ? 'disabled' : 'disabled'} onclick="window.addToList(this, '${item.name}', '${item.category}', document.getElementById('det-dur').value, ${item.distance}, '${item.image}')" class="w-full bg-white text-black font-bold py-6 rounded-2xl text-sm uppercase tracking-widest shadow-2xl active:scale-[0.98] transition-all disabled:opacity-30 flex items-center justify-center gap-3">
                            ${isAdded ? '<span class="material-symbols-outlined">check</span> SECURED' : '<span class="material-symbols-outlined">add_task</span> ADD TO LIST'}
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    l2.classList.remove('hidden');
    setTimeout(() => { 
        l2.classList.add('opacity-100');
        panel.classList.remove('translate-x-full');
    }, 10);
};

window.hideDetail = function() {
    const l2 = document.getElementById('level2');
    const panel = document.getElementById('level2-panel');
    if (l2) {
        panel.classList.add('translate-x-full');
        l2.classList.remove('opacity-100');
        setTimeout(() => l2.classList.add('hidden'), 300);
    }
};

window.toggleListDrawer = function() {
    const drawer = document.getElementById('list-drawer');
    const panel = document.getElementById('list-drawer-panel');
    const content = document.getElementById('list-drawer-content');
    
    if (drawer.classList.contains('hidden')) {
        content.innerHTML = window.layoverList.length > 0 ? 
            window.layoverList.map((item, idx) => `
                <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                    <div>
                        <p class="font-bold text-xs text-primary uppercase">${item.name}</p>
                        <p class="text-[9px] text-slate-400 font-bold uppercase mt-1">${item.category} • ${item.duration.replace('h',' hr').replace('m',' min')}</p>
                    </div>
                    <button onclick="window.removeFromList('${item.name}')" class="text-slate-300 hover:text-red-500 transition-colors">
                        <span class="material-symbols-outlined text-lg">delete</span>
                    </button>
                </div>
            `).join('') : '<p class="text-center text-slate-400 font-bold text-[10px] uppercase py-20 tracking-widest">No items secured</p>';
            
        drawer.classList.remove('hidden');
        setTimeout(() => {
            drawer.classList.add('opacity-100');
            panel.classList.remove('translate-x-full');
        }, 10);
    } else {
        panel.classList.add('translate-x-full');
        drawer.classList.remove('opacity-100');
        setTimeout(() => drawer.classList.add('hidden'), 300);
    }
};

window.addToList = function(btn, itemName, category, duration, distance, image) {
    if (!duration) return;
    const existing = window.layoverList.find(i => i.name === itemName);
    if (!existing) {
        window.layoverList.push({ name: itemName, category, duration, distance: parseFloat(distance) || 0, image: image || '' });
        localStorage.setItem('layoverList', JSON.stringify(window.layoverList));
    }
    btn.innerHTML = '<span class="material-symbols-outlined text-[14px]">check</span> Secured';
    btn.className = "w-full bg-emerald-50 text-emerald-700 border border-emerald-200 py-6 rounded-2xl text-sm font-bold flex items-center justify-center gap-2 cursor-default uppercase tracking-widest shadow-none";
    btn.disabled = true;
    window.updateListIndicator();
    window.updateTimeCalculations();
};

window.removeFromList = function(itemName) {
    window.layoverList = window.layoverList.filter(i => i.name !== itemName);
    localStorage.setItem('layoverList', JSON.stringify(window.layoverList));
    window.renderCategory(window.activeCategory);
    window.updateListIndicator();
    window.updateTimeCalculations();
    // Refresh drawer if open
    const drawer = document.getElementById('list-drawer');
    if (!drawer.classList.contains('hidden')) {
        const content = document.getElementById('list-drawer-content');
        content.innerHTML = window.layoverList.length > 0 ? 
            window.layoverList.map((item, idx) => `
                <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                    <div>
                        <p class="font-bold text-xs text-primary uppercase">${item.name}</p>
                        <p class="text-[9px] text-slate-400 font-bold uppercase mt-1">${item.category} • ${item.duration.replace('h',' hr').replace('m',' min')}</p>
                    </div>
                    <button onclick="window.removeFromList('${item.name}')" class="text-slate-300 hover:text-red-500 transition-colors">
                        <span class="material-symbols-outlined text-lg">delete</span>
                    </button>
                </div>
            `).join('') : '<p class="text-center text-slate-400 font-bold text-[10px] uppercase py-20 tracking-widest">No items secured</p>';
    }
};

window.updateListIndicator = function() {
    const tripPlanActivated = localStorage.getItem('tripPlanActivated') === 'true';
    const tripsTab = document.getElementById('nav-trips-tab');
    if (tripsTab) {
        if (tripPlanActivated) {
            tripsTab.style.opacity = '1';
            tripsTab.style.pointerEvents = 'auto';
            tripsTab.style.cursor = 'pointer';
            tripsTab.onclick = () => window.location.href = 'yourplan.html';
        } else {
            tripsTab.style.opacity = '0.4';
            tripsTab.style.pointerEvents = 'none';
            tripsTab.style.cursor = 'not-allowed';
        }
    }

    let indicator = document.getElementById('global-list-indicator');
    if (!indicator) {
        indicator = document.createElement('div');
        indicator.id = 'global-list-indicator';
        indicator.className = 'fixed bottom-[100px] left-1/2 -translate-x-1/2 z-[100] transition-all duration-300';
        document.body.appendChild(indicator);
    }
    if (window.layoverList.length > 0) {
        indicator.style.display = 'flex';
        indicator.innerHTML = `
            <div class="flex items-center gap-2 bg-white/95 backdrop-blur-md border border-slate-200 p-2 rounded-full shadow-2xl ring-1 ring-black/5">
                <button onclick=\"window.toggleListDrawer()\" class="bg-slate-100 hover:bg-slate-200 px-6 py-3 rounded-full font-bold text-[10px] uppercase tracking-widest text-primary border border-slate-300 transition-colors">View List (${window.layoverList.length})</button>
                <button onclick=\"window.proceedToPlan(this)\" class=\"bg-black text-white px-8 py-3 rounded-full font-bold text-[10px] uppercase tracking-widest flex items-center gap-2 shadow-lg active:scale-95 transition-all\">Plan My Trip <span class=\"material-symbols-outlined text-sm\">arrow_forward</span></button>
            </div>`;
    } else {
        indicator.style.display = 'none';
    }
};

window.proceedToPlan = function(btn) {
    if (window.isRisk) {
        alert("Your itinerary exceeds the available layover time. Reduce stay durations or remove experiences before proceeding.");
        return;
    }
    localStorage.setItem("tripPlanActivated", "true");
    window.location.href = 'yourplan.html';
};

document.addEventListener('DOMContentLoaded', () => {
    try {
        const stored = localStorage.getItem('layoverList');
        window.layoverList = stored ? JSON.parse(stored) : [];
    } catch(e) { window.layoverList = []; }

    window.renderCategory('recommended');
    window.updateTimeCalculations();
    window.updateListIndicator();
});
</script>
</body></html>
