<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Plan My Layover - Itinerary Builder</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#1d4ed8",
                        "primary-container": "#bfdbfe",
                        secondary: "#ea580c",
                        "secondary-container": "#fed7aa",
                        surface: "#ffffff",
                        "surface-container": "#f8fafc",
                        "surface-container-high": "#f1f5f9",
                        "outline-variant": "#cbd5e1",
                        "on-surface": "#0f172a",
                        "on-surface-variant": "#475569",
                        "brand-blue": "#2563eb",
                        "brand-orange": "#f97316"
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        manrope: ["Manrope", "sans-serif"]
                    },
                    fontSize: {
                        "meta-label": ["10px", { letterSpacing: "0.1em", fontWeight: "700" }],
                        "node-title-lg": ["20px", { letterSpacing: "-0.02em", fontWeight: "800" }],
                        "node-title-md": ["16px", { letterSpacing: "-0.01em", fontWeight: "700" }],
                        "node-description": ["12px", { lineHeight: "1.5" }]
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f7f7fb; font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-on-surface font-sans antialiased overflow-x-hidden min-h-screen flex flex-col pb-32">
    <!-- Navbar -->
    <header class="w-full bg-white border-b border-outline-variant sticky top-0 z-50">
        <div class="max-w-[1400px] mx-auto px-6 h-16 flex justify-between items-center text-sm font-semibold text-on-surface-variant">
            <div class="flex items-center gap-8">
                <a class="text-lg font-bold text-primary font-manrope uppercase tracking-tight" href="index.html">LayoverX</a>
                <nav class="hidden md:flex gap-6 items-center">
                    <a class="hover:text-primary transition-colors uppercase text-[11px] tracking-widest" href="marketplace.html">Explore</a>
                    <a class="text-primary border-b-2 border-primary pb-1 uppercase text-[11px] tracking-widest" href="#">Plan</a>
                    <a class="hover:text-primary transition-colors uppercase text-[11px] tracking-widest" href="#">Support</a>
                </nav>
            </div>
            <div class="flex gap-4 items-center">
                <span class="material-symbols-outlined text-[20px]">notifications</span>
                <span class="material-symbols-outlined text-[20px]">account_circle</span>
            </div>
        </div>
    </header>

    <main class="flex-grow w-full max-w-4xl mx-auto p-4 flex flex-col gap-6 relative mt-4">
        
        <!-- Smart Time Panel -->
        <section class="bg-white border-2 border-primary-container rounded-xl p-6 shadow-sm relative overflow-hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-meta-label text-on-surface flex items-center gap-2 uppercase"><span class="material-symbols-outlined text-sm">schedule</span> Journey Timeline</h2>
                <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
                    <span class="material-symbols-outlined text-xs text-brand-blue">flight_takeoff</span>
                    <span class="text-[10px] text-brand-blue tracking-widest font-bold uppercase" id="time-departure">Departure --:--</span>
                </div>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                <div class="bg-surface-container border border-outline-variant rounded-lg p-4 text-center">
                    <p class="text-[9px] text-on-surface-variant uppercase font-bold tracking-widest mb-1">Layover</p>
                    <p class="text-sm font-extrabold text-primary" id="time-total">6h</p>
                </div>
                <div class="bg-surface-container border border-outline-variant rounded-lg p-4 text-center">
                    <p class="text-[9px] text-on-surface-variant uppercase font-bold tracking-widest mb-1">Buffer</p>
                    <p class="text-sm font-extrabold text-primary" id="time-buffer">2h 0m</p>
                </div>
                <div class="bg-surface-container border border-outline-variant rounded-lg p-4 text-center">
                    <p class="text-[9px] text-on-surface-variant uppercase font-bold tracking-widest mb-1">Travel</p>
                    <p class="text-sm font-extrabold text-primary" id="time-travel">0m</p>
                </div>
                <div class="bg-surface-container border border-outline-variant rounded-lg p-4 text-center">
                    <p class="text-[9px] text-on-surface-variant uppercase font-bold tracking-widest mb-1">Experiences</p>
                    <p class="text-sm font-extrabold text-brand-blue" id="time-exp">0m</p>
                </div>
                <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-4 text-center col-span-2 md:col-span-1 transition-colors duration-300" id="rem-container">
                    <p class="text-[9px] text-emerald-800 uppercase font-bold tracking-widest mb-1" id="rem-label">Remaining</p>
                    <p class="text-base font-extrabold text-emerald-700" id="time-remaining">4h 0m</p>
                </div>
            </div>
        </section>

        <!-- Planned Itinerary -->
        <section class="space-y-4">
            <div class="flex justify-between items-center border-b border-outline-variant pb-2">
                <h3 class="text-node-title-lg text-primary uppercase font-manrope">Planned Itinerary</h3>
                <span class="text-on-surface-variant font-bold text-[11px] uppercase tracking-widest" id="plan-activity-count">0 activities scheduled</span>
            </div>
            
            <div id="itinerary-list" class="space-y-3">
                <!-- Rendered via JS -->
            </div>

            <!-- Add Experience Placeholder -->
            <button onclick="window.location.href='marketplace.html'" class="w-full border-2 border-dashed border-outline-variant rounded-xl py-8 flex flex-col items-center justify-center text-on-surface-variant hover:text-primary hover:border-primary transition-all group mt-4 bg-white/50">
                <span class="material-symbols-outlined text-3xl mb-2">add_circle</span>
                <span class="text-[10px] font-bold uppercase tracking-widest">ADD MORE EXPERIENCES</span>
            </button>
        </section>

    </main>

    <!-- Operational Action FAB -->
    <button id="finalize-btn" class="fixed bottom-24 right-6 bg-primary text-white shadow-xl rounded-full flex items-center gap-3 px-8 py-4 active:scale-95 transition-all z-40 hover:shadow-2xl hover:-translate-y-1">
        <span class="material-symbols-outlined">task_alt</span>
        <span class="text-[11px] font-bold uppercase tracking-widest">FINALIZE ITINERARY</span>
    </button>

    <!-- BottomNavBar -->
    <nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-6 h-20 bg-white/95 backdrop-blur-md border-t border-outline-variant">
        <button onclick="window.location.href='index.html'" class="flex flex-col items-center justify-center text-on-surface-variant">
            <span class="material-symbols-outlined text-2xl">explore</span>
            <span class="text-[9px] uppercase tracking-widest mt-1">Explore</span>
        </button>
        <button class="flex flex-col items-center justify-center text-primary font-bold">
            <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">event_note</span>
            <span class="text-[9px] uppercase tracking-widest mt-1">Plan</span>
        </button>
        <button class="flex flex-col items-center justify-center text-on-surface-variant">
            <span class="material-symbols-outlined text-2xl">support_agent</span>
            <span class="text-[9px] uppercase tracking-widest mt-1">Support</span>
        </button>
    </nav>

    <script>
        // --- CENTRALIZED DURATION CONFIG ---
        const categoryDurations = {
            'hotel': ['1 Hour', '2 Hours', '3 Hours', 'Overnight'],
            'restaurant': ['30 Min', '1 Hour', '90 Min'],
            'spa': ['30 Min', '1 Hour', '90 Min', '2 Hours'],
            'entertainment': ['30 Min', '1 Hour', '2 Hours']
        };

        window.AIRPORT_COORDS = { lat: 19.0974, lng: 72.8745, name: "Mumbai BOM T2" };
        window.layoverList = [];

        // --- CORE FUNCTIONS (Synced with Marketplace) ---
        window.parseDurationToMins = function(durStr) {
            if (!durStr) return 0;
            const lower = String(durStr).toLowerCase();
            let mins = 0;
            if (lower.includes('overnight')) return 480; 
            const hMatch = lower.match(/([\d\.]+)\s*h/); if (hMatch) mins += parseFloat(hMatch[1]) * 60;
            const mMatch = lower.match(/([\d\.]+)\s*m/); if (mMatch) mins += parseFloat(mMatch[1]);
            if (!hMatch && !mMatch) { const val = parseFloat(lower); if (!isNaN(val)) mins = val <= 24 ? val * 60 : val; }
            return mins;
        };


        window.RoutingEngine = {
            haversineDistance: function(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            },
            calculateLeg: function(startCoord, endCoord) {
                const dist = this.haversineDistance(startCoord.lat, startCoord.lng, endCoord.lat, endCoord.lng) * 1.4;
                const transportType = localStorage.getItem("transportType") || "Luxury";
                const speeds = { Walking: 5, Shuttle: 30, Transit: 40, Taxi: 35, Luxury: 45 };
                const speed = speeds[transportType] || 35;
                const durationMins = Math.round((dist / speed) * 60 + 8);
                return { durationMins, distKm: dist.toFixed(1), mode: transportType.toLowerCase() };
            }
        };

        window.calculateItineraryTravel = function(list) {
            let total = 0; let legs = []; let currentCoord = window.AIRPORT_COORDS;
            list.forEach(item => {
                let target = { lat: item.lat || window.AIRPORT_COORDS.lat + ((item.distance||0.5)/111), lng: item.lng || window.AIRPORT_COORDS.lng + ((item.distance||0.5)/111) };
                const leg = window.RoutingEngine.calculateLeg(currentCoord, target);
                legs.push(leg); total += leg.durationMins; currentCoord = target;
            });
            const ret = window.RoutingEngine.calculateLeg(currentCoord, window.AIRPORT_COORDS);
            total += ret.durationMins; legs.push(ret);
            return { totalTravelMins: total, legs: legs };
        };

        window.updateTimeCalculations = function() {
            const layoverH = parseInt(localStorage.getItem('layover_duration') || '6', 10);
            let totalMins = layoverH * 60;
            let expMins = 0;
            window.layoverList.forEach(i => expMins += window.parseDurationToMins(i.duration));
            const travelData = window.calculateItineraryTravel(window.layoverList);
            const travelMins = travelData.totalTravelMins;
            const remainingMins = totalMins - 120 - travelMins - expMins;

            document.getElementById('time-total').textContent = layoverH + 'h';
            document.getElementById('time-travel').textContent = travelMins + 'm';
            document.getElementById('time-exp').textContent = expMins + 'm';
            
            const remEl = document.getElementById('time-remaining');
            const remContainer = document.getElementById('rem-container');
            const format = (m) => m > 0 ? (m >= 60 ? Math.floor(m/60) + 'h ' + (m%60 > 0 ? (m%60)+'m' : '') : m + 'm') : '0m';
            remEl.textContent = format(remainingMins);
            
            if (remainingMins < 15) { remEl.style.color = '#dc2626'; remContainer.style.backgroundColor = '#fef2f2'; }
            else if (remainingMins <= 45) { remEl.style.color = '#b45309'; remContainer.style.backgroundColor = '#fffbeb'; }
            else { remEl.style.color = '#15803d'; remContainer.style.backgroundColor = '#ecfdf5'; }

            const flightDep = localStorage.getItem('flight_departure');
            if (flightDep) {
                try {
                    const depDate = new Date(flightDep);
                    document.getElementById('time-departure').textContent = `Departure ${depDate.getHours().toString().padStart(2,'0')}:${depDate.getMinutes().toString().padStart(2,'0')}`;
                } catch(e) {}
            }
        };

        window.moveUp = function(i) {
            if (i > 0) {
                let temp = window.layoverList[i];
                window.layoverList[i] = window.layoverList[i-1];
                window.layoverList[i-1] = temp;
                window.saveAndRender();
            }
        };

        window.moveDown = function(i) {
            if (i < window.layoverList.length - 1) {
                let temp = window.layoverList[i];
                window.layoverList[i] = window.layoverList[i+1];
                window.layoverList[i+1] = temp;
                window.saveAndRender();
            }
        };

        window.saveAndRender = function() {
            localStorage.setItem('layoverList', JSON.stringify(window.layoverList));
            window.renderItinerary();
            window.updateTimeCalculations();
        };

        window.removeItem = function(name) {
            window.layoverList = window.layoverList.filter(i => i.name !== name);
            window.saveAndRender();
        };

        window.updateDur = function(name, val) {
            const i = window.layoverList.find(x => x.name === name);
            if (i) i.duration = val;
            window.saveAndRender();
        };

        window.renderItinerary = function() {
            const listContainer = document.getElementById('itinerary-list');
            const countEl = document.getElementById('plan-activity-count');
            countEl.textContent = `${window.layoverList.length} activit${window.layoverList.length === 1 ? 'y' : 'ies'} scheduled`;

            if (window.layoverList.length === 0) {
                listContainer.innerHTML = `<div class="bg-white border-2 border-dashed border-outline-variant rounded-xl p-12 text-center text-on-surface-variant uppercase font-bold text-[10px] tracking-widest">No activities selected. Start browsing to plan your layover.</div>`;
                return;
            }

            let html = '';
            window.layoverList.forEach((item, index) => {
                const catKey = (item.category || 'hotel').toLowerCase();
                const options = categoryDurations[catKey] || categoryDurations.hotel;
                
                html += `
                    <div class="bg-white border border-outline-variant rounded-xl p-4 flex gap-4 items-center group shadow-sm hover:shadow-md transition-all">
                        <div class="flex flex-col items-center gap-0.5 shrink-0">
                            <button onclick="window.moveUp(${index})" class="text-outline-variant hover:text-primary ${index===0 ? 'opacity-0 cursor-default' : ''}" ${index===0 ? 'disabled' : ''}><span class="material-symbols-outlined text-sm">arrow_upward</span></button>
                            <div class="w-8 h-8 bg-primary/5 rounded-full flex items-center justify-center text-primary font-bold text-sm border border-primary/10">${index + 1}</div>
                            <button onclick="window.moveDown(${index})" class="text-outline-variant hover:text-primary ${index===window.layoverList.length-1 ? 'opacity-0 cursor-default' : ''}" ${index===window.layoverList.length-1 ? 'disabled' : ''}><span class="material-symbols-outlined text-sm">arrow_downward</span></button>
                        </div>
                        <div class="flex-grow min-w-0">
                            <h4 class="font-bold text-sm text-primary uppercase truncate">${item.name}</h4>
                            <p class="text-[9px] font-bold text-on-surface-variant uppercase tracking-widest">${item.category} • ${item.distance || '0.5'} km from T2</p>
                        </div>
                        <div class="flex items-center gap-3 shrink-0">
                            <select onchange="window.updateDur('${item.name.replace(/'/g, "\\'")}', this.value)" class="bg-surface-container border border-outline-variant text-[11px] font-bold uppercase rounded-lg px-3 py-1.5 outline-none cursor-pointer hover:bg-surface-container-high transition-colors">
                                ${options.map(o => `<option value="${o}" ${item.duration === o ? 'selected' : ''}>${o}</option>`).join('')}
                            </select>
                            <button onclick="window.removeItem('${item.name.replace(/'/g, "\\'")}')" class="text-outline-variant hover:text-error transition-colors p-2 rounded-lg hover:bg-error/5">
                                <span class="material-symbols-outlined text-xl">delete</span>
                            </button>
                        </div>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        };

        document.addEventListener('DOMContentLoaded', () => {
            try { window.layoverList = JSON.parse(localStorage.getItem('layoverList') || '[]'); } catch(e) { window.layoverList = []; }
            window.renderItinerary();
            window.updateTimeCalculations();

            const finalizeBtn = document.getElementById('finalize-btn');
            if (finalizeBtn) {
                finalizeBtn.onclick = () => {
                    if (window.layoverList.length === 0) return;
                    window.location.href = 'finalize_itinerary.html';
                };
            }
        });
    </script>
</body>
</html>
