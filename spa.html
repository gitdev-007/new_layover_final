<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StayMarket | Spa</title>
<style>
        .spa-item { cursor: pointer; }
        .filter-field { cursor: pointer; min-height: 32px; width: 100%; outline: none; }
        .filter-field:focus { box-shadow: 0 0 0 2px rgba(74, 68, 255, 0.18); }
</style>
</head>
<body class="bg-white text-on-background font-node-description antialiased p-8">
<main class="max-w-7xl mx-auto space-y-12">
<div class="main-layout">
<!-- LEVEL 1: SPA LISTING PAGE -->
<div class="level1 space-y-6 relative z-10">
<div class="bg-white border-2 border-primary-container p-node-padding rounded shadow-sm">
<div class="flex justify-between items-start mb-6">
<h3 class="text-node-title-md font-node-title-md text-primary">Spa &amp; Wellness Listing</h3>
<span class="bg-green-100 text-green-700 text-[10px] px-2 py-0.5 rounded font-bold uppercase">Finalized</span>
</div>
<div class="space-y-4">
<div class="border border-outline-variant p-3">
<p class="text-meta-label text-outline mb-1">SEARCH &amp; FILTERS</p>
<div class="grid grid-cols-2 gap-2 text-node-description">
<select class="filter-field bg-surface-container-high px-2 py-1 rounded border-0 text-node-description" data-filter-field="duration" onchange="applyFilters()">
<option value="" disabled selected hidden>Select Stay Duration</option>
<option value="1">1 hr</option>
<option value="1.5">1.5 hr</option>
<option value="2">2 hr</option>
</select>
<select class="filter-field bg-surface-container-high px-2 py-1 rounded border-0 text-node-description" data-filter-field="priceRange" onchange="applyFilters()">
<option selected value="0-2000">₹0 – ₹2000</option>
<option value="2000-5000">₹2000 – ₹5000</option>
<option value="5000+">₹5000+</option>
</select>
<select class="filter-field bg-surface-container-high px-2 py-1 rounded border-0 text-node-description" data-filter-field="distance" onchange="applyFilters()">
<option selected value="0-5">0 – 5 km</option>
<option value="5-10">5 – 10 km</option>
<option value="10+">10+ km</option>
</select>
<select class="filter-field bg-surface-container-high px-2 py-1 rounded border-0 text-node-description" data-filter-field="type" onchange="applyFilters()">
<option selected value="">All Types</option>
<option value="Ayurvedic">Ayurvedic</option>
<option value="Holistic">Holistic</option>
</select>
</div>
</div>
<div class="border-2 border-dashed border-outline-variant p-3">
<p class="text-meta-label text-outline mb-2" id="inventory-count">SPA INVENTORY (0 FOUND)</p>
<div class="rounded-lg flex gap-3">
    <div class="space-y-2 w-full" id="inventory-list"></div>
</div>
</div>
</div>
</div>
</div>
<!-- LEVEL 2: SPA DETAIL PAGE -->
<div class="level2 space-y-6 relative z-10">
<div class="bg-white border-2 border-secondary p-node-padding rounded shadow-sm">
<div class="flex justify-between items-start mb-6">
<h3 class="text-node-title-md font-node-title-md text-secondary">Spa Detail Page</h3>
<span class="bg-purple-100 text-purple-700 text-[10px] px-2 py-0.5 rounded font-bold uppercase">Active</span>
</div>
<div class="space-y-4" id="level2-content">
</div>
</div>
</div>
</div>
</main>
<script>
    var level2 = document.querySelector('.level2');
    var mainLayout = document.querySelector('.main-layout');
    var filterFields = document.querySelectorAll('[data-filter-field]');
    var filterState = { distance: '0-5', priceRange: '0-2000', type: '', duration: '' };

    var updateFilterState = (field) => {
        filterState[field.dataset.filterField] = field.value.trim();
    };

    var inventoryData = window.LAYOVER_INVENTORY ? window.LAYOVER_INVENTORY['Spa'] : [];

    var renderList = () => {
        var listContainer = document.getElementById('inventory-list');
        var html = '';
        var visibleCount = 0;

        var durFilter = filterState.duration || '';
        var durText = durFilter ? `${durFilter}h` : '';

        inventoryData.forEach(item => {
            var strictMatch = true;

            var filterDistance = filterState.distance || '';
            if (filterDistance) {
                if (filterDistance.endsWith('+')) {
                    var min = parseFloat(filterDistance);
                    if (item.distance < min) strictMatch = false;
                } else {
                    var parts = filterDistance.split('-');
                    if (parts.length === 2) {
                        if (item.distance < parseFloat(parts[0]) || item.distance > parseFloat(parts[1])) strictMatch = false;
                    }
                }
            }

            var filterPrice = filterState.priceRange || '';
            if (strictMatch && filterPrice) {
                var p = item.price || 0;
                if (filterPrice.endsWith('+')) {
                    var min = parseInt(filterPrice, 10);
                    if (p < min) strictMatch = false;
                } else {
                    var parts = filterPrice.split('-');
                    if (parts.length === 2) {
                        if (p < parseInt(parts[0], 10) || p > parseInt(parts[1], 10)) strictMatch = false;
                    }
                }
            }

            var filterType = filterState.type || '';
            if (strictMatch && filterType) {
                if (item.type !== filterType) strictMatch = false;
            }

            if (strictMatch) {
                visibleCount++;
                var indTravel = 0;
                if (window.calculateDynamicTravelMins) {
                    indTravel = Math.round(window.calculateDynamicTravelMins(item.distance));
                }
                var travelStr = indTravel > 0 ? `Est ${indTravel}m travel` : `${item.distance} KM`;

                html += `
                <div class="spa-item p-3 bg-surface border border-outline-variant rounded-lg text-[11px] text-on-surface flex justify-between items-center cursor-pointer hover:bg-surface-container-low hover:border-primary/30 transition-colors shadow-sm" onclick="showLevel2('${item.name}')">
                    <div class="flex items-center gap-3">
                        ${item.image ? `<img src="${item.image}" class="w-10 h-10 rounded object-cover">` : `<div class="w-10 h-10 rounded bg-secondary-container flex items-center justify-center"><span class="material-symbols-outlined text-on-secondary-container text-[16px]">spa</span></div>`}
                        <div>
                            <p class="font-bold text-[13px] text-primary">${item.name}</p>
                            <p class="text-[10px] text-secondary flex items-center gap-1 mt-0.5">${item.type} ${durText ? `&bull; ${durText} stay` : ''}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="material-symbols-outlined text-[16px] text-primary">spa</span>
                        <p class="text-[10px] text-outline font-medium mt-0.5">${travelStr}</p>
                    </div>
                </div>
                `;
            }
        });

        listContainer.innerHTML = html || '<p class="text-xs text-secondary text-center py-4">No spas match your filters.</p>';
        document.getElementById('inventory-count').textContent = `SPA INVENTORY (${visibleCount} FOUND)`;
    };

    var applyFilters = () => {
        filterFields.forEach(field => updateFilterState(field));
        renderList();
    };

    var showLevel2 = (name) => {
        var detail = inventoryData.find(i => i.name === name);
        if (!detail || !level2) return;
        
        var durFilter = filterState.duration || '';
        
        var content = document.getElementById('level2-content');
        content.innerHTML = `
<div class="border border-outline-variant p-3 bg-secondary/5 rounded-lg">
<p class="text-meta-label text-secondary mb-1">ENTITY HEADER</p>
<h4 class="text-node-title-md font-bold">${detail.name}</h4>
<div class="flex gap-2 mt-1">
<span class="text-[10px] bg-secondary-fixed text-on-secondary-fixed px-1.5 py-0.5 rounded font-semibold">${detail.rating}</span>
<span class="text-[10px] text-outline">${detail.distance} km from Airport</span>
</div>
</div>
<div class="border border-outline-variant p-3 bg-surface-container rounded-lg mt-4">
<p class="text-meta-label text-outline mb-2">KEY DIFFERENTIATORS</p>
<ul class="text-[11px] space-y-1.5">
${detail.details.map((item) => `<li class="flex items-center gap-2 text-secondary"><span class="material-symbols-outlined text-[14px] text-green-600">check_circle</span> ${item}</li>`).join('')}
</ul>
</div>
<div class="border-2 border-secondary p-3 rounded bg-secondary-fixed/20 mt-4">
<p class="text-meta-label text-secondary font-bold mb-2">DURATION-BASED PRICING</p>
<div class="grid grid-cols-3 gap-1 text-center">
<div class="bg-white p-1 rounded border border-secondary-fixed"><p class="text-[9px] text-outline">1 HR</p><p class="font-bold text-[11px]">${detail.prices && detail.prices.one ? detail.prices.one : '-'}</p></div>
<div class="bg-white p-1 rounded border border-secondary-fixed"><p class="text-[9px] text-outline">2 HR</p><p class="font-bold text-[11px]">${detail.prices && detail.prices.two ? detail.prices.two : '-'}</p></div>
<div class="bg-white p-1 rounded border border-secondary bg-secondary/10"><p class="text-[9px] text-secondary font-bold">4 HR</p><p class="font-bold text-[11px]">${detail.prices && detail.prices.three ? detail.prices.three : '-'}</p></div>
</div>
</div>
<div class="mt-6 border-t border-outline-variant pt-4">
    <div class="flex flex-col gap-2 w-full mb-3">
        <label class="block text-[9px] font-bold text-secondary uppercase">Select Stay Duration</label>
        <select class="w-full bg-surface border border-outline-variant p-2 rounded text-[11px] focus:outline-none focus:border-primary" onchange="this.nextElementSibling.disabled = false; this.nextElementSibling.dataset.duration = this.value;">
            <option value="" disabled selected hidden>Select Duration</option>
            <option value="30m">30 mins</option>
            <option value="1h" ${durFilter === '1' ? 'selected' : ''}>1 hour</option>
            <option value="1.5h" ${durFilter === '1.5' ? 'selected' : ''}>1.5 hours</option>
            <option value="2h" ${durFilter === '2' ? 'selected' : ''}>2 hours</option>
            <option value="3h" ${durFilter === '3' ? 'selected' : ''}>3 hours</option>
            <option value="4h" ${durFilter === '4' ? 'selected' : ''}>4 hours</option>
            <option value="6h" ${durFilter === '6' ? 'selected' : ''}>6 hours</option>
            <option value="8h" ${durFilter === '8' ? 'selected' : ''}>8 hours</option>
        </select>
        <button disabled data-duration="" onclick="window.addToList && window.addToList(this, '${detail.name}', '${detail.category}', this.dataset.duration, ${detail.distance}, '${detail.image}')" class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3 rounded-lg text-sm tracking-wide flex justify-center items-center gap-2 transition-all duration-200 shadow-md disabled:opacity-50 disabled:cursor-not-allowed">Add to List</button>
    </div>
</div>
        `;
        if (mainLayout) mainLayout.classList.add('active');
        if (level2) level2.style.display = 'block';
        if (window.syncButtonStates) window.syncButtonStates();
    };

    filterFields.forEach((field) => {
        field.addEventListener('change', applyFilters);
    });

    applyFilters();
</script>
</body></html>
