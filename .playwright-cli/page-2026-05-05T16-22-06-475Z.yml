          - generic [ref=e476]:
            - heading "Taxonomy and diversity" [level=2] [ref=e477]
            - generic [ref=e478]:
              - text: "["
              - link "edit" [ref=e479] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=2
