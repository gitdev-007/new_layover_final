          - figure "A 17-year cicada, Magicicada, Robert Evans Snodgrass, 1930[7]" [ref=e480]:
            - link [ref=e481] [cursor=pointer]:
              - /url: /wiki/File:Snodgrass_Magicicada_septendecim.jpg
              - img [ref=e482]
            - generic [ref=e483]:
              - text: A
              - link "17-year cicada" [ref=e484] [cursor=pointer]:
                - /url: /wiki/Magicicada_cassinii
              - text: ", Magicicada,"
              - link "Robert Evans Snodgrass" [ref=e485] [cursor=pointer]:
                - /url: /wiki/Robert_Evans_Snodgrass
              - text: ", 1930"
              - superscript [ref=e486]:
                - link "[7]" [ref=e487] [cursor=pointer]:
                  - /url: "#cite_note-9"
          - paragraph [ref=e488]:
            - text: The superfamily Cicadoidea is a sister of the
            - link "Cercopoidea" [ref=e489] [cursor=pointer]:
              - /url: /wiki/Froghopper
            - text: "(the froghoppers). Cicadas are arranged into two families: the Tettigarctidae and Cicadidae. The two"
            - link "extant" [ref=e490] [cursor=pointer]:
              - /url: /wiki/Extant_taxon
            - text: species of the Tettigarctidae include one in southern Australia and the other in
            - link "Tasmania" [ref=e491] [cursor=pointer]:
              - /url: /wiki/Tasmania
            - text: . The family Cicadidae is subdivided into the subfamilies
            - link "Cicadettinae" [ref=e492] [cursor=pointer]:
              - /url: /wiki/Cicadettinae
            - text: ","
            - link "Cicadinae" [ref=e493] [cursor=pointer]:
              - /url: /wiki/Cicadinae
            - text: ","
            - link "Derotettiginae" [ref=e494] [cursor=pointer]:
              - /url: /wiki/Derotettiginae
            - text: ","
            - link "Tibicininae" [ref=e495] [cursor=pointer]:
              - /url: /wiki/Tibicininae
            - text: (or Tettigadinae), and
            - link "Tettigomyiinae" [ref=e496] [cursor=pointer]:
              - /url: /wiki/Tettigomyiinae
            - text: ","
            - superscript [ref=e497]:
              - link "[8]" [ref=e498] [cursor=pointer]:
                - /url: "#cite_note-phylo2018-10"
            - text: and they are found on all continents except Antarctica. Some previous works also included a family-level taxon called the
            - link "Tibiceninae" [ref=e499] [cursor=pointer]:
              - /url: /wiki/Tibiceninae
            - text: . The largest species is the Malaysian emperor cicada
            - link "Megapomponia imperatoria" [ref=e501] [cursor=pointer]:
              - /url: /wiki/Megapomponia_imperatoria
            - text: ; its wingspan is up to about 20 cm (8 in).
            - superscript [ref=e502]:
              - link "[9]" [ref=e503] [cursor=pointer]:
                - /url: "#cite_note-Carwardine2008-11"
            - text: Cicadas are also notable for the great length of time some species take to mature.
            - superscript [ref=e504]:
              - link "[10]" [ref=e505] [cursor=pointer]:
                - /url: "#cite_note-Burton2002-12"
          - paragraph [ref=e506]:
            - text: At least 3,000 cicada species are distributed worldwide, in essentially any habitat that has deciduous trees, with the majority being in the tropics. Most genera are restricted to a single biogeographical region, and many species have a very limited range. This high degree of
            - link "endemism" [ref=e507] [cursor=pointer]:
              - /url: /wiki/Endemism
            - text: has been used to study the biogeography of complex island groups such as in Indonesia and Asia.
            - superscript [ref=e508]:
              - link "[11]" [ref=e509] [cursor=pointer]:
                - /url: "#cite_note-Resh-13"
            - text: There are several hundred described species in Australia and
            - link "New Zealand" [ref=e510] [cursor=pointer]:
              - /url: /wiki/List_of_cicadas_of_New_Zealand
            - text: ","
            - superscript [ref=e511]:
              - link "[c]" [ref=e512] [cursor=pointer]:
                - /url: "#cite_note-14"
            - text: around 150 in South Africa, over 170 in America north of Mexico,
            - superscript [ref=e513]:
              - link "[12]" [ref=e514] [cursor=pointer]:
                - /url: "#cite_note-15"
            - text: at least 800 in Latin America,
            - superscript [ref=e515]:
              - link "[13]" [ref=e516] [cursor=pointer]:
                - /url: "#cite_note-Hogue1993-16"
            - text: and over 200 in Southeast Asia and the Western Pacific.
            - superscript [ref=e517]:
              - link "[14]" [ref=e518] [cursor=pointer]:
                - /url: "#cite_note-17"
          - paragraph [ref=e519]:
            - text: About 100 species occur in the
            - link "Palaearctic" [ref=e520] [cursor=pointer]:
              - /url: /wiki/Palearctic_realm
            - text: . A few species are found in southern Europe,
            - superscript [ref=e521]:
              - link "[10]" [ref=e522] [cursor=pointer]:
                - /url: "#cite_note-Burton2002-12"
            - text: and a single species was known from England, the
            - link "New Forest cicada" [ref=e523] [cursor=pointer]:
              - /url: /wiki/Cicadetta_montana
            - text: ", Cicadetta montana, which also occurs in continental Europe."
            - superscript [ref=e524]:
              - link "[15]" [ref=e525] [cursor=pointer]:
                - /url: "#cite_note-18"
            - text: Many species await formal description and many well-known species are yet to be studied carefully using modern acoustic analysis tools that allow their songs to be characterized.
