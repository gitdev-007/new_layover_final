              - row "A phylogenetic treatment suggested by a 2018 study[8]" [ref=e609]:
                - cell "A phylogenetic treatment suggested by a 2018 study[8]" [ref=e610]:
                  - text: A phylogenetic treatment suggested by a 2018 study
                  - superscript [ref=e611]:
                    - link "[8]" [ref=e612] [cursor=pointer]:
                      - /url: "#cite_note-phylo2018-10"
          - paragraph [ref=e613]:
            - text: Many of the North American species are the annual or jarfly or
            - link "dog-day" [ref=e614] [cursor=pointer]:
              - /url: /wiki/Dog_days
            - text: cicadas, members of the
            - link "Neotibicen" [ref=e616] [cursor=pointer]:
              - /url: /wiki/Neotibicen
            - text: ","
            - link "Megatibicen" [ref=e618] [cursor=pointer]:
              - /url: /wiki/Megatibicen
            - text: ", or"
            - link "Hadoa" [ref=e620] [cursor=pointer]:
              - /url: /wiki/Hadoa
            - text: genera, so named because they emerge in late July and August.
            - superscript [ref=e621]:
              - link "[16]" [ref=e622] [cursor=pointer]:
                - /url: "#cite_note-Milne-19"
            - text: The best-known North American genus, however, may be
            - link "Magicicada" [ref=e624] [cursor=pointer]:
              - /url: /wiki/Magicicada
            - text: . These periodical cicadas have an extremely long life cycle of 13 or 17 years, with adults suddenly and briefly
            - link "emerging in large numbers" [ref=e625] [cursor=pointer]:
              - /url: /wiki/Predator_satiation
            - text: .
            - superscript [ref=e626]:
              - link "[16]" [ref=e627] [cursor=pointer]:
                - /url: "#cite_note-Milne-19"
            - superscript [ref=e628]:
              - link "[17]" [ref=e629] [cursor=pointer]:
                - /url: "#cite_note-magicicada-20"
          - paragraph [ref=e630]:
            - link "Australian cicadas" [ref=e631] [cursor=pointer]:
              - /url: /wiki/List_of_cicadas_of_Australia
            - text: are found on tropical islands and cold coastal beaches around Tasmania, in tropical wetlands, high and low deserts, alpine areas of
            - link "New South Wales" [ref=e632] [cursor=pointer]:
              - /url: /wiki/New_South_Wales
            - text: and
            - link "Victoria" [ref=e633] [cursor=pointer]:
              - /url: /wiki/Victoria_(Australia)
            - text: ", large cities including"
            - link "Sydney" [ref=e634] [cursor=pointer]:
              - /url: /wiki/Sydney
            - text: ","
            - link "Melbourne" [ref=e635] [cursor=pointer]:
              - /url: /wiki/Melbourne
            - text: ", and"
            - link "Brisbane" [ref=e636] [cursor=pointer]:
              - /url: /wiki/Brisbane
            - text: ", and Tasmanian highlands and snowfields. Many of them have common names such as cherry nose, brown baker,"
            - link "red eye" [ref=e637] [cursor=pointer]:
              - /url: /wiki/Psaltoda_moerens
            - text: ", greengrocer, yellow Monday, whisky drinker,"
            - link "double drummer" [ref=e638] [cursor=pointer]:
              - /url: /wiki/Double_drummer
            - text: ", and black prince. The Australian greengrocer,"
            - link "Cyclochila australasiae" [ref=e640] [cursor=pointer]:
              - /url: /wiki/Cyclochila_australasiae
            - text: ", is among the loudest insects in the world."
            - superscript [ref=e641]:
              - link "[18]" [ref=e642] [cursor=pointer]:
                - /url: "#cite_note-21"
          - figure "A chorus cicada, a species endemic to New Zealand" [ref=e643]:
            - link [ref=e644] [cursor=pointer]:
              - /url: /wiki/File:Chorus_cicada.jpg
              - img [ref=e645]
            - generic [ref=e646]:
              - text: A
              - link "chorus cicada" [ref=e647] [cursor=pointer]:
                - /url: /wiki/Chorus_cicada
              - text: ", a species endemic to New Zealand"
          - figure "Cicadas in Japan" [ref=e648]:
            - button "Play video" [ref=e652] [cursor=pointer]
            - link:
              - /url: /wiki/File:Cicada_-_Japan_-_August_2021.webm
            - generic [ref=e654]:
              - text: Cicadas in
              - link "Japan" [ref=e655] [cursor=pointer]:
                - /url: /wiki/Japan
          - paragraph [ref=e656]:
            - text: More than 40 species from five genera populate New Zealand, ranging from sea level to mountain tops, and all are
            - link "endemic" [ref=e657] [cursor=pointer]:
              - /url: /wiki/Endemism
            - text: to New Zealand and its surrounding islands (
            - link "Kermadec Islands" [ref=e658] [cursor=pointer]:
              - /url: /wiki/Kermadec_Islands
            - text: ","
            - link "Chatham Islands" [ref=e659] [cursor=pointer]:
              - /url: /wiki/Chatham_Islands
            - text: ). One species is found on Norfolk Island, which technically is part of Australia.
            - superscript [ref=e660]:
              - link "[19]" [ref=e661] [cursor=pointer]:
                - /url: "#cite_note-22"
            - text: The closest relatives of the NZ cicadas live in New Caledonia and Australia.
          - figure "Mesozoic fossil fore wing of Mesogereon superbum, Australia" [ref=e662]:
            - link [ref=e663] [cursor=pointer]:
              - /url: /wiki/File:Mesogereon_superbum_2.jpg
              - img [ref=e664]
            - generic [ref=e665]:
              - link "Mesozoic" [ref=e666] [cursor=pointer]:
                - /url: /wiki/Mesozoic
              - text: fossil fore wing of
              - link "Mesogereon superbum" [ref=e668] [cursor=pointer]:
                - /url: /w/index.php?title=Mesogereon_superbum&action=edit&redlink=1
              - text: ", Australia"
          - generic [ref=e669]:
            - heading "Palaeontology" [level=3] [ref=e670]
            - generic [ref=e671]:
              - text: "["
              - link "edit" [ref=e672] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=3
              - text: "]"
          - paragraph [ref=e673]:
            - text: Fossil Cicadomorpha first appeared in the
            - link "Late Triassic" [ref=e674] [cursor=pointer]:
              - /url: /wiki/Late_Triassic
            - text: . The superfamily
            - link "Palaeontinoidea" [ref=e675] [cursor=pointer]:
              - /url: /wiki/Palaeontinoidea
            - text: contains three families. The Upper Permian Dunstaniidae are found in Australia and South Africa, and also in younger rocks from China. The
            - link "Upper Triassic" [ref=e676] [cursor=pointer]:
              - /url: /wiki/Upper_Triassic
            - text: Mesogereonidae are found in Australia and South Africa.
            - superscript [ref=e677]:
              - link "[20]" [ref=e678] [cursor=pointer]:
                - /url: "#cite_note-Wang-23"
            - text: This group, though, is currently thought to be more distantly related to Cicadomorpha than previously thought.
            - superscript [ref=e679]:
              - link "[21]" [ref=e680] [cursor=pointer]:
                - /url: "#cite_note-24"
          - figure "The giant cicada Prolystra lithographica from Germany, Jurassic, about 145–150 million years ago" [ref=e681]:
            - link [ref=e682] [cursor=pointer]:
              - /url: /wiki/File:Prolystra_lithographica.JPG
              - img [ref=e683]
            - generic [ref=e684]:
              - text: The giant cicada
              - link "Prolystra lithographica" [ref=e686] [cursor=pointer]:
                - /url: /w/index.php?title=Prolystra_lithographica&action=edit&redlink=1
              - text: from Germany,
              - link "Jurassic" [ref=e687] [cursor=pointer]:
                - /url: /wiki/Jurassic
              - text: ", about 145–150 million years ago"
          - paragraph [ref=e688]:
            - text: The
            - link "Palaeontinidae" [ref=e689] [cursor=pointer]:
              - /url: /wiki/Palaeontinidae
            - text: or "giant cicadas" (though only distantly related to true cicadas) come from the
            - link "Jurassic" [ref=e690] [cursor=pointer]:
              - /url: /wiki/Jurassic
            - text: and
            - link "Lower Cretaceous" [ref=e691] [cursor=pointer]:
              - /url: /wiki/Lower_Cretaceous
            - text: of Eurasia and South America.
            - superscript [ref=e692]:
              - link "[20]" [ref=e693] [cursor=pointer]:
                - /url: "#cite_note-Wang-23"
            - text: The first of these was a fore wing discovered in the
            - link "Taynton Limestone Formation" [ref=e694] [cursor=pointer]:
              - /url: /wiki/Taynton_Limestone_Formation
            - text: of Oxfordshire, England; it was initially described as a butterfly in 1873, before being recognised as a cicada-like form and renamed
            - link "Palaeontina oolitica" [ref=e696] [cursor=pointer]:
              - /url: /w/index.php?title=Palaeontina_oolitica&action=edit&redlink=1
            - text: .
            - superscript [ref=e697]:
              - link "[22]" [ref=e698] [cursor=pointer]:
                - /url: "#cite_note-butler-25"
          - paragraph [ref=e699]:
            - text: Tettigarctidae and Cicadidae had diverged from each other prior to or during the
            - link "Jurassic" [ref=e700] [cursor=pointer]:
              - /url: /wiki/Jurassic
            - text: ", as evidenced by fossils related to both lineages present by the Middle Jurassic (~165 million years ago). The morphology of well preserved fossils of early relatives of Cicadidae from the mid Cretaceous"
            - link "Burmese amber" [ref=e701] [cursor=pointer]:
              - /url: /wiki/Burmese_amber
            - text: of Myanmar suggests that unlike many modern cicadids, they were either silent or only made quiet sounds.
            - superscript [ref=e702]:
              - link "[23]" [ref=e703] [cursor=pointer]:
                - /url: "#cite_note-26"
            - text: Most fossil Cicadidae are known from the Cenozoic,
            - superscript [ref=e704]:
              - link "[24]" [ref=e705] [cursor=pointer]:
                - /url: "#cite_note-Moulds2018-27"
            - text: and the oldest unambiguously identified modern cicadid is Davispia bearcreekensis (subfamily Tibicininae) from the
            - link "Paleocene" [ref=e706] [cursor=pointer]:
              - /url: /wiki/Paleocene
            - text: ", around 56–59 million years ago."
            - superscript [ref=e707]:
              - link "[25]" [ref=e708] [cursor=pointer]:
                - /url: "#cite_note-28"
          - generic [ref=e709]:
            - heading "Biology" [level=2] [ref=e710]
            - generic [ref=e711]:
              - text: "["
              - link "edit" [ref=e712] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=4
              - text: "]"
          - generic [ref=e713]:
            - heading "Description" [level=3] [ref=e714]
            - generic [ref=e715]:
              - text: "["
              - link "edit" [ref=e716] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=5
              - text: "]"
          - figure "The onomatopoeically-named Japanese min-min-zemi (ミンミンゼミ, minminzemi), Hyalessa maculaticollis, an annual cicada" [ref=e717]:
            - link [ref=e718] [cursor=pointer]:
              - /url: /wiki/File:Gratopsaltria_Nigrofuscata_Young.jpg
              - img [ref=e719]
            - generic [ref=e720]:
              - text: The
              - link "onomatopoeically" [ref=e721] [cursor=pointer]:
                - /url: /wiki/Onomatopoeia
              - text: "-named Japanese min-min-zemi"
              - generic [ref=e722]:
                - text: (
                - generic "Japanese-language text" [ref=e723]: ミンミンゼミ
                - text: ","
                - generic "Hepburn transliteration" [ref=e724]: minminzemi
                - text: )
              - text: ","
              - link "Hyalessa maculaticollis" [ref=e726] [cursor=pointer]:
                - /url: /wiki/Hyalessa_maculaticollis
              - text: ", an"
              - link "annual cicada" [ref=e727] [cursor=pointer]:
                - /url: /wiki/Annual_cicada
          - figure "A Japanese nii-nii-zemi (ニイニイゼミ, nīnīzemi), Platypleura kaempferi, an annual cicada" [ref=e728]:
            - link [ref=e729] [cursor=pointer]:
              - /url: /wiki/File:Platypleura_kaempferi_(NiiNii_cicada).png
              - img [ref=e730]
            - generic [ref=e731]:
              - text: A Japanese nii-nii-zemi
              - generic [ref=e732]:
                - text: (
                - generic "Japanese-language text" [ref=e733]: ニイニイゼミ
                - text: ","
                - generic "Hepburn transliteration" [ref=e734]: nīnīzemi
                - text: )
              - text: ", Platypleura kaempferi, an"
              - link "annual cicada" [ref=e735] [cursor=pointer]:
                - /url: /wiki/Annual_cicada
          - paragraph [ref=e736]:
            - text: Cicadas are large insects made conspicuous by the courtship calls of the males. They are characterized by having three joints in their
            - link "tarsi" [ref=e737] [cursor=pointer]:
              - /url: /wiki/Arthropod_leg#Tarsus
            - text: ", and having small"
            - link "antennae" [ref=e738] [cursor=pointer]:
              - /url: /wiki/Antenna_(biology)
            - text: with conical bases and three to six segments, including a
            - link "seta" [ref=e739] [cursor=pointer]:
              - /url: /wiki/Seta
            - text: at the tip.
            - superscript [ref=e740]:
              - link "[26]" [ref=e741] [cursor=pointer]:
                - /url: "#cite_note-Cuvier-29"
            - text: The
            - link "Auchenorrhyncha" [ref=e742] [cursor=pointer]:
              - /url: /wiki/Auchenorrhyncha
            - text: differ from other hemipterans by having a
            - link "rostrum" [ref=e743] [cursor=pointer]:
              - /url: /wiki/Rostrum_(anatomy)
            - text: that arises from the posteroventral part of the head, complex sound-producing membranes, and a mechanism for linking the wings that involves a down-rolled edging on the rear of the fore wing and an upwardly protruding flap on the hind wing.
            - superscript [ref=e744]:
              - link "[11]" [ref=e745] [cursor=pointer]:
                - /url: "#cite_note-Resh-13"
          - paragraph [ref=e746]:
            - text: Cicadas are feeble jumpers, and nymphs lack the ability to jump altogether. Another defining characteristic is the adaptations of the fore limbs of nymphs for underground life. The relict family Tettigarctidae differs from the Cicadidae in having the
            - link "prothorax" [ref=e747] [cursor=pointer]:
              - /url: /wiki/Prothorax
            - text: extending as far as the
            - link "scutellum" [ref=e748] [cursor=pointer]:
              - /url: /wiki/Scutellum_(insect_anatomy)
            - text: ", and by lacking the tympanal apparatus."
            - superscript [ref=e749]:
              - link "[11]" [ref=e750] [cursor=pointer]:
                - /url: "#cite_note-Resh-13"
          - figure "A black cicada just after molting in the garden of a private house (Midwest Saitama Prefecture, Japan)" [ref=e751]:
            - link [ref=e752] [cursor=pointer]:
              - /url: /wiki/File:20190828_semi_uka.jpg
              - img [ref=e753]
            - generic [ref=e754]:
              - text: A black cicada just after
              - link "molting" [ref=e755] [cursor=pointer]:
                - /url: /wiki/Ecdysis
              - text: in the garden of a private house (Midwest Saitama Prefecture, Japan)
          - paragraph [ref=e756]:
            - text: The adult insect, known as an
            - link "imago" [ref=e757] [cursor=pointer]:
              - /url: /wiki/Imago
            - text: ", is 2 to 5 cm (1 to 2 in) in total length in most species. The largest, the"
            - link "empress cicada" [ref=e758] [cursor=pointer]:
              - /url: /wiki/Empress_cicada
            - text: (Megapomponia imperatoria), has a head-body length around 7 cm (2.8 in), and its wingspan is 18–20 cm (7–8 in).
            - superscript [ref=e759]:
              - link "[10]" [ref=e760] [cursor=pointer]:
                - /url: "#cite_note-Burton2002-12"
            - superscript [ref=e761]:
              - link "[27]" [ref=e762] [cursor=pointer]:
                - /url: "#cite_note-30"
            - text: Cicadas have prominent compound eyes set wide apart on the sides of the head. The short antennae protrude between the eyes or in front of them. They also have three small
            - link "ocelli" [ref=e763] [cursor=pointer]:
              - /url: /wiki/Simple_eyes_in_arthropods
            - text: located on the top of the head in a triangle between the two large eyes; this distinguishes cicadas from other members of the Hemiptera. The mouthparts form a long, sharp
            - link "rostrum" [ref=e764] [cursor=pointer]:
              - /url: /wiki/Rostrum_(anatomy)
            - text: that they insert into the plant to feed.
            - superscript [ref=e765]:
              - link "[28]" [ref=e766] [cursor=pointer]:
                - /url: "#cite_note-Capinera-31"
            - text: The
            - link "postclypeus" [ref=e767] [cursor=pointer]:
              - /url: /wiki/Clypeus_(arthropod_anatomy)
            - text: is a large, nose-like structure that lies between the eyes and makes up most of the front of the head; it contains the pumping musculature.
            - superscript [ref=e768]:
              - link "[29]" [ref=e769] [cursor=pointer]:
                - /url: "#cite_note-32"
          - paragraph [ref=e770]:
            - text: The thorax has three segments and houses the powerful wing muscles. They have two pairs of membranous wings that may be
            - link "hyaline" [ref=e771] [cursor=pointer]:
              - /url: /wiki/Hyaline
            - text: ", cloudy, or pigmented. The wing venation varies between species and may help in identification. The middle thoracic segment has an"
            - link "operculum" [ref=e772] [cursor=pointer]:
              - /url: /wiki/Operculum_(animal)
            - text: on the underside, which may extend posteriorly and obscure parts of the abdomen. The abdomen is segmented, with the hindermost segments housing the reproductive organs, and terminates in females with a large, saw-edged
            - link "ovipositor" [ref=e773] [cursor=pointer]:
              - /url: /wiki/Ovipositor
            - text: . In males, the abdomen is largely hollow and used as a
            - link "resonating chamber" [ref=e774] [cursor=pointer]:
              - /url: /wiki/Resonating_device
            - text: .
            - superscript [ref=e775]:
              - link "[28]" [ref=e776] [cursor=pointer]:
                - /url: "#cite_note-Capinera-31"
          - paragraph [ref=e777]:
            - text: The surface of the fore wing is
            - link "superhydrophobic" [ref=e778] [cursor=pointer]:
              - /url: /wiki/Superhydrophobic_coating
            - text: ; it is covered with minute, waxy cones, blunt spikes that create a water-repellent film. Rain rolls across the surface, removing dirt in the process. In the absence of rain,
            - link "dew" [ref=e779] [cursor=pointer]:
              - /url: /wiki/Dew
            - text: condenses on the wings. When the droplets coalesce, the cicada leaps several millimetres into the air, which also serves to clean the wings.
            - superscript [ref=e780]:
              - link "[30]" [ref=e781] [cursor=pointer]:
                - /url: "#cite_note-33"
            - link "Bacteria" [ref=e782] [cursor=pointer]:
              - /url: /wiki/Bacteria
            - text: landing on the wing surface are not repelled; rather, their membranes are torn apart by the nanoscale-sized spikes, making the wing surface the first-known
            - link "biomaterial" [ref=e783] [cursor=pointer]:
              - /url: /wiki/Biomaterial
            - text: that can kill bacteria.
            - superscript [ref=e784]:
              - link "[31]" [ref=e785] [cursor=pointer]:
                - /url: "#cite_note-34"
          - generic [ref=e786]:
            - heading "Temperature regulation" [level=3] [ref=e787]
            - generic [ref=e788]:
              - text: "["
              - link "edit" [ref=e789] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=6
              - text: "]"
          - paragraph [ref=e790]:
            - text: Desert cicadas such as
            - link "Diceroprocta apache" [ref=e792] [cursor=pointer]:
              - /url: /wiki/Diceroprocta_apache
            - text: are unusual among insects in controlling their temperature by
            - link "evaporative cooling" [ref=e793] [cursor=pointer]:
              - /url: /wiki/Evaporative_cooling
            - text: ", analogous to"
            - link "sweating" [ref=e794] [cursor=pointer]:
              - /url: /wiki/Sweating
            - text: in mammals. When their temperature rises above about 39 °C (102 °F), they suck excess sap from the food plants and extrude the excess water through pores in the
            - link "tergum" [ref=e795] [cursor=pointer]:
              - /url: /wiki/Tergum
            - text: at a modest cost in energy. Such a rapid loss of water can be sustained only by feeding on water-rich
            - link "xylem sap" [ref=e796] [cursor=pointer]:
              - /url: /wiki/Xylem_sap
            - text: . At lower temperatures, feeding cicadas would normally need to excrete the excess water. By evaporative cooling, desert cicadas can reduce their bodily temperature by some 5 °C.
            - superscript [ref=e797]:
              - link "[32]" [ref=e798] [cursor=pointer]:
                - /url: "#cite_note-35"
            - superscript [ref=e799]:
              - link "[33]" [ref=e800] [cursor=pointer]:
                - /url: "#cite_note-36"
            - text: Some non-desert cicada species such as Magicicada tredecem also cool themselves evaporatively, but less dramatically.
            - superscript [ref=e801]:
              - link "[34]" [ref=e802] [cursor=pointer]:
                - /url: "#cite_note-37"
            - text: Conversely, many other cicadas can voluntarily raise their body temperatures as much as 22 °C (40 °F) above ambient temperature.
            - superscript [ref=e803]:
              - link "[35]" [ref=e804] [cursor=pointer]:
                - /url: "#cite_note-Sanborn_et_al_2003-38"
          - generic [ref=e805]:
            - heading "Song" [level=3] [ref=e806]
            - generic [ref=e807]:
              - text: "["
              - link "edit" [ref=e808] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=7
              - text: "]"
          - 'figure "Cicada sound-producing organs and musculature: a, Body of male from below, showing cover-plates; b, From above, showing drumlike tymbals; c, Section, muscles that vibrate tymbals; d, A tymbal at rest; e, Thrown into vibration, as when singing" [ref=e809]':
            - link [ref=e810] [cursor=pointer]:
              - /url: /wiki/File:EB1911_cicada_tymbal_structure.png
              - img [ref=e811]
            - generic [ref=e812]:
              - text: "Cicada sound-producing organs and musculature:"
              - text: a, Body of male from below, showing cover-plates;
              - text: b, From above, showing drumlike
              - link "tymbals" [ref=e813] [cursor=pointer]:
                - /url: /wiki/Tymbal
              - text: ;
              - text: c, Section,
              - link "muscles" [ref=e814] [cursor=pointer]:
                - /url: /wiki/Muscle
              - text: that vibrate tymbals;
              - text: d, A tymbal at rest;
              - text: e, Thrown into vibration, as when singing
          - paragraph [ref=e815]:
            - text: The "singing" of male cicadas is produced principally and in the majority of species using a special structure called a
            - link "tymbal" [ref=e816] [cursor=pointer]:
              - /url: /wiki/Tymbal
            - text: ", a pair of which lies below each side of the"
            - link "anterior" [ref=e817] [cursor=pointer]:
              - /url: /wiki/Anatomical_terms_of_location
            - link "abdominal" [ref=e818] [cursor=pointer]:
              - /url: /wiki/Abdomen
            - text: region. The structure is buckled by muscular action and, being made of
            - link "resilin" [ref=e819] [cursor=pointer]:
              - /url: /wiki/Resilin
            - text: ", unbuckles rapidly on muscle relaxation, producing their characteristic sounds. Some cicadas, however, have mechanisms for"
            - link "stridulation" [ref=e820] [cursor=pointer]:
              - /url: /wiki/Stridulation
            - text: ", sometimes in addition to the tymbals. Here, the wings are rubbed over a series of midthoracic ridges. In the Chinese species"
            - link "Subpsaltria yangi" [ref=e822] [cursor=pointer]:
              - /url: /w/index.php?title=Subpsaltria_yangi&action=edit&redlink=1
            - text: ", both males and females can stridulate."
            - superscript [ref=e823]:
              - link "[36]" [ref=e824] [cursor=pointer]:
                - /url: "#cite_note-39"
            - text: The sounds may further be modulated by membranous coverings and by resonant cavities.
            - superscript [ref=e825]:
              - link "[26]" [ref=e826] [cursor=pointer]:
                - /url: "#cite_note-Cuvier-29"
          - paragraph [ref=e827]:
            - text: The male abdomen in some species is largely hollow, and acts as a
            - link "sound box" [ref=e828] [cursor=pointer]:
              - /url: /wiki/Sound_box
            - text: . By rapidly vibrating these membranes, a cicada combines the clicks into apparently continuous notes, and enlarged chambers derived from the
            - link "tracheae" [ref=e829] [cursor=pointer]:
              - /url: /wiki/Invertebrate_trachea
            - text: serve as
            - link "resonating chambers" [ref=e830] [cursor=pointer]:
              - /url: /wiki/Resonating_device
            - text: with which it amplifies the sound. The cicada also modulates the song by positioning its abdomen toward or away from the
            - link "substrate" [ref=e831] [cursor=pointer]:
              - /url: /wiki/Substrate_(biology)
            - text: (their perch). Partly by the pattern in which it combines the clicks, each species produces its own distinctive mating songs and acoustic signals, ensuring that the song attracts only appropriate mates.
            - superscript [ref=e832]:
              - link "[16]" [ref=e833] [cursor=pointer]:
                - /url: "#cite_note-Milne-19"
            - text: The
            - link "tettigarctid (or hairy) cicadas" [ref=e834] [cursor=pointer]:
              - /url: /wiki/Tettigarctidae
            - text: have rudimentary tymbals in both sexes and do not produce airborne sounds, rather, both males and females produce vibrations that are transmitted through the tree they perch upon. They are considered as representing the
            - link "original state" [ref=e835] [cursor=pointer]:
              - /url: /wiki/Primitive_(phylogenetics)
            - text: from which other cicada communication has evolved.
            - superscript [ref=e836]:
              - link "[37]" [ref=e837] [cursor=pointer]:
                - /url: "#cite_note-40"
          - generic [ref=e838]:
            - generic [ref=e839]:
              - figure [ref=e841]
              - generic [ref=e843]:
                - generic [ref=e844]:
                  - link "Amphipsalta zelandica cicada song" [ref=e846] [cursor=pointer]:
