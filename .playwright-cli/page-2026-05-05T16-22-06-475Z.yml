          - paragraph [ref=e392]:
            - text: The cicadas (
            - link /sɪˈkɑːdəz, -ˈkeɪ-/ [ref=e395] [cursor=pointer]:
              - /url: /wiki/Help:IPA/English
              - text: /
              - generic [ref=e396]: sɪˈkɑːdəz
              - text: ", -"
              - generic [ref=e397]: ˈkeɪ
              - text: "-/"
            - text: ) are a superfamily, the Cicadoidea, of
            - link "insects" [ref=e398] [cursor=pointer]:
              - /url: /wiki/Insect
            - text: in the order
            - link "Hemiptera" [ref=e399] [cursor=pointer]:
              - /url: /wiki/Hemiptera
            - text: (true bugs). They are in the suborder
            - link "Auchenorrhyncha" [ref=e400] [cursor=pointer]:
              - /url: /wiki/Auchenorrhyncha
            - text: ","
            - superscript [ref=e401]:
              - link "[a]" [ref=e402] [cursor=pointer]:
                - /url: "#cite_note-1"
            - text: along with smaller jumping bugs such as
            - link "leafhoppers" [ref=e403] [cursor=pointer]:
              - /url: /wiki/Leafhopper
            - text: and
            - link "froghoppers" [ref=e404] [cursor=pointer]:
              - /url: /wiki/Froghopper
            - text: . The superfamily is divided into two families, the
            - link "Tettigarctidae" [ref=e405] [cursor=pointer]:
              - /url: /wiki/Tettigarctidae
            - text: ", with two species in Australia, and the"
            - link "Cicadidae" [ref=e406] [cursor=pointer]:
              - /url: /wiki/Cicadidae
            - text: ", with more than 3,000 species"
            - link "described" [ref=e407] [cursor=pointer]:
              - /url: /wiki/Taxonomy_(biology)#Taxonomic_descriptions
            - text: from around the world; many species remain
            - link "undescribed" [ref=e408] [cursor=pointer]:
              - /url: /wiki/Undescribed_taxon
            - text: . Nearly all cicada species are
            - link "annual cicadas" [ref=e409] [cursor=pointer]:
              - /url: /wiki/Annual_cicada
            - text: with the exception of the few North American
            - link "periodical cicada" [ref=e410] [cursor=pointer]:
              - /url: /wiki/Periodical_cicada
            - text: species, genus
            - link "Magicicada" [ref=e412] [cursor=pointer]:
              - /url: /wiki/Magicicada
            - text: ", which in a given region emerge en masse every 13 or 17 years."
          - paragraph [ref=e413]:
            - text: Cicadas have prominent eyes set wide apart, short antennae, and membranous front wings. They have an exceptionally loud song, produced in most species by the rapid buckling and unbuckling of drum-like
            - link "tymbals" [ref=e414] [cursor=pointer]:
              - /url: /wiki/Tymbal
            - text: . The earliest known fossil Cicadomorpha appeared in the
            - link "Upper Permian" [ref=e415] [cursor=pointer]:
              - /url: /wiki/Upper_Permian
            - text: period; extant species occur all around the world in temperate to tropical climates. They typically live in trees, feeding on watery sap from
            - link "xylem" [ref=e416] [cursor=pointer]:
              - /url: /wiki/Xylem
            - text: tissue, and laying their eggs in a slit in the bark. Most cicadas are
            - link "cryptic" [ref=e417] [cursor=pointer]:
              - /url: /wiki/Crypsis
            - text: . The vast majority of species are active during the day as adults, with some calling at dawn or dusk. Only a rare few species are known to be nocturnal.
          - paragraph [ref=e418]:
            - text: One exclusively North American genus, Magicicada (the
            - link "periodical cicadas" [ref=e419] [cursor=pointer]:
              - /url: /wiki/Periodical_cicadas
            - text: ), which spend most of their lives as underground nymphs, emerge in predictable intervals of 13 or 17 years, depending on the species and the location. The unusual timing and synchronization of their emergence may reduce cicada losses to
            - link "predation" [ref=e420] [cursor=pointer]:
              - /url: /wiki/Predation
            - text: by making them less reliable prey and by overwhelming predators with sheer numbers before significant losses occur.
            - superscript [ref=e421]:
              - link "[1]" [ref=e422] [cursor=pointer]:
                - /url: "#cite_note-2"
          - paragraph [ref=e423]:
            - text: The
            - link "annual cicadas" [ref=e424] [cursor=pointer]:
              - /url: /wiki/Annual_cicada
            - text: are species that emerge every year. Though these cicadas' life cycles can vary from one to nine or more years as underground nymphs, their emergence above ground as adults is not synchronized, so some members of each species appear every year.
            - superscript [ref=e425]:
              - link "[2]" [ref=e426] [cursor=pointer]:
                - /url: "#cite_note-3"
          - paragraph [ref=e427]:
            - text: Cicadas have been featured in literature since the time of
            - link "Homer" [ref=e428] [cursor=pointer]:
              - /url: /wiki/Homer
            - text: "'s"
            - link "Iliad" [ref=e430] [cursor=pointer]:
              - /url: /wiki/Iliad
            - text: and as motifs in art from the Chinese
            - link "Shang dynasty" [ref=e431] [cursor=pointer]:
              - /url: /wiki/Shang_dynasty
            - text: .
            - superscript [ref=e432]:
              - link "[3]" [ref=e433] [cursor=pointer]:
                - /url: "#cite_note-4"
            - text: They have also been used in myth and folklore as symbols of carefree living and immortality. The cicada is also mentioned in
            - link "Hesiod" [ref=e434] [cursor=pointer]:
              - /url: /wiki/Hesiod
            - text: "'s"
            - link "Shield" [ref=e436] [cursor=pointer]:
              - /url: /wiki/Shield_of_Heracles
            - text: (ll. 393–394), in which it is said to sing when millet first ripens. Cicadas are eaten by humans in various parts of the world, including
            - link "China" [ref=e437] [cursor=pointer]:
              - /url: /wiki/China
            - text: ","
            - link "Myanmar" [ref=e438] [cursor=pointer]:
              - /url: /wiki/Myanmar
            - text: ","
            - link "Malaysia" [ref=e439] [cursor=pointer]:
              - /url: /wiki/Malaysia
            - text: ", central"
            - link "Africa" [ref=e440] [cursor=pointer]:
              - /url: /wiki/Africa
            - text: and parts of
            - link "Mexico" [ref=e441] [cursor=pointer]:
              - /url: /wiki/Mexico
            - text: .
            - superscript [ref=e442]:
              - link "[4]" [ref=e443] [cursor=pointer]:
                - /url: "#cite_note-5"
          - generic [ref=e444]:
            - heading "Etymology" [level=2] [ref=e445]
            - generic [ref=e446]:
              - text: "["
              - link "edit" [ref=e447] [cursor=pointer]:
