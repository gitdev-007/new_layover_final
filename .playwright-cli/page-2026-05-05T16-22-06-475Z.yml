              - text: Look up
              - link "cicada" [ref=e457] [cursor=pointer]:
                - /url: https://en.wiktionary.org/wiki/Special:Search/cicada
              - text: in Wiktionary, the free dictionary.
          - paragraph [ref=e458]:
            - text: The name is directly from the
            - link "onomatopoeic" [ref=e459] [cursor=pointer]:
              - /url: /wiki/Onomatopoeia
            - link "Latin" [ref=e460] [cursor=pointer]:
              - /url: /wiki/Latin
            - text: cicada.
            - superscript [ref=e461]:
              - link "[5]" [ref=e462] [cursor=pointer]:
                - /url: "#cite_note-6"
            - superscript [ref=e463]:
              - link "[6]" [ref=e464] [cursor=pointer]:
                - /url: "#cite_note-7"
            - superscript [ref=e465]:
              - link "[b]" [ref=e466] [cursor=pointer]:
