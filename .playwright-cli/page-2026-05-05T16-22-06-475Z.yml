              - generic [ref=e900]:
                - text: Problems playing these files? See
                - link "media help" [ref=e901] [cursor=pointer]:
                  - /url: /wiki/Help:Media
                - text: .
          - paragraph [ref=e902]:
            - text: Average temperature of the natural habitat for the South American species
            - link "Fidicina rana" [ref=e904] [cursor=pointer]:
              - /url: /wiki/Fidicinini
            - text: is about 29 °C (84 °F). During sound production, the temperature of the tymbal muscles was found to be significantly higher.
            - superscript [ref=e905]:
              - link "[38]" [ref=e906] [cursor=pointer]:
                - /url: "#cite_note-41"
            - text: Many cicadas sing most actively during the hottest hours of a summer day; roughly a
            - link "24-hour cycle" [ref=e907] [cursor=pointer]:
              - /url: /wiki/Circadian_rhythm
            - text: .
            - superscript [ref=e908]:
              - link "[39]" [ref=e909] [cursor=pointer]:
                - /url: "#cite_note-42"
            - text: Most cicadas are diurnal in their calling and
            - link "depend on external heat" [ref=e910] [cursor=pointer]:
              - /url: /wiki/Poikilotherm
            - text: to warm them up, while a few are capable of raising their temperatures using muscle action and some species are known to call at dusk.
            - superscript [ref=e911]:
              - link "[35]" [ref=e912] [cursor=pointer]:
                - /url: "#cite_note-Sanborn_et_al_2003-38"
            - link "Kanakia gigas" [ref=e914] [cursor=pointer]:
              - /url: /wiki/Kanakia_(cicada)
            - text: and
            - link "Froggattoides typicus" [ref=e916] [cursor=pointer]:
              - /url: /wiki/Froggattoides_typicus
            - text: are among the few that are known to be truly nocturnal and there may be other nocturnal species living in tropical forests.
            - superscript [ref=e917]:
              - link "[40]" [ref=e918] [cursor=pointer]:
                - /url: "#cite_note-43"
            - superscript [ref=e919]:
              - link "[41]" [ref=e920] [cursor=pointer]:
                - /url: "#cite_note-44"
          - paragraph [ref=e921]:
            - text: Cicadas call from varying heights on trees. Where multiple species occur, the species may use different heights and timing of calling.
            - superscript [ref=e922]:
              - link "[42]" [ref=e923] [cursor=pointer]:
                - /url: "#cite_note-45"
            - superscript [ref=e924]:
              - link "[43]" [ref=e925] [cursor=pointer]:
                - /url: "#cite_note-46"
            - text: While the vast majority of cicadas call from above the ground, two Californian species,
            - link "Okanagana pallidula" [ref=e927] [cursor=pointer]:
              - /url: /wiki/Okanagana
            - text: and
            - link "O. vanduzeei" [ref=e929] [cursor=pointer]:
              - /url: /wiki/Okanagana_vanduzeei
            - text: are known to call from hollows made at the base of the tree below the ground level. The adaptive significance is unclear, as the calls are not amplified or modified by the
            - link "burrow" [ref=e930] [cursor=pointer]:
              - /url: /wiki/Burrow
            - text: structure, but this may avoid
            - link "predation" [ref=e931] [cursor=pointer]:
              - /url: /wiki/Predation
            - text: .
            - superscript [ref=e932]:
              - link "[44]" [ref=e933] [cursor=pointer]:
                - /url: "#cite_note-47"
          - paragraph [ref=e934]:
            - text: Although only males produce the cicadas' distinctive sounds, both sexes have membranous structures called
            - link "tympana" [ref=e935] [cursor=pointer]:
              - /url: /wiki/Tympanal_organ
            - text: (singular – tympanum) by which they detect sounds, the equivalent of having ears. Males disable their own tympana while calling, thereby preventing damage to their hearing; a necessity partly because some cicadas produce sounds up to 120
            - link "dB (SPL)" [ref=e936] [cursor=pointer]:
              - /url: /wiki/Sound#Sound_Pressure_Level
            - superscript [ref=e937]:
              - link "[45]" [ref=e938] [cursor=pointer]:
                - /url: "#cite_note-5050.co.za-48"
            - text: which is among the loudest of all insect-produced sounds.
            - superscript [ref=e939]:
              - link "[46]" [ref=e940] [cursor=pointer]:
                - /url: "#cite_note-49"
            - text: The song is loud enough to cause permanent
            - link "hearing loss" [ref=e941] [cursor=pointer]:
              - /url: /wiki/Hearing_loss
            - text: in humans should the cicada be at "close range". In contrast, some small species have songs so high in pitch that they are inaudible to humans.
            - superscript [ref=e942]:
              - link "[47]" [ref=e943] [cursor=pointer]:
                - /url: "#cite_note-insecteducation-50"
          - paragraph [ref=e944]:
            - text: For the human ear, telling precisely where a cicada song originates is often difficult. The pitch is nearly constant, the sound is continuous to the human ear, and cicadas sing in scattered groups. In addition to the mating song, many species have a distinct distress call, usually a broken and erratic sound emitted by the insect when seized or panicked. Some species also have courtship songs, generally quieter, and produced after a female has been drawn to the calling song. Males also produce encounter calls, whether in courtship or to maintain personal space within choruses.
            - superscript [ref=e945]:
              - link "[48]" [ref=e946] [cursor=pointer]:
                - /url: "#cite_note-51"
          - paragraph [ref=e947]:
            - text: The songs of cicadas are considered by entomologists to be unique to a given species, and a number of resources exist to collect and analyse cicada sounds.
            - superscript [ref=e948]:
              - link "[49]" [ref=e949] [cursor=pointer]:
                - /url: "#cite_note-52"
          - generic [ref=e950]:
            - heading "Life cycle" [level=3] [ref=e951]
            - generic [ref=e952]:
              - text: "["
              - link "edit" [ref=e953] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=8
              - text: "]"
          - paragraph [ref=e954]:
            - text: In some species of cicadas, the males remain in one location and call to attract females. Sometimes, several males aggregate and call in chorus. In other species, the males move from place to place, usually with quieter calls, while searching for females. The Tettigarctidae differ from other cicadas in producing vibrations in the
            - link "substrate" [ref=e955] [cursor=pointer]:
              - /url: /wiki/Substrate_(biology)
            - text: rather than audible sounds. After mating, the female cuts slits into the bark of a twig where she deposits her eggs.
            - superscript [ref=e956]:
              - link "[11]" [ref=e957] [cursor=pointer]:
                - /url: "#cite_note-Resh-13"
            - text: Both male and female cicadas die within a few weeks after emerging from the soil. Although they have mouthparts and are able to consume some plant liquids for nutrition, the amount eaten is very small and the insects have a natural adult lifespan of less than two months.
          - paragraph [ref=e958]:
            - text: When the eggs hatch, the newly hatched
            - link "nymphs" [ref=e959] [cursor=pointer]:
              - /url: /wiki/Nymph_(biology)
            - text: drop to the ground and burrow. Cicadas live underground as nymphs for most of their lives at depths of about 6–24 in (15–61 cm). Nymphs have strong front legs for digging and excavating chambers near to roots, where they feed on
            - link "xylem" [ref=e960] [cursor=pointer]:
              - /url: /wiki/Xylem
            - text: sap. In the process, their bodies and interior of the burrow become coated in anal fluids. In wet habitats, larger species construct mud towers above ground to aerate their burrows. In the final nymphal
            - link "instar" [ref=e961] [cursor=pointer]:
              - /url: /wiki/Instar
            - text: ", they construct an exit tunnel to the surface and emerge."
            - superscript [ref=e962]:
              - link "[11]" [ref=e963] [cursor=pointer]:
                - /url: "#cite_note-Resh-13"
            - text: They then
            - link "molt" [ref=e964] [cursor=pointer]:
              - /url: /wiki/Ecdysis
            - text: (shed their skins) on a nearby plant for the last time, and emerge as adults. The
            - link "exuviae" [ref=e965] [cursor=pointer]:
              - /url: /wiki/Exuviae
            - text: or abandoned exoskeletons remain, still clinging to the bark of the tree.
            - superscript [ref=e966]:
              - link "[50]" [ref=e967] [cursor=pointer]:
                - /url: "#cite_note-Grimaldi-53"
          - paragraph [ref=e968]:
            - text: Most cicadas go through a life cycle that lasts 2–5 years. Some species have much longer life cycles, such as the North American genus,
            - link "Magicicada" [ref=e970] [cursor=pointer]:
              - /url: /wiki/Magicicada
            - text: ", which has a number of distinct \"broods\" that go through either a 17-year (Brood XIII), or in some parts of the region, a 13-year (Brood XIX) life cycle"
            - superscript [ref=e971]:
              - link "[51]" [ref=e972] [cursor=pointer]:
                - /url: "#cite_note-milman-54"
            - text: The long life cycles may have developed as a response to
            - link "predators" [ref=e973] [cursor=pointer]:
              - /url: /wiki/Predation
            - text: ", such as the"
            - link "cicada killer wasp" [ref=e974] [cursor=pointer]:
              - /url: /wiki/Sphecius
            - text: and
            - link "praying mantis" [ref=e975] [cursor=pointer]:
              - /url: /wiki/Mantis
            - text: .
            - superscript [ref=e976]:
              - link "[52]" [ref=e977] [cursor=pointer]:
                - /url: "#cite_note-55"
            - superscript [ref=e978]:
              - link "[53]" [ref=e979] [cursor=pointer]:
                - /url: "#cite_note-56"
            - superscript [ref=e980]:
              - link "[54]" [ref=e981] [cursor=pointer]:
                - /url: "#cite_note-57"
            - text: A specialist predator with a shorter life cycle of at least two years could not reliably prey upon the cicadas;
            - superscript [ref=e982]:
              - link "[55]" [ref=e983] [cursor=pointer]:
                - /url: "#cite_note-58"
            - text: for example, a 17-year cicada with a predator with a five-year life cycle will only be threatened by a peak predator population every 85 (5 × 17) years, while a non-prime cycle such as 15 would be endangered at every year of emergence.
            - superscript [ref=e984]:
              - link "[56]" [ref=e985] [cursor=pointer]:
                - /url: "#cite_note-dijusto-59"
            - text: An alternate hypothesis is that these long life cycles evolved during the ice ages so as to overcome cold spells, and that as species co-emerged and hybridized, they left distinct species that did not hybridize having periods matching
            - link "prime numbers" [ref=e986] [cursor=pointer]:
              - /url: /wiki/Prime_number
            - text: .
            - superscript [ref=e987]:
              - link "[57]" [ref=e988] [cursor=pointer]:
                - /url: "#cite_note-60"
            - text: The 13- and 17-year cicadas only emerge in the midwestern and eastern US in the same year every 221 years (13 × 17), with 2024 being the first such year since 1803.
            - superscript [ref=e989]:
              - link "[51]" [ref=e990] [cursor=pointer]:
                - /url: "#cite_note-milman-54"
          - list [ref=e991]:
            - listitem [ref=e992]:
              - link "A teneral cicada that has just emerged and is waiting to dry before flying away" [ref=e995] [cursor=pointer]:
                - /url: /wiki/File:Emerging_cicada.jpg
                - img "A teneral cicada that has just emerged and is waiting to dry before flying away" [ref=e996]
              - generic [ref=e997]: A teneral cicada that has just emerged and is waiting to dry before flying away
            - listitem [ref=e998]:
              - link "Newly emerged adult cicada held on human fingers" [ref=e1001] [cursor=pointer]:
                - /url: /wiki/File:Cicada_Close-Up.jpg
                - img "Newly emerged adult cicada held on human fingers" [ref=e1002]
              - generic [ref=e1003]: Newly emerged adult cicada held on human fingers
            - listitem [ref=e1004]:
              - link "Cicada exuviae after the adult cicada has left" [ref=e1007] [cursor=pointer]:
                - /url: /wiki/File:Cicada_skin.jpg
                - img "Cicada exuviae after the adult cicada has left" [ref=e1008]
              - generic [ref=e1009]: Cicada exuviae after the adult cicada has left
            - listitem [ref=e1010]:
              - link "An empty cicada skin captured in June 2024 in Rab Croatia" [ref=e1013] [cursor=pointer]:
                - /url: /wiki/File:Cicada_exuviae_clinging_to_a_leaf.jpg
                - img "An empty cicada skin captured in June 2024 in Rab Croatia" [ref=e1014]
              - generic [ref=e1015]: Cicada exuviae clinging to a leaf
          - generic [ref=e1016]:
            - heading "Diet" [level=3] [ref=e1017]
            - generic [ref=e1018]:
              - text: "["
              - link "edit" [ref=e1019] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=9
              - text: "]"
          - paragraph [ref=e1020]:
            - text: Cicada nymphs drink sap from the xylem of various species of trees, including
            - link "oak" [ref=e1021] [cursor=pointer]:
              - /url: /wiki/Oak
            - text: ","
            - link "cypress" [ref=e1022] [cursor=pointer]:
              - /url: /wiki/Cypress
            - text: ","
            - link "willow" [ref=e1023] [cursor=pointer]:
              - /url: /wiki/Willow
            - text: ","
            - link "ash" [ref=e1024] [cursor=pointer]:
              - /url: /wiki/Fraxinus
            - text: ", and"
            - link "maple" [ref=e1025] [cursor=pointer]:
              - /url: /wiki/Maple
            - text: . While common folklore indicates that adults do not eat, they actually do drink plant sap using their sucking mouthparts.
            - superscript [ref=e1026]:
              - link "[58]" [ref=e1027] [cursor=pointer]:
                - /url: "#cite_note-61"
            - superscript [ref=e1028]:
              - link "[59]" [ref=e1029] [cursor=pointer]:
                - /url: "#cite_note-62"
          - paragraph [ref=e1030]:
            - text: Cicadas excrete fluid in streams of droplets due to their high volume consumption of xylem sap.
            - superscript [ref=e1031]:
              - link "[60]" [ref=e1032] [cursor=pointer]:
                - /url: "#cite_note-63"
            - text: The jets of urine that cicadas produce have a velocity of up to 3 meters per second, making them the fastest among all assessed animals, including mammals like elephants and horses.
            - superscript [ref=e1033]:
              - link "[61]" [ref=e1034] [cursor=pointer]:
                - /url: "#cite_note-64"
            - superscript [ref=e1035]:
              - link "[62]" [ref=e1036] [cursor=pointer]:
                - /url: "#cite_note-65"
          - generic [ref=e1037]:
            - heading "Locomotion" [level=3] [ref=e1038]
            - generic [ref=e1039]:
              - text: "["
              - link "edit" [ref=e1040] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=10
              - text: "]"
          - note [ref=e1041]:
            - text: "Further information:"
            - link "Animal locomotion" [ref=e1042] [cursor=pointer]:
              - /url: /wiki/Animal_locomotion
            - text: and
            - link "Jumping" [ref=e1043] [cursor=pointer]:
              - /url: /wiki/Jumping
          - paragraph [ref=e1044]:
            - text: Cicadas, unlike other Auchenorrhyncha, are not adapted for jumping (saltation).
            - superscript [ref=e1045]:
              - link "[63]" [ref=e1046] [cursor=pointer]:
                - /url: "#cite_note-66"
            - text: They have the usual insect modes of
            - link "locomotion" [ref=e1047] [cursor=pointer]:
              - /url: /wiki/Animal_locomotion
            - text: ", walking and flight, but they do not walk or run well, and take to the wing to travel distances greater than a few centimetres."
            - superscript [ref=e1048]:
              - link "[11]" [ref=e1049] [cursor=pointer]:
                - /url: "#cite_note-Resh-13"
          - generic [ref=e1050]:
            - heading "Predators, parasites, and pathogens" [level=2] [ref=e1051]: Predators, parasites, and pathogens
            - generic [ref=e1052]:
              - text: "["
              - link "edit" [ref=e1053] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=11
              - text: "]"
          - figure "Eastern cicada killer wasp (Sphecius speciosus) with cicada prey, United States" [ref=e1054]:
            - link [ref=e1055] [cursor=pointer]:
              - /url: /wiki/File:Eastern_cicada_killer_wasp_(Sphecius_speciosus)_with_Cicada.jpg
              - img [ref=e1056]
            - generic [ref=e1057]:
              - text: Eastern cicada killer wasp (
              - link "Sphecius speciosus" [ref=e1059] [cursor=pointer]:
                - /url: /wiki/Sphecius_speciosus
              - text: ) with cicada prey, United States
          - paragraph [ref=e1060]:
            - text: Cicadas are commonly eaten by birds and mammals,
            - superscript [ref=e1061]:
              - link "[64]" [ref=e1062] [cursor=pointer]:
                - /url: "#cite_note-67"
            - text: as well as
            - link "bats" [ref=e1063] [cursor=pointer]:
              - /url: /wiki/Bat
            - text: ","
            - link "wasps" [ref=e1064] [cursor=pointer]:
              - /url: /wiki/Wasp
            - text: ","
            - link "mantises" [ref=e1065] [cursor=pointer]:
              - /url: /wiki/Mantis
            - text: ","
            - link "spiders" [ref=e1066] [cursor=pointer]:
              - /url: /wiki/Spider
            - text: ", and"
            - link "robber flies" [ref=e1067] [cursor=pointer]:
              - /url: /wiki/Asilidae
            - text: . In times of mass emergence of cicadas, various amphibians, fish, reptiles, mammals, and birds change their foraging habits so as to benefit from the glut. Newly hatched nymphs may be eaten by ants, and nymphs living underground are preyed on by burrowing mammals such as moles.
            - superscript [ref=e1068]:
              - link "[28]" [ref=e1069] [cursor=pointer]:
                - /url: "#cite_note-Capinera-31"
            - text: In northern Japan, brown bears prey on final instar nymphs of cicadas during summer by digging up the ground.
            - superscript [ref=e1070]:
              - link "[65]" [ref=e1071] [cursor=pointer]:
                - /url: "#cite_note-:0-68"
            - text: In Australia, cicadas are preyed on by the Australian cicada killer wasp (
            - link "Exeirus lateritius" [ref=e1073] [cursor=pointer]:
              - /url: /wiki/Exeirus_lateritius
            - text: ), which stings and stuns cicadas high in the trees, making them drop to the ground, where the cicada hunter mounts and carries them, pushing with its hind legs, sometimes over a distance of 100 m, until they can be shoved down into its burrow, where the numb cicadas are placed onto one of many shelves in a "catacomb", to form the food stock for the wasp grub that grows out of the egg deposited there.
            - superscript [ref=e1074]:
              - link "[66]" [ref=e1075] [cursor=pointer]:
                - /url: "#cite_note-69"
            - text: A
            - link "katydid" [ref=e1076] [cursor=pointer]:
              - /url: /wiki/Tettigoniidae
            - text: predator from Australia is capable of attracting singing male cicadas of a variety of species by imitating the timed click replies of sexually receptive female cicadas, which respond in pair formation by flicking their wings.
            - superscript [ref=e1077]:
              - link "[67]" [ref=e1078] [cursor=pointer]:
                - /url: "#cite_note-70"
            - text: Their prime-number life cycle prevents predators with a life cycle of two or more years from synchronising with their emergence.
            - superscript [ref=e1079]:
              - link "[56]" [ref=e1080] [cursor=pointer]:
                - /url: "#cite_note-dijusto-59"
          - paragraph [ref=e1081]:
            - text: Several fungal diseases infect and kill adult cicadas, while other
            - link "fungi" [ref=e1082] [cursor=pointer]:
              - /url: /wiki/Entomopathogenic_fungus
            - text: in the genera
            - link "Ophiocordyceps" [ref=e1084] [cursor=pointer]:
              - /url: /wiki/Ophiocordyceps
            - text: and
            - link "Isaria" [ref=e1086] [cursor=pointer]:
              - /url: /wiki/Isaria
            - text: attack nymphs.
            - superscript [ref=e1087]:
              - link "[28]" [ref=e1088] [cursor=pointer]:
                - /url: "#cite_note-Capinera-31"
            - link "Massospora cicadina" [ref=e1090] [cursor=pointer]:
              - /url: /wiki/Massospora_cicadina
            - text: specifically attacks the adults of periodical cicadas, the spores remaining dormant in the soil between outbreaks.
            - superscript [ref=e1091]:
              - link "[68]" [ref=e1092] [cursor=pointer]:
                - /url: "#cite_note-Massospora-71"
            - text: This fungus is also capable of dosing cicadas with
            - link "psilocybin" [ref=e1093] [cursor=pointer]:
              - /url: /wiki/Psilocybin
            - text: ", the"
            - link "psychedelic drug" [ref=e1094] [cursor=pointer]:
              - /url: /wiki/Psychedelic_drug
            - text: found in
            - link "magic mushrooms" [ref=e1095] [cursor=pointer]:
              - /url: /wiki/Magic_mushrooms
            - text: ", as well as"
            - link "cathinone" [ref=e1096] [cursor=pointer]:
              - /url: /wiki/Cathinone
            - text: ", an"
            - link "alkaloid" [ref=e1097] [cursor=pointer]:
              - /url: /wiki/Alkaloid
            - text: similar to various
            - link "amphetamines" [ref=e1098] [cursor=pointer]:
              - /url: /wiki/Amphetamines
            - text: . These chemicals alter the behaviour of the cicadas, driving males to copulate, including attempts with males, and is thought to be beneficial to the fungus, as the fungal spores are dispersed by a larger number of infected carriers.
            - superscript [ref=e1099]:
              - link "[69]" [ref=e1100] [cursor=pointer]:
                - /url: "#cite_note-72"
          - paragraph [ref=e1101]:
            - text: Plants can also defend themselves against cicadas. Although cicadas can feed on the roots of gymnosperms, it has been found that resinous conifers such as pine do not allow the eggs of Magicicada to hatch, the resin sealing up the egg cavities.
            - superscript [ref=e1102]:
              - link "[70]" [ref=e1103] [cursor=pointer]:
                - /url: "#cite_note-73"
            - superscript [ref=e1104]:
              - link "[71]" [ref=e1105] [cursor=pointer]:
                - /url: "#cite_note-74"
          - generic [ref=e1106]:
            - heading "Antipredator adaptations" [level=3] [ref=e1107]
            - generic [ref=e1108]:
              - text: "["
              - link "edit" [ref=e1109] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=12
              - text: "]"
          - note [ref=e1110]:
            - text: "Further information:"
            - link "Antipredator adaptation" [ref=e1111] [cursor=pointer]:
              - /url: /wiki/Antipredator_adaptation
            - text: and
            - link "Periodical cicada" [ref=e1112] [cursor=pointer]:
              - /url: /wiki/Periodical_cicada
          - figure "Cicada disruptively camouflaged on an olive tree" [ref=e1113]:
            - link [ref=e1114] [cursor=pointer]:
              - /url: /wiki/File:Cicada_camouflaged_on_an_olive_tree.jpg
              - img [ref=e1115]
            - generic [ref=e1116]:
              - text: Cicada
              - link "disruptively camouflaged" [ref=e1117] [cursor=pointer]:
                - /url: /wiki/Disruptive_coloration
              - text: on an olive tree
          - paragraph [ref=e1118]:
            - text: Cicadas use a variety of strategies to evade predators. Large cicadas can fly rapidly to escape if disturbed.
            - superscript [ref=e1119]:
              - link "[72]" [ref=e1120] [cursor=pointer]:
                - /url: "#cite_note-WashPost-75"
            - text: Many are extremely well
            - link "camouflaged" [ref=e1121] [cursor=pointer]:
              - /url: /wiki/Camouflage
            - superscript [ref=e1122]:
              - link "[72]" [ref=e1123] [cursor=pointer]:
                - /url: "#cite_note-WashPost-75"
            - superscript [ref=e1124]:
              - link "[73]" [ref=e1125] [cursor=pointer]:
                - /url: "#cite_note-76"
            - text: to evade predators such as birds that hunt by sight. Being coloured like tree bark and
            - link "disruptively patterned" [ref=e1126] [cursor=pointer]:
              - /url: /wiki/Disruptive_coloration
            - text: to break up their outlines, they are difficult to discern;
            - superscript [ref=e1127]:
              - link "[74]" [ref=e1128] [cursor=pointer]:
                - /url: "#cite_note-77"
            - text: their partly transparent wings are held over the body and pressed close to the substrate. Some cicada species
            - link "play dead" [ref=e1129] [cursor=pointer]:
              - /url: /wiki/Thanatosis
            - text: when threatened.
            - superscript [ref=e1130]:
              - link "[75]" [ref=e1131] [cursor=pointer]:
                - /url: "#cite_note-78"
            - superscript [ref=e1132]:
              - link "[76]" [ref=e1133] [cursor=pointer]:
                - /url: "#cite_note-79"
          - figure "The day-flying cicada Huechys sanguinea warns off predators with its aposematic red and black coloration. (Southeast Asia)" [ref=e1134]:
            - link [ref=e1135] [cursor=pointer]:
              - /url: /wiki/File:Huechys_sanguinea_03.JPG
              - img [ref=e1136]
            - generic [ref=e1137]:
              - text: The day-flying cicada
              - link "Huechys sanguinea" [ref=e1139] [cursor=pointer]:
                - /url: /wiki/Huechys_sanguinea
              - text: warns off predators with its
              - link "aposematic" [ref=e1140] [cursor=pointer]:
                - /url: /wiki/Aposematic
              - text: red and black coloration. (Southeast Asia)
          - paragraph [ref=e1141]:
            - text: Some cicadas such as
            - link "Hemisciera maculipennis" [ref=e1143] [cursor=pointer]:
              - /url: /w/index.php?title=Hemisciera_maculipennis&action=edit&redlink=1
            - text: display bright
            - link "deimatic" [ref=e1144] [cursor=pointer]:
              - /url: /wiki/Deimatic
            - text: flash coloration on their hind wings when threatened; the sudden contrast helps to startle predators, giving the cicadas time to escape.
            - superscript [ref=e1145]:
              - link "[77]" [ref=e1146] [cursor=pointer]:
                - /url: "#cite_note-80"
            - text: Most cicadas are
            - link "diurnal" [ref=e1147] [cursor=pointer]:
              - /url: /wiki/Diurnality
            - text: and rely on camouflage when at rest, but some species use
            - link "aposematism" [ref=e1148] [cursor=pointer]:
              - /url: /wiki/Aposematism
            - text: "-related"
            - link "Batesian mimicry" [ref=e1149] [cursor=pointer]:
              - /url: /wiki/Batesian_mimicry
            - text: ", wearing the bright colors that warn of toxicity in other animals; the Malaysian"
            - link "Huechys sanguinea" [ref=e1151] [cursor=pointer]:
              - /url: /wiki/Huechys_sanguinea
            - text: has conspicuous red and black warning coloration, is diurnal, and boldly flies about in full view of possible predators.
            - superscript [ref=e1152]:
              - link "[78]" [ref=e1153] [cursor=pointer]:
                - /url: "#cite_note-81"
          - paragraph [ref=e1154]:
            - text: Predators such as the
            - link "sarcophagid" [ref=e1155] [cursor=pointer]:
              - /url: /wiki/Sarcophagidae
            - text: fly
            - link "Emblemasoma" [ref=e1157] [cursor=pointer]:
              - /url: /w/index.php?title=Emblemasoma&action=edit&redlink=1
            - text: hunt cicadas by sound, being attracted to their songs.
            - superscript [ref=e1158]:
              - link "[79]" [ref=e1159] [cursor=pointer]:
                - /url: "#cite_note-82"
            - text: Singing males soften their song so that the attention of the listener gets distracted to neighbouring louder singers, or cease singing altogether as a predator approaches. A loud cicada song, especially in chorus, has been asserted to repel predators, but observations of predator responses refute the claim.
            - superscript [ref=e1160]:
              - link "[80]" [ref=e1161] [cursor=pointer]:
                - /url: "#cite_note-WilliamsSimon-83"
          - generic [ref=e1162]:
            - heading "In human culture" [level=2] [ref=e1163]
            - generic [ref=e1164]:
              - text: "["
              - link "edit" [ref=e1165] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=13
              - text: "]"
          - note [ref=e1166]:
            - text: "Further information:"
            - link "Insects in culture" [ref=e1167] [cursor=pointer]:
              - /url: /wiki/Insects_in_culture
          - generic [ref=e1168]:
            - heading "In art and literature" [level=3] [ref=e1169]
            - generic [ref=e1170]:
              - text: "["
              - link "edit" [ref=e1171] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=14
              - text: "]"
          - 'figure "Silver casket with writing utensils, made by the Nuremberg goldsmith Wenzel Jamnitzer (1507/08–1585): a silver cicada is at lower left." [ref=e1172]':
            - link [ref=e1173] [cursor=pointer]:
              - /url: /wiki/File:Schreibzeug_(N%C3%BCrnberg).jpg
              - img [ref=e1174]
            - generic [ref=e1175]:
              - text: Silver casket with writing utensils, made by the
              - link "Nuremberg" [ref=e1176] [cursor=pointer]:
                - /url: /wiki/Nuremberg
              - text: goldsmith
              - link "Wenzel Jamnitzer" [ref=e1177] [cursor=pointer]:
                - /url: /wiki/Wenzel_Jamnitzer
              - text: "(1507/08–1585): a silver cicada is at lower left."
          - figure "Japanese snuff bottle in the form of a cicada, c. 1900" [ref=e1178]:
            - link [ref=e1179] [cursor=pointer]:
              - /url: /wiki/File:Japanese_snuff_bottle_in_the_form_of_a_cicada_01A.jpg
              - img [ref=e1180]
            - generic [ref=e1181]:
              - text: Japanese
              - link "snuff" [ref=e1182] [cursor=pointer]:
                - /url: /wiki/Snuff_(tobacco)
              - text: bottle in the form of a cicada, c. 1900
          - paragraph [ref=e1183]:
            - text: Cicadas have been featured in literature since the time of Homer's Iliad, and as motifs in decorative art from the Chinese Shang dynasty (1766–1122 BCE).
            - superscript [ref=e1184]:
              - link "[d]" [ref=e1185] [cursor=pointer]:
                - /url: "#cite_note-85"
            - text: They are described by
            - link "Aristotle" [ref=e1186] [cursor=pointer]:
              - /url: /wiki/Aristotle
            - text: in his
            - link "History of Animals" [ref=e1188] [cursor=pointer]:
              - /url: /wiki/History_of_Animals
            - text: and by
            - link "Pliny the Elder" [ref=e1189] [cursor=pointer]:
              - /url: /wiki/Pliny_the_Elder
            - text: in his
            - link "Natural History" [ref=e1191] [cursor=pointer]:
              - /url: /wiki/Natural_History_(Pliny)
            - text: ; their mechanism of sound production is mentioned by
            - link "Hesiod" [ref=e1192] [cursor=pointer]:
              - /url: /wiki/Hesiod
            - text: in his poem "
            - link "Works and Days" [ref=e1193] [cursor=pointer]:
              - /url: /wiki/Works_and_Days
            - text: "\": \"when the"
            - link "Skolymus" [ref=e1194] [cursor=pointer]:
              - /url: /wiki/Scolymus
            - text: flowers, and the tuneful Tettix sitting on his tree in the weary summer season pours forth from under his wings his shrill song".
            - superscript [ref=e1195]:
              - link "[82]" [ref=e1196] [cursor=pointer]:
                - /url: "#cite_note-86"
            - text: In the classic 14th-century Chinese novel
            - link "Romance of the Three Kingdoms" [ref=e1198] [cursor=pointer]:
              - /url: /wiki/Romance_of_the_Three_Kingdoms
            - text: ","
            - link "Diaochan" [ref=e1199] [cursor=pointer]:
              - /url: /wiki/Diaochan
            - text: took her name from the sable (diāo) tails and jade decorations in the shape of cicadas (chán), which adorned the hats of high-level officials.
          - paragraph [ref=e1200]:
            - text: In the Japanese novel
            - link "The Tale of Genji" [ref=e1202] [cursor=pointer]:
              - /url: /wiki/The_Tale_of_Genji
            - text: ", the title character poetically likens one of his many love interests to a cicada for the way she delicately sheds her robe the way a cicada sheds its shell when molting. Cicada exuviae play a role in the"
            - link "manga" [ref=e1203] [cursor=pointer]:
              - /url: /wiki/Manga
            - link "Winter Cicada" [ref=e1205] [cursor=pointer]:
              - /url: /wiki/Winter_Cicada
            - text: . Cicadas are a frequent subject of
            - link "haiku" [ref=e1207] [cursor=pointer]:
              - /url: /wiki/Haiku
            - text: ", where, depending on type, they can indicate spring, summer, or autumn."
            - superscript [ref=e1208]:
              - link "[83]" [ref=e1209] [cursor=pointer]:
                - /url: "#cite_note-haiku_semi-87"
            - link "Shaun Tan" [ref=e1210] [cursor=pointer]:
              - /url: /wiki/Shaun_Tan
            - text: "'s illustrated book Cicada tells the story of a hardworking but underappreciated cicada working in an office."
            - superscript [ref=e1211]:
              - link "[84]" [ref=e1212] [cursor=pointer]:
                - /url: "#cite_note-88"
            - link "Branden Jacobs-Jenkins" [ref=e1213] [cursor=pointer]:
              - /url: /wiki/Branden_Jacobs-Jenkins
            - text: "'s play"
            - link "Appropriate" [ref=e1215] [cursor=pointer]:
              - /url: /wiki/Appropriate_(play)
            - text: takes place on an Arkansas farm in summer, and calls for the sounds of mating cicadas to underscore the entire show.
            - superscript [ref=e1216]:
              - link "[85]" [ref=e1217] [cursor=pointer]:
                - /url: "#cite_note-89"
          - generic [ref=e1218]:
            - heading "In fashion" [level=3] [ref=e1219]
            - generic [ref=e1220]:
              - text: "["
              - link "edit" [ref=e1221] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=15
              - text: "]"
          - paragraph [ref=e1222]:
            - text: Being lightweight, and with hooklike legs, the
            - link "exuviae" [ref=e1223] [cursor=pointer]:
              - /url: /wiki/Exuviae
            - text: of cicadas can be used as hair or clothing accessories.
            - superscript [ref=e1224]:
              - link "[86]" [ref=e1225] [cursor=pointer]:
                - /url: "#cite_note-90"
          - generic [ref=e1226]:
            - heading "As food and folk medicine" [level=3] [ref=e1227]
            - generic [ref=e1228]:
              - text: "["
              - link "edit" [ref=e1229] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=16
              - text: "]"
          - figure "Deep-fried Cryptotympana atrata in Shandong cuisine" [ref=e1230]:
            - link [ref=e1231] [cursor=pointer]:
              - /url: /wiki/File:Deepfried_cicada.jpg
              - img [ref=e1232]
            - generic [ref=e1233]:
              - text: Deep-fried Cryptotympana atrata in
              - link "Shandong cuisine" [ref=e1234] [cursor=pointer]:
                - /url: /wiki/Shandong_cuisine
          - paragraph [ref=e1235]:
            - text: Cicadas were eaten in
            - link "Ancient Greece" [ref=e1236] [cursor=pointer]:
              - /url: /wiki/Ancient_Greece
            - text: ", and are consumed in selected regions in modern"
            - link "China" [ref=e1237] [cursor=pointer]:
              - /url: /wiki/China
            - text: ", both as adults and (more often) as nymphs."
            - superscript [ref=e1238]:
              - link "[87]" [ref=e1239] [cursor=pointer]:
                - /url: "#cite_note-Simoons1990-91"
            - text: Cicadas are also eaten in
            - link "Malaysia" [ref=e1240] [cursor=pointer]:
              - /url: /wiki/Malaysia
            - text: ","
            - link "Burma" [ref=e1241] [cursor=pointer]:
              - /url: /wiki/Burma
            - text: ", North America, and central Africa, as well as the"
            - link "Balochistan" [ref=e1242] [cursor=pointer]:
              - /url: /wiki/Balochistan,_Pakistan
            - text: region of
            - link "Pakistan" [ref=e1243] [cursor=pointer]:
              - /url: /wiki/Pakistan
            - text: ", especially in"
            - link "Ziarat" [ref=e1244] [cursor=pointer]:
              - /url: /wiki/Ziarat
            - text: .
            - superscript [ref=e1245]:
              - link "[88]" [ref=e1246] [cursor=pointer]:
                - /url: "#cite_note-92"
            - text: Female cicadas are prized for being meatier.
            - superscript [ref=e1247]:
              - link "[47]" [ref=e1248] [cursor=pointer]:
                - /url: "#cite_note-insecteducation-50"
            - text: Shells of cicadas are employed in
            - link "traditional Chinese medicines" [ref=e1249] [cursor=pointer]:
              - /url: /wiki/Traditional_Chinese_medicine
            - text: ","
            - superscript [ref=e1250]:
              - link "[89]" [ref=e1251] [cursor=pointer]:
                - /url: "#cite_note-93"
            - text: claiming that they possess anti-convulsive, sedative, and hypothermic effects.
            - superscript [ref=e1252]:
              - link "[90]" [ref=e1253] [cursor=pointer]:
                - /url: "#cite_note-94"
            - text: The 17-year "Onondaga Brood"
            - superscript [ref=e1254]:
              - link "[91]" [ref=e1255] [cursor=pointer]:
                - /url: "#cite_note-95"
            - text: Magicicada is culturally important and a particular delicacy to the
            - link "Onondaga people" [ref=e1256] [cursor=pointer]:
              - /url: /wiki/Onondaga_people
            - text: ","
            - superscript [ref=e1257]:
              - link "[92]" [ref=e1258] [cursor=pointer]:
                - /url: "#cite_note-96"
            - text: and are considered a novelty food item by modern consumers in several states.
            - superscript [ref=e1259]:
              - link "[93]" [ref=e1260] [cursor=pointer]:
                - /url: "#cite_note-97"
          - generic [ref=e1261]:
            - heading "In music" [level=3] [ref=e1262]
            - generic [ref=e1263]:
              - text: "["
              - link "edit" [ref=e1264] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=17
              - text: "]"
          - paragraph [ref=e1265]:
            - text: Cicadas are featured in the protest song "Como La Cigarra" ("Like the Cicada") written by Argentinian poet and composer
            - link "María Elena Walsh" [ref=e1266] [cursor=pointer]:
              - /url: /wiki/Mar%C3%ADa_Elena_Walsh
            - text: . In the song, the cicada is a symbol of survival and defiance against death. The song was recorded by
            - link "Mercedes Sosa" [ref=e1267] [cursor=pointer]:
              - /url: /wiki/Mercedes_Sosa
            - text: ", among other Latin American musicians."
          - paragraph [ref=e1268]:
            - text: In North America and Mexico, there is a well-known song, "
            - generic "Spanish-language text" [ref=e1269]: La Cigarra
            - text: "\" (\"The Cicada\"), written by"
            - link "Raymundo Perez Soto" [ref=e1270] [cursor=pointer]:
              - /url: https://es.wikipedia.org/wiki/Raymundo_P%C3%A9rez_y_Soto
            - text: ", which is a song in the"
            - link "Mariachi" [ref=e1271] [cursor=pointer]:
              - /url: /wiki/Mariachi
            - text: tradition, that romanticises the insect as a creature that sings until it dies.
            - superscript [ref=e1272]:
              - link "[94]" [ref=e1273] [cursor=pointer]:
                - /url: "#cite_note-98"
          - paragraph [ref=e1274]:
            - text: Brazilian artist
            - link "Lenine" [ref=e1275] [cursor=pointer]:
              - /url: /wiki/Lenine_(musician)
            - text: with his track "Malvadeza" from the album Chão, creates a song built upon the sound of the cicada that can be heard along the track.
            - superscript [ref=e1276]:
              - link "[95]" [ref=e1277] [cursor=pointer]:
                - /url: "#cite_note-99"
          - paragraph [ref=e1278]:
            - text: Cicada sounds heavily feature on the 2021 album
            - link "Solar Power" [ref=e1280] [cursor=pointer]:
              - /url: /wiki/Solar_Power_(album)
            - text: by New Zealand artist
            - link "Lorde" [ref=e1281] [cursor=pointer]:
              - /url: /wiki/Lorde
            - text: . She described cicada song as being emblematic of the New Zealand summer.
            - superscript [ref=e1282]:
              - link "[96]" [ref=e1283] [cursor=pointer]:
                - /url: "#cite_note-100"
          - generic [ref=e1284]:
            - heading "In mythology and folklore" [level=3] [ref=e1285]
            - generic [ref=e1286]:
              - text: "["
              - link "edit" [ref=e1287] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=18
              - text: "]"
          - note [ref=e1288]:
            - text: "Main article:"
            - link "Cicada (mythology)" [ref=e1289] [cursor=pointer]:
              - /url: /wiki/Cicada_(mythology)
          - figure "Jade cicada amulets. Western Han Dynasty 206 BCE – CE 8" [ref=e1290]:
            - link [ref=e1291] [cursor=pointer]:
              - /url: /wiki/File:Jade_cicada_amulets._Western_Han_Dynasty_206_BCE_-_CE_8.jpg
              - img [ref=e1292]
            - generic [ref=e1293]: Jade cicada amulets. Western Han Dynasty 206 BCE – CE 8
          - figure "Small crackle-glass vase, Émile Gallé, circa 1880. Decoration of a cicada on one side" [ref=e1294]:
            - link [ref=e1295] [cursor=pointer]:
              - /url: /wiki/File:Vase-craquele-Emile-Galle-vers-1880-decor-mante-religieuse-cigale-1301.jpg
              - img [ref=e1296]
            - generic [ref=e1297]: Small crackle-glass vase, Émile Gallé, circa 1880. Decoration of a cicada on one side
          - paragraph [ref=e1298]:
            - text: Cicadas have been used as money, in folk medicine, to forecast the weather, to provide song (in China), and in folklore and myths around the world.
            - superscript [ref=e1299]:
              - link "[97]" [ref=e1300] [cursor=pointer]:
                - /url: "#cite_note-101"
            - text: In France, the cicada represents the
            - link "folklore" [ref=e1301] [cursor=pointer]:
              - /url: /wiki/Folklore
            - text: of
            - link "Provence" [ref=e1302] [cursor=pointer]:
              - /url: /wiki/Provence
            - text: and the Mediterranean cities.
            - superscript [ref=e1303]:
              - link "[98]" [ref=e1304] [cursor=pointer]:
                - /url: "#cite_note-102"
          - paragraph [ref=e1305]:
            - text: The cicada has represented
            - link "insouciance" [ref=e1306] [cursor=pointer]:
              - /url: https://en.wiktionary.org/wiki/insouciance
            - text: since
            - link "classical antiquity" [ref=e1307] [cursor=pointer]:
              - /url: /wiki/Classical_antiquity
            - text: .
            - link "Jean de La Fontaine" [ref=e1308] [cursor=pointer]:
              - /url: /wiki/Jean_de_La_Fontaine
            - text: began his collection of fables Les fables de La Fontaine with the story "La Cigale et la Fourmi" ("The Cicada and the Ant") based on one of
            - link "Aesop" [ref=e1309] [cursor=pointer]:
              - /url: /wiki/Aesop
            - text: "'s fables; in it, the cicada spends the summer singing, while the ant stores away food, and the cicada finds herself without food when the weather turns bitter."
            - superscript [ref=e1310]:
              - link "[99]" [ref=e1311] [cursor=pointer]:
                - /url: "#cite_note-103"
          - paragraph [ref=e1312]:
            - text: In Chinese tradition, the cicada (
            - generic "Chinese-language text" [ref=e1313]: 蟬
            - text: ", chán) symbolises rebirth and immortality."
            - superscript [ref=e1314]:
              - link "[100]" [ref=e1315] [cursor=pointer]:
                - /url: "#cite_note-Riegel-104"
            - text: In the Chinese essay "
            - link "Thirty-Six Stratagems" [ref=e1316] [cursor=pointer]:
              - /url: /wiki/Thirty-Six_Stratagems
            - text: "\", the phrase \"to shed the golden cicada skin\" ("
            - link "simplified Chinese" [ref=e1317] [cursor=pointer]:
              - /url: /wiki/Simplified_Chinese_characters
            - text: ": 金蝉脱壳;"
            - link "traditional Chinese" [ref=e1318] [cursor=pointer]:
              - /url: /wiki/Traditional_Chinese_characters
            - text: ": 金蟬脫殼;"
            - link "pinyin" [ref=e1319] [cursor=pointer]:
              - /url: /wiki/Pinyin
            - text: ":"
            - generic [ref=e1320]: jīnchán tuōqiào
            - text: ) is the poetic name for using a decoy (leaving the exuviae) to fool enemies.
            - superscript [ref=e1321]:
              - link "[101]" [ref=e1322] [cursor=pointer]:
                - /url: "#cite_note-105"
            - text: In the Chinese classic novel
            - link "Journey to the West" [ref=e1324] [cursor=pointer]:
              - /url: /wiki/Journey_to_the_West
            - text: (16th century), the protagonist Priest of Tang was named the Golden Cicada.
            - superscript [ref=e1325]:
              - link "[102]" [ref=e1326] [cursor=pointer]:
                - /url: "#cite_note-106"
          - paragraph [ref=e1327]:
            - text: In Japan, the cicada is associated with the summer season.
            - superscript [ref=e1328]:
              - link "[103]" [ref=e1329] [cursor=pointer]:
                - /url: "#cite_note-107"
            - text: For many Japanese people, summer hasn't officially begun until the first songs of the cicada are heard.
            - superscript [ref=e1330]:
              - link "[104]" [ref=e1331] [cursor=pointer]:
                - /url: "#cite_note-108"
            - text: According to
            - link "Lafcadio Hearn" [ref=e1332] [cursor=pointer]:
              - /url: /wiki/Lafcadio_Hearn
            - text: ", the song of"
            - link "Meimuna opalifera" [ref=e1334] [cursor=pointer]:
              - /url: /wiki/Meimuna_opalifera
            - text: ", called tsuku-tsuku boshi, is said to indicate the end of summer, and it is called so because of its particular call."
            - superscript [ref=e1335]:
              - link "[105]" [ref=e1336] [cursor=pointer]:
                - /url: "#cite_note-Hearn2007-109"
          - paragraph [ref=e1337]:
            - text: In the
            - link "Homeric Hymn to Aphrodite" [ref=e1338] [cursor=pointer]:
              - /url: /wiki/Homeric_Hymns
            - text: ", the goddess"
            - link "Aphrodite" [ref=e1339] [cursor=pointer]:
              - /url: /wiki/Aphrodite
            - text: retells the legend of how
            - link "Eos" [ref=e1340] [cursor=pointer]:
              - /url: /wiki/Eos
            - text: ", the goddess of the dawn, requested"
            - link "Zeus" [ref=e1341] [cursor=pointer]:
              - /url: /wiki/Zeus
            - text: to let her lover
            - link "Tithonus" [ref=e1342] [cursor=pointer]:
              - /url: /wiki/Tithonus
            - text: live forever as an
            - link "immortal" [ref=e1343] [cursor=pointer]:
              - /url: /wiki/Immortality
            - text: .
            - superscript [ref=e1344]:
              - link "[106]" [ref=e1345] [cursor=pointer]:
                - /url: "#cite_note-DuBois-110"
            - text: Zeus granted her request, but because Eos forgot to ask him to also make Tithonus ageless, Tithonus never died, but he did grow old.
            - superscript [ref=e1346]:
              - link "[106]" [ref=e1347] [cursor=pointer]:
                - /url: "#cite_note-DuBois-110"
            - text: Eventually, he became so tiny and shriveled that he turned into the first cicada.
            - superscript [ref=e1348]:
              - link "[106]" [ref=e1349] [cursor=pointer]:
                - /url: "#cite_note-DuBois-110"
            - text: The Greeks also used a cicada sitting on a harp as an emblem of music.
            - superscript [ref=e1350]:
              - link "[107]" [ref=e1351] [cursor=pointer]:
                - /url: "#cite_note-111"
          - paragraph [ref=e1352]:
            - text: In Kapampangan mythology in the
            - link "Philippines" [ref=e1353] [cursor=pointer]:
              - /url: /wiki/Philippines
            - text: ", the goddess of dusk, Sisilim, is said to be greeted by the sounds and appearances of cicadas whenever she appears."
            - superscript [ref=e1354]:
              - link "[108]" [ref=e1355] [cursor=pointer]:
                - /url: "#cite_note-auto17-112"
          - generic [ref=e1356]:
            - heading "As pests" [level=3] [ref=e1357]
            - generic [ref=e1358]:
              - text: "["
              - link "edit" [ref=e1359] [cursor=pointer]:
                - /url: /w/index.php?title=Cicada&action=edit&section=19
              - text: "]"
          - figure "Platylomia flavida, 2003 stamp" [ref=e1360]:
            - link [ref=e1361] [cursor=pointer]:
              - /url: /wiki/File:Platylomia_flavida_2003_Indonesia_stamp.jpg
              - img [ref=e1362]
            - generic [ref=e1363]: Platylomia flavida, 2003 stamp
          - paragraph [ref=e1364]:
            - text: Cicadas feed on
            - link "sap" [ref=e1365] [cursor=pointer]:
              - /url: /wiki/Sap
            - text: ; they do not
            - link "bite" [ref=e1366] [cursor=pointer]:
              - /url: /wiki/Bite
            - text: or
            - link "sting" [ref=e1367] [cursor=pointer]:
              - /url: /wiki/Stinger
            - text: in a true sense but may occasionally mistake a person's arm for a plant limb and attempt to feed, sometimes causing slight discomfort.
            - superscript [ref=e1368]:
              - link "[109]" [ref=e1369] [cursor=pointer]:
                - /url: "#cite_note-113"
            - text: Male cicadas produce very loud calls that can damage human hearing.
            - superscript [ref=e1370]:
              - link "[110]" [ref=e1371] [cursor=pointer]:
                - /url: "#cite_note-114"
          - paragraph [ref=e1372]:
            - text: Cicadas are not major agricultural pests, but in some outbreak years, trees may be overwhelmed by the sheer numbers of females laying their eggs in the shoots. Small trees may wilt and larger trees may lose small branches.
            - superscript [ref=e1373]:
              - link "[28]" [ref=e1374] [cursor=pointer]:
                - /url: "#cite_note-Capinera-31"
            - text: Although in general, the feeding activities of the nymphs do little damage, during the year before an outbreak of periodic cicadas, the large nymphs feed heavily and plant growth may suffer.
            - superscript [ref=e1375]:
              - link "[111]" [ref=e1376] [cursor=pointer]:
                - /url: "#cite_note-Yang-115"
            - text: Some species have turned from wild grasses to
            - link "sugarcane" [ref=e1377] [cursor=pointer]:
              - /url: /wiki/Sugarcane
            - text: ", which affects the crop adversely, and in a few isolated cases, females have oviposited on"
            - link "cash crops" [ref=e1378] [cursor=pointer]:
              - /url: /wiki/Cash_crop
            - text: such as
            - link "date palms" [ref=e1379] [cursor=pointer]:
              - /url: /wiki/Date_palm
            - text: ","
            - link "grape" [ref=e1380] [cursor=pointer]:
              - /url: /wiki/Grape
            - text: vines,
            - link "citrus" [ref=e1381] [cursor=pointer]:
              - /url: /wiki/Citrus
            - text: trees,
            - link "asparagus" [ref=e1382] [cursor=pointer]:
              - /url: /wiki/Asparagus
            - text: ", and"
            - link "cotton" [ref=e1383] [cursor=pointer]:
              - /url: /wiki/Cotton
            - text: .
            - superscript [ref=e1384]:
              - link "[28]" [ref=e1385] [cursor=pointer]:
                - /url: "#cite_note-Capinera-31"
          - paragraph [ref=e1386]:
            - text: Cicadas sometimes cause damage to ornamental shrubs and trees, mainly in the form of scarring left on tree branches where the females have laid their eggs. Branches of young trees may die as a result.
            - superscript [ref=e1387]:
              - link "[112]" [ref=e1388] [cursor=pointer]:
                - /url: "#cite_note-116"
            - superscript [ref=e1389]:
              - link "[113]" [ref=e1390] [cursor=pointer]:
                - /url: "#cite_note-OhioCultivator-117"
            - superscript [ref=e1391]:
              - text: "["
              - link "failed verification" [ref=e1393] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Verifiability
              - text: "]"
