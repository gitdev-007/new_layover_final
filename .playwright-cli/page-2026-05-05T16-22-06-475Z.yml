              - text: "]"
          - generic [ref=e449]:
            - link "Wiktionary logo" [ref=e452] [cursor=pointer]:
              - /url: /wiki/File:Wiktionary-logo-en-v2.svg
              - img "Wiktionary logo" [ref=e453]
