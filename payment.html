<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | LayoverX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#2952FF',
                        surface: '#FFFFFF',
                        background: '#F8FAFC',
                        text: '#0F172A',
                        textLight: '#64748B'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
    </style>
</head>
<body class="text-text min-h-screen">
    <!-- Navbar -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-16 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tighter text-text">LAYOVERX</h1>
            <div class="w-8 h-8 rounded-full bg-gray-100"></div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12">
        <div class="mb-10">
            <h2 class="text-3xl font-semibold mb-2">Complete Your Journey</h2>
            <p class="text-textLight">One secure payment for your entire layover itinerary.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
            <!-- Left Side: Summary -->
            <div class="lg:col-span-7 space-y-8">
                <!-- Itinerary Card -->
                <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm">
                    <h3 class="font-semibold text-lg mb-6">Your Finalized Itinerary</h3>
                    <div id="itinerary-list" class="space-y-4">
                        <!-- Items injected by JS -->
                    </div>
                </div>

                <!-- Price Breakdown -->
                <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm">
                    <h3 class="font-semibold text-lg mb-6">Price Breakdown</h3>
                    <div id="price-list" class="space-y-3 text-sm">
                        <!-- Prices injected by JS -->
                    </div>
                    <div class="border-t border-gray-100 mt-6 pt-6 flex justify-between items-center font-bold text-lg">
                        <span>TOTAL</span>
                        <span id="total-price" class="text-brand">₹8,999</span>
                    </div>
                </div>
            </div>

            <!-- Right Side: Payment Panel -->
            <div class="lg:col-span-5">
                <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-lg sticky top-24">
                    <h3 class="font-semibold text-lg mb-6">Payment Method</h3>
                    
                    <div class="flex gap-2 p-1 bg-gray-50 rounded-xl mb-6">
                        <button class="flex-1 py-2.5 text-xs font-medium rounded-lg bg-white shadow-sm text-brand">Card</button>
                        <button class="flex-1 py-2.5 text-xs font-medium text-textLight">UPI</button>
                        <button class="flex-1 py-2.5 text-xs font-medium text-textLight">Apple Pay</button>
                    </div>

                    <div class="space-y-4">
                        <input type="text" placeholder="Cardholder Name" class="w-full p-4 rounded-xl border border-gray-200 text-sm">
                        <input type="text" placeholder="Card Number" class="w-full p-4 rounded-xl border border-gray-200 text-sm">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" placeholder="MM/YY" class="p-4 rounded-xl border border-gray-200 text-sm">
                            <input type="text" placeholder="CVV" class="p-4 rounded-xl border border-gray-200 text-sm">
                        </div>
                    </div>

                    <button onclick="showSuccess()" class="w-full mt-8 py-4 bg-brand text-white rounded-xl font-semibold hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                        Pay & Confirm Journey
                    </button>

                    <div class="mt-6 flex items-center justify-center gap-4 text-xs text-textLight">
                        <span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">lock</span> 256-bit Encrypted</span>
                        <span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">verified</span> PCI Compliant</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Success Overlay -->
    <div id="success-state" class="hidden fixed inset-0 bg-white z-50 flex items-center justify-center">
        <div class="text-center">
            <div class="w-20 h-20 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6 text-green-500">
                <span class="material-symbols-outlined text-5xl">check</span>
            </div>
            <h2 class="text-2xl font-semibold mb-2">Your Layover Journey is Confirmed</h2>
            <p class="text-textLight mb-8">Booking Reference: <span class="font-bold text-text">LX-98234-AX</span></p>
            <button onclick="window.location.href='index.html'" class="px-8 py-3 bg-gray-900 text-white rounded-xl">Back to Dashboard</button>
        </div>
    </div>

    <script>
        // Populate with shared state data
        const state = JSON.parse(localStorage.getItem('itineraryState') || '{"activities":[]}');
        
        const list = document.getElementById('itinerary-list');
        state.activities.forEach((item, i) => {
            list.innerHTML += `
                <div class="flex items-center gap-4 py-2 border-b border-gray-50 last:border-0">
                    <div class="w-10 h-10 bg-gray-50 rounded-lg flex items-center justify-center text-xs font-bold text-gray-400">${i+1}</div>
                    <div class="flex-grow">
                        <p class="text-sm font-semibold">${item.name}</p>
                        <p class="text-[10px] text-textLight uppercase">${item.category} • ${item.duration}</p>
                    </div>
                    <span class="text-sm font-semibold">₹${1200 + (i*1000)}</span>
                </div>
            `;
        });

        function showSuccess() {
            document.getElementById('success-state').classList.remove('hidden');
        }
    </script>
</body>
</html>
